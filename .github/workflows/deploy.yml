name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Decode SSH key into env var
        id: decode
        run: |
          DECODED_KEY=$(echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d)
          echo "First line check:"
          echo "$DECODED_KEY" | head -1
          echo "Last line check:"
          echo "$DECODED_KEY" | tail -1
          echo "Line count: $(echo "$DECODED_KEY" | wc -l)"
          # Stocker la clé décodée dans un fichier multi-lignes pour usage ultérieur
          {
            echo 'DECODED_SSH_KEY<<EOF_KEY'
            echo "$DECODED_KEY"
            echo 'EOF_KEY'
          } >> $GITHUB_ENV

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ env.DECODED_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            set -e
            echo "=== Pull du dernier code ==="
            cd /var/www/krobar.online
            git fetch origin main
            git reset --hard origin/main
            echo ""
            echo "=== Installation des dependances ==="
            npm install
            echo ""
            echo "=== Build Vite ==="
            npm run build
            echo ""
            echo "=== Deploiement termine ==="
            ls -la dist/ | head -5
