<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="Plus Jakarta Sans, system-ui, sans-serif">
  <rect width="1040" height="600" fill="var(--bg)"/>
  <text x="105" y="72" font-size="13" font-weight="600" fill="var(--text)" opacity="0.55" style="text-transform: uppercase;">5 Forces de Porter</text>
  <foreignObject x="60" y="90" width="920" height="56">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="width:100%;height:100%;display:flex;align-items:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:36px;color:var(--text);box-sizing:border-box;">Analyse concurrentielle</div>
  </foreignObject>
  
  <!-- Center: Industry rivalry -->
  <rect x="420" y="280" width="200" height="100" rx="12" fill="var(--primary)" fill-opacity="0.1" stroke="var(--primary)" stroke-width="2" id="center_force">
  <foreignObject x="430" y="310" width="180" height="40" data-shape="center_force">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="center_force" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Rivalité concurrentielle</div>
  </foreignObject>
  
  <!-- Top: Threat of new entrants -->
  <rect x="420" y="160" width="200" height="80" rx="12" fill="var(--accent)" fill-opacity="0.1" stroke="var(--accent)" stroke-width="2" id="top_force">
  <foreignObject x="430" y="180" width="180" height="40" data-shape="top_force">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="top_force" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Nouveaux entrants</div>
  </foreignObject>
  
  <!-- Left: Bargaining power of suppliers -->
  <rect x="160" y="280" width="200" height="100" rx="12" fill="var(--accent)" fill-opacity="0.1" stroke="var(--accent)" stroke-width="2" id="left_force">
  <foreignObject x="170" y="310" width="180" height="40" data-shape="left_force">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="left_force" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Pouvoir fournisseurs</div>
  </foreignObject>
  
  <!-- Right: Bargaining power of customers -->
  <rect x="680" y="280" width="200" height="100" rx="12" fill="var(--accent)" fill-opacity="0.1" stroke="var(--accent)" stroke-width="2" id="right_force">
  <foreignObject x="690" y="310" width="180" height="40" data-shape="right_force">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="right_force" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Pouvoir clients</div>
  </foreignObject>
  
  <!-- Bottom: Threat of substitutes -->
  <rect x="420" y="420" width="200" height="80" rx="12" fill="var(--accent)" fill-opacity="0.1" stroke="var(--accent)" stroke-width="2" id="bottom_force">
  <foreignObject x="430" y="440" width="180" height="40" data-shape="bottom_force">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="bottom_force" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Produits substituts</div>
  </foreignObject>
  
  <text x="60" y="580" font-size="11" font-weight="600" fill="var(--text)" opacity="0.5" style="text-transform: uppercase;">Krobar · Strategy</text>
</svg>
