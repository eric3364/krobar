<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Inter, system-ui, sans-serif">
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ff-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--text)" opacity="0.6"/>
    </marker>
  </defs>

  <rect width="800" height="600" fill="var(--bg)"/>

  <foreignObject x="20" y="10" width="760" height="50">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:clamp(18px,3cqw,26px);color:var(--text);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Les 5 forces de Porter</div>
  </foreignObject>

  <!-- Connector arrows from outer boxes pointing toward central pentagon -->
  <line x1="400" y1="160" x2="400" y2="245" stroke="var(--text)" stroke-width="2" opacity="0.5" marker-end="url(#ff-arrow)"/>
  <line x1="170" y1="320" x2="305" y2="320" stroke="var(--text)" stroke-width="2" opacity="0.5" marker-end="url(#ff-arrow)"/>
  <line x1="630" y1="320" x2="495" y2="320" stroke="var(--text)" stroke-width="2" opacity="0.5" marker-end="url(#ff-arrow)"/>
  <line x1="400" y1="495" x2="400" y2="395" stroke="var(--text)" stroke-width="2" opacity="0.5" marker-end="url(#ff-arrow)"/>

  <!-- Central pentagon (radius ~95) centered at (400, 320) -->
  <g filter="url(#soft-shadow)">
    <polygon points="400,225 491,291 456,398 344,398 309,291" fill="var(--primary)"/>
  </g>
  <foreignObject x="305" y="245" width="190" height="150">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="central_force" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:clamp(12px,2.2cqw,16px);color:var(--bg);padding:10px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Rivalité concurrentielle</div>
  </foreignObject>

  <!-- Top: New entrants -->
  <g filter="url(#soft-shadow)">
    <rect x="270" y="70" width="260" height="90" rx="12" fill="var(--accent)" opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
  </g>
  <foreignObject x="270" y="70" width="260" height="90">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="new_entrants" style="container-type:inline-size;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(11px,1.8cqw,14px);color:var(--text);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Menace nouveaux entrants</div>
  </foreignObject>

  <!-- Left: Suppliers -->
  <g filter="url(#soft-shadow)">
    <rect x="10" y="275" width="160" height="110" rx="12" fill="var(--accent)" opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
  </g>
  <foreignObject x="10" y="275" width="160" height="110">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="suppliers" style="container-type:inline-size;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(11px,2.2cqw,14px);color:var(--text);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Pouvoir des fournisseurs</div>
  </foreignObject>

  <!-- Right: Buyers -->
  <g filter="url(#soft-shadow)">
    <rect x="630" y="275" width="160" height="110" rx="12" fill="var(--accent)" opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
  </g>
  <foreignObject x="630" y="275" width="160" height="110">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="buyers" style="container-type:inline-size;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(11px,2.2cqw,14px);color:var(--text);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Pouvoir des clients</div>
  </foreignObject>

  <!-- Bottom: Substitutes -->
  <g filter="url(#soft-shadow)">
    <rect x="270" y="495" width="260" height="90" rx="12" fill="var(--accent)" opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
  </g>
  <foreignObject x="270" y="495" width="260" height="90">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="substitutes" style="container-type:inline-size;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(11px,1.8cqw,14px);color:var(--text);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Menace des substituts</div>
  </foreignObject>
</svg>
