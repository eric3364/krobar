<svg viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg">
  <style>
    .label-strong { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: 600; }
    .label { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 13px; font-weight: 500; }
    .gloss { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 11px; font-weight: 400; font-style: italic; fill: var(--muted); }
    .gloss-strong { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 11px; font-weight: 500; }
    .caption { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 10px; font-weight: 400; font-style: italic; fill: var(--muted); }
    .axis { stroke: var(--border); stroke-width: 0.6; fill: none; }
  </style>

  <defs>
    <marker id="arrowb5a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowb5b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="var(--cool)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <line x1="340" y1="60" x2="340" y2="380" stroke="var(--border)" stroke-width="0.6" stroke-dasharray="3 3"/>
  <text x="170" y="55" class="label-strong" text-anchor="middle" fill="var(--text)">{{regime_left_title}}</text>
  <text x="170" y="73" class="caption" text-anchor="middle">{{regime_left_subtitle}}</text>
  <rect x="120" y="100" width="100" height="40" rx="4" fill="var(--bg)" stroke="var(--muted)" stroke-width="1.4"/>
  <text x="170" y="123" class="gloss-strong" text-anchor="middle" dominant-baseline="central" fill="var(--text)">{{level_top}}</text>
  <rect x="120" y="180" width="100" height="40" rx="4" fill="var(--bg)" stroke="var(--muted)" stroke-width="1.4"/>
  <text x="170" y="203" class="gloss-strong" text-anchor="middle" dominant-baseline="central" fill="var(--text)">{{level_middle}}</text>
  <rect x="120" y="260" width="100" height="40" rx="4" fill="var(--bg)" stroke="var(--muted)" stroke-width="1.4"/>
  <text x="170" y="283" class="gloss-strong" text-anchor="middle" dominant-baseline="central" fill="var(--text)">{{level_bottom}}</text>
  <line x1="98" y1="280" x2="98" y2="120" stroke="var(--muted)" stroke-width="0.9" marker-end="url(#arrowb5a)"/>
  <text x="60" y="200" class="gloss" text-anchor="middle">{{flow_left_label_1}}</text>
  <text x="60" y="218" class="gloss" text-anchor="middle">{{flow_left_label_2}}</text>
  <line x1="240" y1="120" x2="240" y2="280" stroke="var(--muted)" stroke-width="0.9" marker-end="url(#arrowb5a)"/>
  <text x="278" y="200" class="gloss" text-anchor="middle">{{flow_left_label_3}}</text>
  <text x="278" y="218" class="gloss" text-anchor="middle">{{flow_left_label_4}}</text>
  <text x="170" y="345" class="caption" text-anchor="middle">{{regime_left_summary_1}}</text>
  <text x="170" y="363" class="caption" text-anchor="middle">{{regime_left_summary_2}}</text>
  <text x="510" y="55" class="label-strong" text-anchor="middle" fill="var(--cool)">{{regime_right_title}}</text>
  <text x="510" y="73" class="caption" text-anchor="middle">{{regime_right_subtitle}}</text>
  <rect x="460" y="100" width="100" height="40" rx="4" fill="var(--bg)" stroke="var(--cool)" stroke-width="1.6"/>
  <text x="510" y="123" class="gloss-strong" text-anchor="middle" dominant-baseline="central" fill="var(--cool)">{{level_top_right}}</text>
  <circle cx="600" cy="120" r="6" fill="var(--bg)" stroke="var(--cool)" stroke-width="0.9"/>
  <line x1="595" y1="120" x2="605" y2="120" stroke="var(--cool)" stroke-width="0.9"/>
  <line x1="600" y1="115" x2="600" y2="125" stroke="var(--cool)" stroke-width="0.9"/>
  <rect x="460" y="180" width="100" height="40" rx="4" fill="var(--bg)" stroke="var(--cool)" stroke-width="1.6"/>
  <text x="510" y="203" class="gloss-strong" text-anchor="middle" dominant-baseline="central" fill="var(--cool)">{{level_middle_right}}</text>
  <circle cx="600" cy="200" r="6" fill="var(--bg)" stroke="var(--cool)" stroke-width="0.9"/>
  <line x1="595" y1="200" x2="605" y2="200" stroke="var(--cool)" stroke-width="0.9"/>
  <line x1="600" y1="195" x2="600" y2="205" stroke="var(--cool)" stroke-width="0.9"/>
  <rect x="460" y="260" width="100" height="40" rx="4" fill="var(--bg)" stroke="var(--cool)" stroke-width="1.6"/>
  <text x="510" y="283" class="gloss-strong" text-anchor="middle" dominant-baseline="central" fill="var(--cool)">{{level_bottom_right}}</text>
  <circle cx="600" cy="280" r="6" fill="var(--bg)" stroke="var(--cool)" stroke-width="0.9"/>
  <line x1="595" y1="280" x2="605" y2="280" stroke="var(--cool)" stroke-width="0.9"/>
  <line x1="600" y1="275" x2="600" y2="285" stroke="var(--cool)" stroke-width="0.9"/>
  <line x1="510" y1="140" x2="510" y2="180" stroke="var(--cool)" stroke-width="1.2" marker-end="url(#arrowb5b)"/>
  <line x1="510" y1="220" x2="510" y2="260" stroke="var(--cool)" stroke-width="1.2" marker-end="url(#arrowb5b)"/>
  <line x1="565" y1="120" x2="595" y2="120" stroke="var(--cool)" stroke-width="0.8" stroke-dasharray="3 2"/>
  <line x1="565" y1="200" x2="595" y2="200" stroke="var(--cool)" stroke-width="0.8" stroke-dasharray="3 2"/>
  <line x1="565" y1="280" x2="595" y2="280" stroke="var(--cool)" stroke-width="0.8" stroke-dasharray="3 2"/>
  <text x="445" y="345" class="caption" text-anchor="middle">{{regime_right_summary_1}}</text>
  <text x="445" y="363" class="caption" text-anchor="middle">{{regime_right_summary_2}}</text>
  <text x="610" y="120" class="gloss" dominant-baseline="central" fill="var(--cool)">{{measure_label_1}}</text>
  <text x="610" y="200" class="gloss" dominant-baseline="central" fill="var(--cool)">{{measure_label_2}}</text>
  <text x="610" y="280" class="gloss" dominant-baseline="central" fill="var(--cool)">{{measure_label_3}}</text>
  <text x="40" y="425" class="caption">{{caption}}</text>
</svg>