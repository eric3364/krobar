<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="Plus Jakarta Sans, system-ui, sans-serif">
  <defs>
    <filter id="editorialShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="var(--primary)" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="1040" height="600" fill="var(--bg)"/>

  <!-- Header icon + label -->
  <g transform="translate(60, 60)" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="12" cy="12" r="10"/>
    <path d="M12 2 L12 12 L20 12"/>
  </g>

  <text x="105" y="72" font-size="13" font-weight="600" letter-spacing="1.04" fill="var(--text)" opacity="0.55" style="text-transform: uppercase;">Graphique Circulaire</text>

  <!-- Main title -->
  <foreignObject x="60" y="90" width="920" height="56">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:36px;letter-spacing:-0.01em;color:var(--text);box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Répartition du budget marketing 2024</div>
  </foreignObject>

  <!-- Accent line -->
  <line x1="60" y1="160" x2="148" y2="160" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>

  <!-- Pie chart center -->
  <g transform="translate(400, 350)">
    <!-- Segment 1: 45% (Digital) - 0° to 162° -->
    <path d="M 0,-120 A 120,120 0 0,1 113.1,46.9 L 0,0 Z" 
          fill="var(--primary)" fill-opacity="0.8" 
          stroke="var(--bg)" stroke-width="2"/>
    
    <!-- Segment 2: 25% (Traditional) - 162° to 252° -->
    <path d="M 113.1,46.9 A 120,120 0 0,1 37.1,113.1 L 0,0 Z" 
          fill="var(--accent)" fill-opacity="0.8"
          stroke="var(--bg)" stroke-width="2"/>
    
    <!-- Segment 3: 20% (Events) - 252° to 324° -->
    <path d="M 37.1,113.1 A 120,120 0 0,1 -84.9,-84.9 L 0,0 Z" 
          fill="var(--primary)" fill-opacity="0.4"
          stroke="var(--bg)" stroke-width="2"/>
    
    <!-- Segment 4: 10% (Other) - 324° to 360° -->
    <path d="M -84.9,-84.9 A 120,120 0 0,1 0,-120 L 0,0 Z" 
          fill="var(--accent)" fill-opacity="0.4"
          stroke="var(--bg)" stroke-width="2"/>
  </g>

  <!-- Center label -->
  <foreignObject x="360" y="330" width="80" height="40">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="center_label" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);line-height:1.2;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">100%</div>
  </foreignObject>

  <!-- Legend with anti-collision safe zones -->
  <!-- Segment 1 legend - Zone sécurisée 180px -->
  <rect x="580" y="280" width="16" height="16" fill="var(--primary)" fill-opacity="0.8" rx="2"/>
  <foreignObject x="605" y="275" width="180" height="26">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="segment_1_label" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);line-height:1.2;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Digital</div>
  </foreignObject>
  <foreignObject x="835" y="275" width="80" height="26">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="segment_1_value" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:400;font-size:16px;color:var(--text);opacity:0.7;line-height:1.2;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">45%</div>
  </foreignObject>

  <!-- Segment 2 legend - Zone sécurisée -->
  <rect x="580" y="320" width="16" height="16" fill="var(--accent)" fill-opacity="0.8" rx="2"/>
  <foreignObject x="605" y="315" width="180" height="26">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="segment_2_label" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);line-height:1.2;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Traditionnel</div>
  </foreignObject>
  <foreignObject x="835" y="315" width="80" height="26">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="segment_2_value" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:400;font-size:16px;color:var(--text);opacity:0.7;line-height:1.2;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">25%</div>
  </foreignObject>

  <!-- Segment 3 legend - Zone sécurisée -->
  <rect x="580" y="360" width="16" height="16" fill="var(--primary)" fill-opacity="0.4" rx="2"/>
  <foreignObject x="605" y="355" width="180" height="26">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="segment_3_label" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);line-height:1.2;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Événements</div>
  </foreignObject>
  <foreignObject x="835" y="355" width="80" height="26">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="segment_3_value" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:400;font-size:16px;color:var(--text);opacity:0.7;line-height:1.2;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">20%</div>
  </foreignObject>

  <!-- Segment 4 legend - Zone sécurisée -->
  <rect x="580" y="400" width="16" height="16" fill="var(--accent)" fill-opacity="0.4" rx="2"/>
  <foreignObject x="605" y="395" width="180" height="26">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="segment_4_label" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);line-height:1.2;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Autres</div>
  </foreignObject>
  <foreignObject x="835" y="395" width="80" height="26">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="segment_4_value" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:400;font-size:16px;color:var(--text);opacity:0.7;line-height:1.2;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">10%</div>
  </foreignObject>

  <!-- Footer -->
  <text x="60" y="580" font-size="11" font-weight="600" letter-spacing="0.88" fill="var(--text)" opacity="0.5" style="text-transform: uppercase;">Krobar · Charts</text>
</svg>
