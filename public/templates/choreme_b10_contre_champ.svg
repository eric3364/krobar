<svg viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg">
  <style>
    .label-strong { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: 600; }
    .label { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 13px; font-weight: 500; }
    .gloss { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 11px; font-weight: 400; font-style: italic; fill: var(--muted); }
    .gloss-strong { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 11px; font-weight: 500; }
    .caption { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 10px; font-weight: 400; font-style: italic; fill: var(--muted); }
    .axis { stroke: var(--border); stroke-width: 0.6; fill: none; }
  </style>

  <defs>
    <pattern id="hatchb10" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="var(--tertiary)" stroke-width="0.6" opacity="0.5"/>
    </pattern>
  </defs>
  <line x1="180" y1="120" x2="290" y2="200" stroke="var(--tertiary)" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="280" y1="125" x2="280" y2="175" stroke="var(--tertiary)" stroke-width="0.6"/>
  <line x1="285" y1="135" x2="275" y2="165" stroke="var(--tertiary)" stroke-width="0.6"/>
  <line x1="500" y1="120" x2="395" y2="200" stroke="var(--tertiary)" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="450" y1="125" x2="450" y2="175" stroke="var(--tertiary)" stroke-width="0.6"/>
  <line x1="455" y1="135" x2="445" y2="165" stroke="var(--tertiary)" stroke-width="0.6"/>
  <line x1="180" y1="340" x2="290" y2="265" stroke="var(--tertiary)" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="280" y1="285" x2="280" y2="335" stroke="var(--tertiary)" stroke-width="0.6"/>
  <line x1="285" y1="295" x2="275" y2="325" stroke="var(--tertiary)" stroke-width="0.6"/>
  <line x1="500" y1="340" x2="395" y2="265" stroke="var(--tertiary)" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="450" y1="285" x2="450" y2="335" stroke="var(--tertiary)" stroke-width="0.6"/>
  <line x1="455" y1="295" x2="445" y2="325" stroke="var(--tertiary)" stroke-width="0.6"/>
  <circle cx="340" cy="230" r="70" fill="var(--bg)" stroke="var(--primary)" stroke-width="2.5"/>
  <text x="340" y="226" class="label-strong" text-anchor="middle" dominant-baseline="central" fill="var(--primary)">{{center_line1}}</text>
  <text x="340" y="244" class="gloss-strong" text-anchor="middle" dominant-baseline="central" fill="var(--primary)">{{center_line2}}</text>
  <rect x="50" y="80" width="180" height="60" fill="url(#hatchb10)" stroke="var(--tertiary)" stroke-width="0.8" stroke-dasharray="2 3"/>
  <text x="140" y="105" class="gloss-strong" text-anchor="middle" dominant-baseline="central" fill="var(--tertiary)">{{absence_1}}</text>
  <text x="140" y="123" class="gloss" text-anchor="middle" dominant-baseline="central">{{absence_1_gloss}}</text>
  <rect x="450" y="80" width="180" height="60" fill="url(#hatchb10)" stroke="var(--tertiary)" stroke-width="0.8" stroke-dasharray="2 3"/>
  <text x="540" y="105" class="gloss-strong" text-anchor="middle" dominant-baseline="central" fill="var(--tertiary)">{{absence_2}}</text>
  <text x="540" y="123" class="gloss" text-anchor="middle" dominant-baseline="central">{{absence_2_gloss}}</text>
  <rect x="50" y="320" width="180" height="60" fill="url(#hatchb10)" stroke="var(--tertiary)" stroke-width="0.8" stroke-dasharray="2 3"/>
  <text x="140" y="345" class="gloss-strong" text-anchor="middle" dominant-baseline="central" fill="var(--tertiary)">{{absence_3}}</text>
  <text x="140" y="363" class="gloss" text-anchor="middle" dominant-baseline="central">{{absence_3_gloss}}</text>
  <rect x="450" y="320" width="180" height="60" fill="url(#hatchb10)" stroke="var(--tertiary)" stroke-width="0.8" stroke-dasharray="2 3"/>
  <text x="540" y="345" class="gloss-strong" text-anchor="middle" dominant-baseline="central" fill="var(--tertiary)">{{absence_4}}</text>
  <text x="540" y="363" class="gloss" text-anchor="middle" dominant-baseline="central">{{absence_4_gloss}}</text>
  <text x="40" y="425" class="caption">{{caption}}</text>
</svg>