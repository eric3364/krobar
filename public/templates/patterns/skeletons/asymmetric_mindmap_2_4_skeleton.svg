    <foreignObject x="18" y="130" width="250" height="70">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">{{block_left_1_content}}</div>
    </foreignObject>
  </g>
  <g class="krobar-slot" data-slot-key="block_left_2_content">
