    </foreignObject>
  </g>
  <g class="krobar-slot" data-slot-key="block_right_2_content">
    <rect x="756" y="276" width="250" height="70" class="krobar-bbox-fill krobar-bbox-stroke"/>
    <foreignObject x="756" y="276" width="250" height="70">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">{{block_right_2_content}}</div>
    </foreignObject>
  </g>
  <g class="krobar-slot" data-slot-key="block_right_3_content">
    <rect x="756" y="422" width="250" height="70" class="krobar-bbox-fill krobar-bbox-stroke"/>
    <foreignObject x="756" y="422" width="250" height="70">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">{{block_right_3_content}}</div>
    </foreignObject>
  </g>
  <g class="krobar-slot" data-slot-key="block_right_4_content">
    <rect x="756" y="568" width="250" height="70" class="krobar-bbox-fill krobar-bbox-stroke"/>
    <foreignObject x="756" y="568" width="250" height="70">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">{{block_right_4_content}}</div>
    </foreignObject>
  </g>

  <!-- Nœud central (double cadre) -->
  <g class="krobar-slot" data-slot-key="block_central_content">
    <ellipse cx="512" cy="384" rx="120" ry="60" fill="white" stroke="#0f172a" stroke-width="3"/>
    <ellipse cx="512" cy="384" rx="113" ry="53" fill="none" stroke="#0f172a" stroke-width="0.8"/>
    <foreignObject x="404" y="334" width="216" height="100">
      <div xmlns="http://www.w3.org/1999/xhtml" class="am-center-title-fo">{{block_central_content}}</div>
