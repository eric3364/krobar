<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-svg-kr-version="2.1" data-archetype="carrefour_binaire" data-cardinality="2">
  <metadata>
    <krobar-meta>
      <family>OPPOSITION_TRANSFORMATION</family>
      <cardinality>BINAIRE</cardinality>
      <regime>SEMI_METAPHORIQUE</regime>
      <cells>OPPOSITION_TRANSFORMATION_BINAIRE_SEMI_METAPHORIQUE</cells>
    </krobar-meta>
  </metadata>
  <style>
    .kr-line { fill:none; stroke:#1a1a1a; stroke-width:1.6; }
    .kr-box  { fill:#ffffff; stroke:#1a1a1a; stroke-width:1.6; }
    .kr-hub  { fill:#ffffff; stroke:#1a1a1a; stroke-width:2.4; }
    .kr-fillblock { fill:#1a1a1a; }
    .kr-title { font-family:Poppins,sans-serif; font-weight:700; font-size:26px; fill:#1a1a1a; letter-spacing:1px; }
    .krobar-slot-content { font-family:Poppins,sans-serif; font-size:15px; color:#1a1a1a; line-height:1.2; display:flex; align-items:center; justify-content:center; text-align:center; width:100%; height:100%; box-sizing:border-box; padding:4px; overflow-wrap:anywhere; word-break:break-word; hyphens:auto; }
    .kr-on-dark { color:#ffffff; }
    .kr-hub-content { font-weight:600; font-size:18px; }
  </style>

  <text x="512" y="44" text-anchor="middle" class="kr-title">CARREFOUR</text>
  <line class="kr-line" style="stroke-width:3" x1="512" y1="660" x2="512" y2="500"/>
  <g class="krobar-slot" data-slot="situation_content" data-shape="bbox_situation_content">
    <rect class="kr-box" x="332.0" y="658.0" width="360.0" height="70.0" rx="4"/>
    <foreignObject x="332.0" y="658.0" width="360.0" height="70.0">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">{{situation_content}}</div>
    </foreignObject>
  </g>
  <line class="kr-line" style="stroke-width:3" x1="512" y1="500" x2="250" y2="370"/>
  <line class="kr-line" style="stroke-width:3" x1="512" y1="500" x2="774" y2="370"/>
  <g class="krobar-slot" data-slot="option_a_content" data-shape="bbox_option_a_content">
    <rect class="kr-box" x="70.0" y="300.0" width="320.0" height="90.0" rx="4"/>
    <foreignObject x="70.0" y="300.0" width="320.0" height="90.0">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">{{option_a_content}}</div>
    </foreignObject>
  </g>
  <g class="krobar-slot" data-slot="option_b_content" data-shape="bbox_option_b_content">
    <rect class="kr-box" x="634.0" y="300.0" width="320.0" height="90.0" rx="4"/>
    <foreignObject x="634.0" y="300.0" width="320.0" height="90.0">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">{{option_b_content}}</div>
    </foreignObject>
  </g>
  <g class="krobar-slot" data-slot="outcome_a_content" data-shape="bbox_outcome_a_content">
    <rect class="kr-box" x="100.0" y="190.0" width="260.0" height="70.0" rx="4"/>
    <foreignObject x="100.0" y="190.0" width="260.0" height="70.0">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">{{outcome_a_content}}</div>
    </foreignObject>
  </g>
  <g class="krobar-slot" data-slot="outcome_b_content" data-shape="bbox_outcome_b_content">
    <rect class="kr-box" x="664.0" y="190.0" width="260.0" height="70.0" rx="4"/>
    <foreignObject x="664.0" y="190.0" width="260.0" height="70.0">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">{{outcome_b_content}}</div>
    </foreignObject>
  </g>
