<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-svg-kr-version="2.1" data-archetype="hubspoke_radial" data-cardinality="6">
  <metadata>
    <krobar-meta>
      <family>CONCEPTUELLE_SYSTEMIQUE</family>
      <cardinality>MULTIPLE</cardinality>
      <regime>ABSTRAIT_SYSTEMIQUE</regime>
      <cells>CONCEPTUELLE_SYSTEMIQUE_MULTIPLE_ABSTRAIT_SYSTEMIQUE</cells>
    </krobar-meta>
  </metadata>
  <style>
    .kr-line { fill:none; stroke:#1a1a1a; stroke-width:1.6; }
    .kr-box  { fill:#ffffff; stroke:#1a1a1a; stroke-width:1.6; }
    .kr-hub  { fill:#ffffff; stroke:#1a1a1a; stroke-width:2.4; }
    .kr-title { font-family:Poppins,sans-serif; font-weight:700; font-size:26px; fill:#1a1a1a; letter-spacing:1px; }
    .krobar-slot-content { font-family:Poppins,sans-serif; font-size:15px; color:#1a1a1a; line-height:1.2; display:flex; align-items:center; justify-content:center; text-align:center; width:100%; height:100%; box-sizing:border-box; padding:4px; overflow-wrap:anywhere; word-break:break-word; hyphens:auto; }
    .kr-hub-content { font-weight:600; font-size:18px; }
  </style>

  <!-- Titre -->
  <text x="512" y="44" text-anchor="middle" class="kr-title">HUB &amp; SPOKE</text>

  <!-- Connecteurs (sous les boites) -->
  <path class="kr-line" d="M 512.0 348.0 Q 512.0 254.5 512.0 161.0"/>
  <path class="kr-line" d="M 615.9 379.0 Q 637.6 332.2 659.2 285.5"/>
  <path class="kr-line" d="M 615.9 441.0 Q 637.6 487.8 659.2 534.5"/>
  <path class="kr-line" d="M 512.0 472.0 Q 512.0 565.5 512.0 659.0"/>
  <path class="kr-line" d="M 408.1 441.0 Q 386.4 487.8 364.8 534.5"/>
  <path class="kr-line" d="M 408.1 379.0 Q 386.4 332.2 364.8 285.5"/>

  <!-- Satellites -->
  <g class="krobar-slot" data-slot="block_1_content" data-shape="bbox_block_1">
    <rect class="kr-box" x="397.0" y="89.0" width="230" height="72" rx="4"/>
    <foreignObject x="397.0" y="89.0" width="230" height="72">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">{{block_1_content}}</div>
    </foreignObject>
  </g>
  <g class="krobar-slot" data-slot="block_2_content" data-shape="bbox_block_2">
    <rect class="kr-box" x="643.8" y="231.5" width="230" height="72" rx="4"/>
    <foreignObject x="643.8" y="231.5" width="230" height="72">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">{{block_2_content}}</div>
    </foreignObject>
  </g>
  <g class="krobar-slot" data-slot="block_3_content" data-shape="bbox_block_3">
    <rect class="kr-box" x="643.8" y="516.5" width="230" height="72" rx="4"/>
    <foreignObject x="643.8" y="516.5" width="230" height="72">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">{{block_3_content}}</div>
    </foreignObject>
  </g>
  <g class="krobar-slot" data-slot="block_4_content" data-shape="bbox_block_4">
    <rect class="kr-box" x="397.0" y="659.0" width="230" height="72" rx="4"/>
    <foreignObject x="397.0" y="659.0" width="230" height="72">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">{{block_4_content}}</div>
    </foreignObject>
  </g>
  <g class="krobar-slot" data-slot="block_5_content" data-shape="bbox_block_5">
    <rect class="kr-box" x="150.2" y="516.5" width="230" height="72" rx="4"/>
    <foreignObject x="150.2" y="516.5" width="230" height="72">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">{{block_5_content}}</div>
    </foreignObject>
  </g>
  <g class="krobar-slot" data-slot="block_6_content" data-shape="bbox_block_6">
    <rect class="kr-box" x="150.2" y="231.5" width="230" height="72" rx="4"/>
    <foreignObject x="150.2" y="231.5" width="230" height="72">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">{{block_6_content}}</div>
    </foreignObject>
  </g>

  <!-- Hub central (au-dessus des connecteurs) -->
  <g class="krobar-slot" data-slot="block_central_content" data-shape="bbox_central">
    <ellipse class="kr-hub" cx="512" cy="410" rx="120" ry="62"/>
    <foreignObject x="400" y="356" width="224" height="108">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content kr-hub-content">{{block_central_content}}</div>
    </foreignObject>
  </g>
</svg>