<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-svg-kr-version="2.1" data-archetype="escalier_ascendant" data-cardinality="4">
  <metadata>
    <krobar-meta>
      <family>PROCEDURALE_SEQUENTIELLE</family>
      <cardinality>MULTIPLE</cardinality>
      <regime>SEMI_METAPHORIQUE</regime>
      <cells>PROCEDURALE_SEQUENTIELLE_MULTIPLE_SEMI_METAPHORIQUE</cells>
