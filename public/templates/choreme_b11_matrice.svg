<svg viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg">
  <style>
    .label-strong { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: 600; }
    .label { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 13px; font-weight: 500; }
    .gloss { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 11px; font-weight: 400; font-style: italic; fill: var(--muted); }
    .gloss-strong { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 11px; font-weight: 500; }
    .caption { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 10px; font-weight: 400; font-style: italic; fill: var(--muted); }
    .axis { stroke: var(--border); stroke-width: 0.6; fill: none; }
  </style>

  <line x1="120" y1="80" x2="120" y2="380" stroke="var(--text)" stroke-width="1.2"/>
  <line x1="120" y1="380" x2="600" y2="380" stroke="var(--text)" stroke-width="1.2"/>
  <line x1="360" y1="80" x2="360" y2="380" stroke="var(--border)" stroke-width="0.6"/>
  <line x1="120" y1="230" x2="600" y2="230" stroke="var(--border)" stroke-width="0.6"/>
  <text x="240" y="60" class="label" text-anchor="middle" fill="var(--text)">{{axis_x_left}}</text>
  <text x="480" y="60" class="label" text-anchor="middle" fill="var(--text)">{{axis_x_right}}</text>
  <text x="100" y="155" class="label" text-anchor="end" dominant-baseline="central" fill="var(--text)">{{axis_y_top}}</text>
  <text x="100" y="305" class="label" text-anchor="end" dominant-baseline="central" fill="var(--text)">{{axis_y_bottom}}</text>
  <text x="240" y="135" class="label-strong" text-anchor="middle" fill="var(--cool)">{{quadrant_tl_line1}}</text>
  <text x="240" y="155" class="label-strong" text-anchor="middle" fill="var(--cool)">{{quadrant_tl_line2}}</text>
  <text x="240" y="180" class="gloss" text-anchor="middle">{{quadrant_tl_gloss_1}}</text>
  <text x="240" y="195" class="gloss" text-anchor="middle">{{quadrant_tl_gloss_2}}</text>
  <text x="480" y="135" class="label-strong" text-anchor="middle" fill="var(--primary)">{{quadrant_tr_line1}}</text>
  <text x="480" y="155" class="label-strong" text-anchor="middle" fill="var(--primary)">{{quadrant_tr_line2}}</text>
  <text x="480" y="180" class="gloss" text-anchor="middle">{{quadrant_tr_gloss_1}}</text>
  <text x="480" y="195" class="gloss" text-anchor="middle">{{quadrant_tr_gloss_2}}</text>
  <text x="240" y="290" class="label-strong" text-anchor="middle" fill="var(--muted)">{{quadrant_bl_line1}}</text>
  <text x="240" y="310" class="label-strong" text-anchor="middle" fill="var(--muted)">{{quadrant_bl_line2}}</text>
  <text x="240" y="335" class="gloss" text-anchor="middle">{{quadrant_bl_gloss_1}}</text>
  <text x="240" y="350" class="gloss" text-anchor="middle">{{quadrant_bl_gloss_2}}</text>
  <text x="480" y="290" class="label-strong" text-anchor="middle" fill="var(--warm)">{{quadrant_br_line1}}</text>
  <text x="480" y="310" class="label-strong" text-anchor="middle" fill="var(--warm)">{{quadrant_br_line2}}</text>
  <text x="480" y="335" class="gloss" text-anchor="middle">{{quadrant_br_gloss_1}}</text>
  <text x="480" y="350" class="gloss" text-anchor="middle">{{quadrant_br_gloss_2}}</text>
  <text x="40" y="430" class="caption">{{caption}}</text>
</svg>