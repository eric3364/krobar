<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="Plus Jakarta Sans, system-ui, sans-serif">
  <rect width="1040" height="600" fill="var(--bg)"/>
  <text x="105" y="72" font-size="13" font-weight="600" fill="var(--text)" opacity="0.55" style="text-transform: uppercase;">Comparaison 2 Colonnes</text>
  <foreignObject x="60" y="90" width="920" height="56">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="width:100%;height:100%;display:flex;align-items:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:36px;color:var(--text);box-sizing:border-box;">Comparaison des options</div>
  </foreignObject>
  
  <!-- Column 1 -->
  <rect x="80" y="180" width="400" height="320" rx="12" fill="var(--primary)" fill-opacity="0.05" stroke="var(--primary)" stroke-width="2" id="column_1_title"/>
  <foreignObject x="90" y="200" width="180" height="40" data-shape="column_1_title">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="column_1_title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:20px;color:var(--primary);box-sizing:border-box;">Option A</div>
  </foreignObject>
  <foreignObject x="90" y="260" width="180" height="200" data-shape="column_1_title">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="column_1_content" style="width:100%;height:100%;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:400;font-size:16px;color:var(--text);line-height:1.5;box-sizing:border-box;">• Avantages rapides<br/>• Coût réduit<br/>• Simple à mettre en œuvre</div>
  </foreignObject>
  
  <!-- Column 2 -->
  <rect x="560" y="180" width="400" height="320" rx="12" fill="var(--accent)" fill-opacity="0.05" stroke="var(--accent)" stroke-width="2" id="column_2_title"/>
  <foreignObject x="570" y="200" width="180" height="40" data-shape="column_2_title">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="column_2_title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:20px;color:var(--accent);box-sizing:border-box;">Option B</div>
  </foreignObject>
  <foreignObject x="570" y="260" width="180" height="200" data-shape="column_2_title">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="column_2_content" style="width:100%;height:100%;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:400;font-size:16px;color:var(--text);line-height:1.5;box-sizing:border-box;">• Évolutif à long terme<br/>• Meilleure qualité<br/>• Plus de fonctionnalités</div>
  </foreignObject>
  
  <text x="60" y="580" font-size="11" font-weight="600" fill="var(--text)" opacity="0.5" style="text-transform: uppercase;">Krobar · Comparaisons</text>
</svg>
