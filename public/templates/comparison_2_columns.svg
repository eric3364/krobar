<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Inter, system-ui, sans-serif">
  <rect width="800" height="600" fill="var(--bg)"/>
  <text data-slot="title" x="400" y="60" text-anchor="middle" font-size="30" font-weight="700" fill="var(--text)">Titre de comparaison</text>

  <g>
    <rect x="60" y="110" width="320" height="440" rx="14" fill="var(--primary)" opacity="0.08" stroke="var(--primary)" stroke-width="2"/>
    <rect x="60" y="110" width="320" height="60" rx="14" fill="var(--primary)"/>
    <text data-slot="left_label" x="220" y="148" text-anchor="middle" font-size="20" font-weight="700" fill="var(--bg)">Option A</text>
    <text data-slot="left_item_1" x="90" y="220" font-size="17" fill="var(--text)">• Élément 1</text>
    <text data-slot="left_item_2" x="90" y="270" font-size="17" fill="var(--text)">• Élément 2</text>
    <text data-slot="left_item_3" x="90" y="320" font-size="17" fill="var(--text)">• Élément 3</text>
  </g>

  <g>
    <rect x="420" y="110" width="320" height="440" rx="14" fill="var(--accent)" opacity="0.12" stroke="var(--accent)" stroke-width="2"/>
    <rect x="420" y="110" width="320" height="60" rx="14" fill="var(--accent)"/>
    <text data-slot="right_label" x="580" y="148" text-anchor="middle" font-size="20" font-weight="700" fill="var(--bg)">Option B</text>
    <text data-slot="right_item_1" x="450" y="220" font-size="17" fill="var(--text)">• Élément 1</text>
    <text data-slot="right_item_2" x="450" y="270" font-size="17" fill="var(--text)">• Élément 2</text>
    <text data-slot="right_item_3" x="450" y="320" font-size="17" fill="var(--text)">• Élément 3</text>
  </g>
</svg>
