    <foreignObject x="40" y="110" width="460" height="70">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="left_label" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:clamp(14px,1.6vw,20px);color:var(--bg);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Option A</div>
    </foreignObject>
    <foreignObject x="60" y="200" width="420" height="60">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="left_item_1" style="width:100%;height:100%;display:flex;align-items:center;text-align:left;font-family:Inter,system-ui,sans-serif;font-size:clamp(12px,1.3vw,17px);color:var(--text);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">• Élément 1</div>
    </foreignObject>
    <foreignObject x="60" y="270" width="420" height="60">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="left_item_2" style="width:100%;height:100%;display:flex;align-items:center;text-align:left;font-family:Inter,system-ui,sans-serif;font-size:clamp(12px,1.3vw,17px);color:var(--text);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">• Élément 2</div>
    </foreignObject>
    <foreignObject x="60" y="340" width="420" height="60">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="left_item_3" style="width:100%;height:100%;display:flex;align-items:center;text-align:left;font-family:Inter,system-ui,sans-serif;font-size:clamp(12px,1.3vw,17px);color:var(--text);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">• Élément 3</div>
    </foreignObject>
  </g>

  <g>
    <rect x="540" y="110" width="460" height="460" rx="14" fill="var(--accent)" opacity="0.12" stroke="var(--accent)" stroke-width="2"/>
    <rect x="540" y="110" width="460" height="70" rx="14" fill="var(--accent)"/>
    <foreignObject x="540" y="110" width="460" height="70">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="right_label" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:clamp(14px,1.6vw,20px);color:var(--bg);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Option B</div>
    </foreignObject>
    <foreignObject x="560" y="200" width="420" height="60">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="right_item_1" style="width:100%;height:100%;display:flex;align-items:center;text-align:left;font-family:Inter,system-ui,sans-serif;font-size:clamp(12px,1.3vw,17px);color:var(--text);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">• Élément 1</div>
    </foreignObject>
    <foreignObject x="560" y="270" width="420" height="60">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="right_item_2" style="width:100%;height:100%;display:flex;align-items:center;text-align:left;font-family:Inter,system-ui,sans-serif;font-size:clamp(12px,1.3vw,17px);color:var(--text);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">• Élément 2</div>
    </foreignObject>
    <foreignObject x="560" y="340" width="420" height="60">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="right_item_3" style="width:100%;height:100%;display:flex;align-items:center;text-align:left;font-family:Inter,system-ui,sans-serif;font-size:clamp(12px,1.3vw,17px);color:var(--text);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">• Élément 3</div>
    </foreignObject>
