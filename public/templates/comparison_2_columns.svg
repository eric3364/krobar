<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="Inter, system-ui, sans-serif">
  <rect width="1040" height="600" fill="var(--bg)"/>
  <foreignObject x="20" y="20" width="1000" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:clamp(20px,2.4vw,30px);color:var(--text);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Titre de comparaison</div>
  </foreignObject>

  <g>
    <rect x="40" y="110" width="460" height="460" rx="14" fill="var(--primary)" opacity="0.08" stroke="var(--primary)" stroke-width="2"/>
