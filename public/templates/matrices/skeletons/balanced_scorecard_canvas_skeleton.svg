    <regime>ABSTRAIT_SYSTEMIQUE</regime>
  </krobar-meta></metadata>
  <style>
    .krobar-bbox-fill { fill: white; }
    .krobar-bbox-stroke { stroke: #0f172a; stroke-width: 1.5; }
    .krobar-canvas-title { font-family: -apple-system, system-ui, sans-serif; font-size: 22px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
    .krobar-canonical-fo { font-family: -apple-system, system-ui, sans-serif; font-size: 13px; font-weight: 800; color: #0f172a; line-height: 1.2; text-align: center; padding: 4px 8px; height: 100%; display: flex; align-items: center; justify-content: center; box-sizing: border-box; letter-spacing: 0.3px; }
    .krobar-canonical-fo-center { font-family: -apple-system, system-ui, sans-serif; font-size: 15px; font-weight: 800; color: #0f172a; line-height: 1.2; text-align: center; padding: 4px 8px; height: 100%; display: flex; align-items: center; justify-content: center; box-sizing: border-box; letter-spacing: 0.5px; }
    .krobar-subtitle-fo { font-family: -apple-system, system-ui, sans-serif; font-size: 10px; font-weight: 600; color: #64748b; line-height: 1.2; text-align: center; padding: 0px 8px; height: 100%; display: flex; align-items: center; justify-content: center; box-sizing: border-box; font-style: italic; }
    .krobar-sub-label-fo { font-family: -apple-system, system-ui, sans-serif; font-size: 9px; font-weight: 700; color: #475569; line-height: 1.2; text-align: left; padding: 2px 6px; height: 100%; display: flex; align-items: center; box-sizing: border-box; text-transform: uppercase; letter-spacing: 0.5px; }
    .krobar-slot-content { font-family: -apple-system, system-ui, sans-serif; font-size: 10px; line-height: 1.35; color: #1e293b; padding: 2px 6px; height: 100%; box-sizing: border-box; overflow: hidden; word-wrap: break-word; }
    .bsc-arrow { stroke: #0f172a; stroke-width: 1; fill: #0f172a; }
  </style>

  <text x="512" y="36" class="krobar-canvas-title">TABLEAU DE BORD ÉQUILIBRÉ</text>

