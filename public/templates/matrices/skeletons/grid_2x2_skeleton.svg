<svg xmlns="http://www.w3.org/2000/svg"
       xmlns:html="http://www.w3.org/1999/xhtml"
       xmlns:krobar="http://krobar.online/spec/v1"
       data-svg-kr-version="0.1"
       viewBox="0 0 1024 768"
       font-family="Plus Jakarta Sans, system-ui, sans-serif">
  <metadata>
    <krobar:krobar-meta>
      <krobar:id>{{TEMPLATE_ID}}</krobar:id>
      <krobar:tier>canonical-matrix</krobar:tier>
      <krobar:archetype>grid_2x2</krobar:archetype>
      <krobar:matrice-id>{{MATRICE_ID}}</krobar:matrice-id>
      <krobar:components-count>4</krobar:components-count>
    </krobar:krobar-meta>
  </metadata>

  <!-- Title Slot -->
  <g class="slot-group" data-slot-key="title">
    <rect class="slot-shape krobar-bbox-fill krobar-bbox-stroke"
          data-shape="bbox_title_1" x="40" y="20" width="944" height="60"
          fill="none" stroke="none" />
    <foreignObject class="slot-label" x="40" y="20" width="944" height="60">
      <html:div xmlns="http://www.w3.org/1999/xhtml" class="slot-content"
                style="font-size:36px;font-weight:700;color:#0f172a;line-height:1.1;text-align:center;">
        {{title}}
      </html:div>
    </foreignObject>
  </g>

  <!-- Canonical Label 1 (Top-Left) -->
  <g class="canonical-label" data-for-shape="bbox_quadrant_1">
    <foreignObject x="40" y="96" width="464" height="36">
      <html:div xmlns="http://www.w3.org/1999/xhtml" class="canonical-label-content"
                style="font-size:16px;font-weight:600;color:#0f172a;text-align:center;">
        {{canonical_1}}
      </html:div>
    </foreignObject>
  </g>

  <!-- Quadrant 1 (Top-Left) -->
  <g class="slot-group" data-slot-key="quadrant_1">
    <rect class="slot-shape krobar-bbox-fill krobar-bbox-stroke"
          data-shape="bbox_quadrant_1" x="40" y="140" width="464" height="276"
          fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
    <foreignObject class="slot-label" x="40" y="140" width="464" height="276">
      <html:div xmlns="http://www.w3.org/1999/xhtml" class="slot-content"
                style="font-size:18px;line-height:1.35;color:#0f172a;padding:16px;">
        {{quadrant_1}}
      </html:div>
    </foreignObject>
  </g>

  <!-- Canonical Label 2 (Top-Right) -->
  <g class="canonical-label" data-for-shape="bbox_quadrant_2">
    <foreignObject x="520" y="96" width="464" height="36">
      <html:div xmlns="http://www.w3.org/1999/xhtml" class="canonical-label-content"
                style="font-size:16px;font-weight:600;color:#0f172a;text-align:center;">
        {{canonical_2}}
      </html:div>
    </foreignObject>
  </g>

  <!-- Quadrant 2 (Top-Right) -->
  <g class="slot-group" data-slot-key="quadrant_2">
    <rect class="slot-shape krobar-bbox-fill krobar-bbox-stroke"
          data-shape="bbox_quadrant_2" x="520" y="140" width="464" height="276"
          fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
    <foreignObject class="slot-label" x="520" y="140" width="464" height="276">
      <html:div xmlns="http://www.w3.org/1999/xhtml" class="slot-content"
                style="font-size:18px;line-height:1.35;color:#0f172a;padding:16px;">
        {{quadrant_2}}
      </html:div>
    </foreignObject>
  </g>

  <!-- Canonical Label 3 (Bottom-Left) -->
  <g class="canonical-label" data-for-shape="bbox_quadrant_3">
    <foreignObject x="40" y="428" width="464" height="36">
      <html:div xmlns="http://www.w3.org/1999/xhtml" class="canonical-label-content"
                style="font-size:16px;font-weight:600;color:#0f172a;text-align:center;">
        {{canonical_3}}
      </html:div>
    </foreignObject>
  </g>

  <!-- Quadrant 3 (Bottom-Left) -->
  <g class="slot-group" data-slot-key="quadrant_3">
    <rect class="slot-shape krobar-bbox-fill krobar-bbox-stroke"
          data-shape="bbox_quadrant_3" x="40" y="472" width="464" height="276"
          fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
    <foreignObject class="slot-label" x="40" y="472" width="464" height="276">
      <html:div xmlns="http://www.w3.org/1999/xhtml" class="slot-content"
                style="font-size:18px;line-height:1.35;color:#0f172a;padding:16px;">
        {{quadrant_3}}
      </html:div>
    </foreignObject>
  </g>

  <!-- Canonical Label 4 (Bottom-Right) -->
  <g class="canonical-label" data-for-shape="bbox_quadrant_4">
    <foreignObject x="520" y="428" width="464" height="36">
      <html:div xmlns="http://www.w3.org/1999/xhtml" class="canonical-label-content"
                style="font-size:16px;font-weight:600;color:#0f172a;text-align:center;">
        {{canonical_4}}
      </html:div>
    </foreignObject>
  </g>

  <!-- Quadrant 4 (Bottom-Right) -->
  <g class="slot-group" data-slot-key="quadrant_4">
    <rect class="slot-shape krobar-bbox-fill krobar-bbox-stroke"
          data-shape="bbox_quadrant_4" x="520" y="472" width="464" height="276"
          fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
    <foreignObject class="slot-label" x="520" y="472" width="464" height="276">
      <html:div xmlns="http://www.w3.org/1999/xhtml" class="slot-content"
                style="font-size:18px;line-height:1.35;color:#0f172a;padding:16px;">
        {{quadrant_4}}
      </html:div>
    </foreignObject>
  </g>
</svg>