<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-svg-kr-version="2.1" data-archetype="opportunity_solution_tree">
  <metadata><krobar-meta>
    <archetype>opportunity_solution_tree</archetype>
    <family>CONCEPTUELLE_SYSTEMIQUE</family>
    <cardinality>MULTIPLE</cardinality>
    <regime>ABSTRAIT_SYSTEMIQUE</regime>
  </krobar-meta></metadata>
  <style>
    .krobar-bbox-fill { fill: white; }
    .krobar-bbox-stroke { stroke: #0f172a; stroke-width: 1.5; }
    .krobar-canvas-title { font-family: -apple-system, system-ui, sans-serif; font-size: 22px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
    .krobar-level-label { font-family: -apple-system, system-ui, sans-serif; font-size: 10px; font-weight: 700; fill: #475569; letter-spacing: 1px; text-transform: uppercase; }
    .krobar-canonical-fo { font-family: -apple-system, system-ui, sans-serif; font-size: 11px; font-weight: 700; color: #0f172a; line-height: 1.2; text-align: center; padding: 3px 6px; height: 100%; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
    .krobar-slot-content { font-family: -apple-system, system-ui, sans-serif; font-size: 11px; line-height: 1.35; color: #1e293b; padding: 4px 8px; height: 100%; box-sizing: border-box; overflow: hidden; word-wrap: break-word; text-align: center; }
    .tree-line { stroke: #0f172a; stroke-width: 1.2; fill: none; }
    .outcome-frame { stroke: #0f172a; stroke-width: 2.5; fill: white; }
  </style>

  <text x="512" y="32" class="krobar-canvas-title">ARBRE OPPORTUNITÉS - SOLUTIONS</text>

