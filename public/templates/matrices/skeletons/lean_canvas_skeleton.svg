  <g class="krobar-slot" data-slot-key="block_segments_clientele_content">
    <rect x="805" y="80" width="195" height="460" class="krobar-bbox-fill krobar-bbox-stroke"/>
    <foreignObject x="805" y="80" width="195" height="44">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-canonical-fo">Segments de clientèle</div>
    </foreignObject>
    <foreignObject x="817" y="124" width="171" height="404">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">{{block_segments_clientele_content}}</div>
    </foreignObject>
  </g>

  <!-- Structure de coûts -->
  <g class="krobar-slot" data-slot-key="block_structure_couts_content">
    <rect x="24" y="540" width="488" height="204" class="krobar-bbox-fill krobar-bbox-stroke"/>
    <foreignObject x="24" y="540" width="488" height="44">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-canonical-fo">Structure de coûts</div>
    </foreignObject>
    <foreignObject x="36" y="584" width="464" height="148">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">{{block_structure_couts_content}}</div>
    </foreignObject>
  </g>

  <!-- Flux de revenus -->
  <g class="krobar-slot" data-slot-key="block_flux_revenus_content">
    <rect x="512" y="540" width="488" height="204" class="krobar-bbox-fill krobar-bbox-stroke"/>
    <foreignObject x="512" y="540" width="488" height="44">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-canonical-fo">Flux de revenus</div>
    </foreignObject>
    <foreignObject x="524" y="584" width="464" height="148">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">{{block_flux_revenus_content}}</div>
    </foreignObject>
