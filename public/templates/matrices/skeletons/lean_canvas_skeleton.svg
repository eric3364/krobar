<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-svg-kr-version="2.1" data-archetype="lean_canvas">
  <metadata><krobar-meta>
    <archetype>lean_canvas</archetype>
    <family>CONCEPTUELLE_SYSTEMIQUE</family>
    <cardinality>MULTIPLE</cardinality>
    <regime>ABSTRAIT_SYSTEMIQUE</regime>
  </krobar-meta></metadata>
  <style>
    .krobar-bbox-fill { fill: white; }
    .krobar-bbox-stroke { stroke: #0f172a; stroke-width: 1.5; }
    .krobar-canvas-title { font-family: -apple-system, system-ui, sans-serif; font-size: 28px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
    .krobar-canonical-fo { font-family: -apple-system, system-ui, sans-serif; font-size: 14px; font-weight: 700; color: #0f172a; line-height: 1.2; text-align: center; padding: 6px 4px; height: 100%; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
    .krobar-slot-content { font-family: -apple-system, system-ui, sans-serif; font-size: 13px; line-height: 1.45; color: #1e293b; padding: 8px 10px; height: 100%; box-sizing: border-box; overflow: hidden; word-wrap: break-word; }
  </style>

  <text x="512" y="48" class="krobar-canvas-title">LEAN CANVAS</text>

  <!-- Problème -->
  <g class="krobar-slot" data-slot-key="block_probleme_content">
    <rect x="24" y="80" width="196" height="460" class="krobar-bbox-fill krobar-bbox-stroke"/>
    <foreignObject x="24" y="80" width="196" height="44">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-canonical-fo">Problème</div>
    </foreignObject>
    <foreignObject x="36" y="124" width="172" height="404">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">{{block_probleme_content}}</div>
    </foreignObject>
  </g>

  <!-- Solution -->
  <g class="krobar-slot" data-slot-key="block_solution_content">
    <rect x="220" y="80" width="195" height="230" class="krobar-bbox-fill krobar-bbox-stroke"/>
    <foreignObject x="220" y="80" width="195" height="44">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-canonical-fo">Solution</div>
    </foreignObject>
    <foreignObject x="232" y="124" width="171" height="174">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">{{block_solution_content}}</div>
    </foreignObject>
  </g>

  <!-- Indicateurs clés -->
  <g class="krobar-slot" data-slot-key="block_indicateurs_cles_content">
    <rect x="220" y="310" width="195" height="230" class="krobar-bbox-fill krobar-bbox-stroke"/>
    <foreignObject x="220" y="310" width="195" height="44">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-canonical-fo">Indicateurs clés</div>
    </foreignObject>
    <foreignObject x="232" y="354" width="171" height="174">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">{{block_indicateurs_cles_content}}</div>
    </foreignObject>
  </g>

  <!-- Proposition de valeur unique -->
  <g class="krobar-slot" data-slot-key="block_proposition_valeur_content">
    <rect x="415" y="80" width="195" height="460" class="krobar-bbox-fill krobar-bbox-stroke"/>
    <foreignObject x="415" y="80" width="195" height="44">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-canonical-fo">Proposition de valeur unique</div>
