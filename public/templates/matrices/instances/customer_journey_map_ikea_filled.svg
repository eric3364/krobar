  <foreignObject x="24" y="80" width="120" height="44">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:-apple-system,system-ui,sans-serif;font-size:12px;font-weight:700;color:#475569;text-align:center;height:100%;display:flex;align-items:center;justify-content:center;padding:4px;line-height:1.3;letter-spacing:0.5px;box-sizing:border-box;text-transform:uppercase;">Étapes</div>
  </foreignObject>
  <foreignObject x="24" y="124" width="120" height="130">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:-apple-system,system-ui,sans-serif;font-size:12px;font-weight:700;color:#475569;text-align:center;height:100%;display:flex;align-items:center;justify-content:center;padding:4px;line-height:1.3;letter-spacing:0.5px;box-sizing:border-box;text-transform:uppercase;">Actions</div>
  </foreignObject>
  <foreignObject x="24" y="254" width="120" height="130">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:-apple-system,system-ui,sans-serif;font-size:12px;font-weight:700;color:#475569;text-align:center;height:100%;display:flex;align-items:center;justify-content:center;padding:4px;line-height:1.3;letter-spacing:0.5px;box-sizing:border-box;text-transform:uppercase;">Points de contact</div>
  </foreignObject>
  <foreignObject x="24" y="384" width="120" height="180">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:-apple-system,system-ui,sans-serif;font-size:12px;font-weight:700;color:#475569;text-align:center;height:100%;display:flex;align-items:center;justify-content:center;padding:4px;line-height:1.3;letter-spacing:0.5px;box-sizing:border-box;text-transform:uppercase;">Pensées &amp; Émotions</div>
  </foreignObject>
  <foreignObject x="24" y="564" width="120" height="156">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:-apple-system,system-ui,sans-serif;font-size:12px;font-weight:700;color:#475569;text-align:center;height:100%;display:flex;align-items:center;justify-content:center;padding:4px;line-height:1.3;letter-spacing:0.5px;box-sizing:border-box;text-transform:uppercase;">Frustrations &amp; Opportunités</div>
  </foreignObject>

  <g class="krobar-slot" data-slot-key="block_actions_decouverte_content">
    <foreignObject x="152.0" y="132.0" width="155.2" height="114.0">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">Voit le catalogue IKEA. Discute déco avec un proche. Cherche « meuble salon scandinave » sur Google.</div>
    </foreignObject>
  </g>
  <g class="krobar-slot" data-slot-key="block_actions_reflexion_content">
    <foreignObject x="323.2" y="132.0" width="155.2" height="114.0">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">Compare 3 modèles sur ikea.fr. Mesure son salon. Lit les avis des autres acheteurs.</div>
    </foreignObject>
  </g>
  <g class="krobar-slot" data-slot-key="block_actions_achat_content">
    <foreignObject x="494.4" y="132.0" width="155.2" height="114.0">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">Commande en ligne ou se déplace en magasin. Choix livraison à domicile ou retrait. Paiement CB ou financement.</div>
    </foreignObject>
  </g>
  <g class="krobar-slot" data-slot-key="block_actions_usage_content">
    <foreignObject x="665.6" y="132.0" width="155.2" height="114.0">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">Monte le meuble avec la notice. Galère parfois avec les chevilles. Une fois monté : satisfait.</div>
    </foreignObject>
  </g>
  <g class="krobar-slot" data-slot-key="block_actions_fidelisation_content">
    <foreignObject x="836.8" y="132.0" width="155.2" height="114.0">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">Inscrit au programme IKEA Family. Repasse pour des accessoires. Recommande à un ami.</div>
    </foreignObject>
  </g>

  <g class="krobar-slot" data-slot-key="block_points_contact_decouverte_content">
    <foreignObject x="152.0" y="262.0" width="155.2" height="114.0">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">Catalogue papier, site web, Instagram, Pinterest, bouche-à-oreille.</div>
    </foreignObject>
  </g>
  <g class="krobar-slot" data-slot-key="block_points_contact_reflexion_content">
    <foreignObject x="323.2" y="262.0" width="155.2" height="114.0">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">Site web, app mobile, comparateurs, forums déco.</div>
    </foreignObject>
  </g>
  <g class="krobar-slot" data-slot-key="block_points_contact_achat_content">
    <foreignObject x="494.4" y="262.0" width="155.2" height="114.0">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">Site web, magasin physique, drive, caisses, livreurs.</div>
    </foreignObject>
  </g>
  <g class="krobar-slot" data-slot-key="block_points_contact_usage_content">
    <foreignObject x="665.6" y="262.0" width="155.2" height="114.0">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">Notice papier, vidéos YouTube, service client.</div>
    </foreignObject>
  </g>
  <g class="krobar-slot" data-slot-key="block_points_contact_fidelisation_content">
    <foreignObject x="836.8" y="262.0" width="155.2" height="114.0">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">Newsletter IKEA Family, app, magasin pour les retours.</div>
    </foreignObject>
  </g>

  <g class="krobar-slot" data-slot-key="block_pensees_emotions_decouverte_content">
    <foreignObject x="152.0" y="392.0" width="155.2" height="164.0">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">« Mon salon a besoin d'un coup de neuf. » Excitation, inspiration. Doute sur le style à choisir.</div>
    </foreignObject>
  </g>
  <g class="krobar-slot" data-slot-key="block_pensees_emotions_reflexion_content">
    <foreignObject x="323.2" y="392.0" width="155.2" height="164.0">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">« Est-ce que ça rentrera ? Le tissu va-t-il tenir ? » Anxiété, méfiance des photos trop belles.</div>
    </foreignObject>
  </g>
  <g class="krobar-slot" data-slot-key="block_pensees_emotions_achat_content">
    <foreignObject x="494.4" y="392.0" width="155.2" height="164.0">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">« J'espère que la livraison sera ponctuelle. » Excitation mêlée d'angoisse (montage à venir).</div>
    </foreignObject>
  </g>
  <g class="krobar-slot" data-slot-key="block_pensees_emotions_usage_content">
    <foreignObject x="665.6" y="392.0" width="155.2" height="164.0">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">« Vais-je m'en sortir avec la notice ? » Tension du montage, fierté quand c'est fini.</div>
    </foreignObject>
  </g>
  <g class="krobar-slot" data-slot-key="block_pensees_emotions_fidelisation_content">
    <foreignObject x="836.8" y="392.0" width="155.2" height="164.0">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">« Pas mal pour le prix. » Satisfaction durable, envie de refaire d'autres pièces.</div>
    </foreignObject>
  </g>

  <g class="krobar-slot" data-slot-key="block_frustrations_decouverte_content">
    <foreignObject x="152.0" y="572.0" width="155.2" height="140.0">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">Trop de choix tue le choix. → Recommandations personnalisées par style.</div>
    </foreignObject>
  </g>
  <g class="krobar-slot" data-slot-key="block_frustrations_reflexion_content">
    <foreignObject x="323.2" y="572.0" width="155.2" height="140.0">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">Photos magnifiques mais résultat parfois décevant. → AR/visualisation 3D du meuble dans son salon.</div>
    </foreignObject>
  </g>
  <g class="krobar-slot" data-slot-key="block_frustrations_achat_content">
    <foreignObject x="494.4" y="572.0" width="155.2" height="140.0">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">Stocks magasin pas toujours à jour. → Vérification disponibilité en temps réel.</div>
    </foreignObject>
  </g>
  <g class="krobar-slot" data-slot-key="block_frustrations_usage_content">
    <foreignObject x="665.6" y="572.0" width="155.2" height="140.0">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">Notice illisible, vis qui manquent. → Notice vidéo dans l'app, service après-vente plus rapide.</div>
    </foreignObject>
  </g>
  <g class="krobar-slot" data-slot-key="block_frustrations_fidelisation_content">
    <foreignObject x="836.8" y="572.0" width="155.2" height="140.0">
      <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-slot-content">Pas de relance personnalisée. → Recommandations selon historique d'achat et saison.</div>
    </foreignObject>
  </g>

</svg>