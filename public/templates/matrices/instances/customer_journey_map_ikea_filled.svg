<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-svg-kr-version="2.1" data-archetype="customer_journey_map">
  <metadata><krobar-meta>
    <archetype>customer_journey_map</archetype>
    <family>NARRATIVE_SCENIQUE</family>
    <cardinality>MULTIPLE</cardinality>
    <regime>ABSTRAIT_SYSTEMIQUE</regime>
  </krobar-meta></metadata>
  <style>
    .krobar-bbox-fill { fill: white; }
    .krobar-bbox-stroke { stroke: #0f172a; stroke-width: 1.5; }
    .krobar-canvas-title { font-family: -apple-system, system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
    .krobar-row-label { font-family: -apple-system, system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #475569; text-anchor: middle; letter-spacing: 0.5px; }
    .krobar-canonical-fo { font-family: -apple-system, system-ui, sans-serif; font-size: 14px; font-weight: 700; color: #0f172a; line-height: 1.2; text-align: center; padding: 4px 4px; height: 100%; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
    .krobar-step-header { font-family: -apple-system, system-ui, sans-serif; font-size: 13px; font-weight: 700; color: white; line-height: 1.2; text-align: center; padding: 6px 4px; height: 100%; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
    .krobar-slot-content { font-family: -apple-system, system-ui, sans-serif; font-size: 11px; line-height: 1.35; color: #1e293b; padding: 6px 8px; height: 100%; box-sizing: border-box; overflow: hidden; word-wrap: break-word; }
    .step-header-bg { fill: #0f172a; }
  </style>

  <text x="512" y="40" class="krobar-canvas-title">CARTE DU PARCOURS CLIENT</text>

  <rect x="144" y="80" width="856" height="640" fill="none" stroke="#0f172a" stroke-width="2"/>

