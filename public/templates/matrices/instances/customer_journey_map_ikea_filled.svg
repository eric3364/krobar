  <line x1="486.4" y1="80" x2="486.4" y2="720" class="krobar-bbox-stroke"/>
  <line x1="657.6" y1="80" x2="657.6" y2="720" class="krobar-bbox-stroke"/>
  <line x1="828.8" y1="80" x2="828.8" y2="720" class="krobar-bbox-stroke"/>

  <line x1="144" y1="124" x2="1000" y2="124" class="krobar-bbox-stroke"/>
  <line x1="144" y1="254" x2="1000" y2="254" class="krobar-bbox-stroke"/>
  <line x1="144" y1="384" x2="1000" y2="384" class="krobar-bbox-stroke"/>
  <line x1="144" y1="564" x2="1000" y2="564" class="krobar-bbox-stroke"/>

  <rect x="144" y="80" width="856" height="44" class="step-header-bg"/>

  <foreignObject x="144.0" y="80" width="171.2" height="44">
    <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-step-header">Découverte</div>
  </foreignObject>
  <foreignObject x="315.2" y="80" width="171.2" height="44">
    <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-step-header">Réflexion</div>
  </foreignObject>
  <foreignObject x="486.4" y="80" width="171.2" height="44">
    <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-step-header">Achat</div>
  </foreignObject>
  <foreignObject x="657.6" y="80" width="171.2" height="44">
    <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-step-header">Usage</div>
  </foreignObject>
  <foreignObject x="828.8" y="80" width="171.2" height="44">
    <div xmlns="http://www.w3.org/1999/xhtml" class="krobar-step-header">Fidélisation</div>
