<svg viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg">
  <style>
    .label-strong { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: 600; }
    .label { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 13px; font-weight: 500; }
    .gloss { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 11px; font-weight: 400; font-style: italic; fill: var(--muted); }
    .gloss-strong { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 11px; font-weight: 500; }
    .caption { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 10px; font-weight: 400; font-style: italic; fill: var(--muted); }
    .axis { stroke: var(--border); stroke-width: 0.6; fill: none; }
  </style>

  <defs>
    <pattern id="hatchb12" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="var(--tertiary)" stroke-width="0.6" opacity="0.5"/>
    </pattern>
  </defs>
  <rect x="40" y="80" width="240" height="200" rx="6" fill="var(--bg)" stroke="var(--primary)" stroke-width="1.8"/>
  <text x="160" y="110" class="label-strong" text-anchor="middle" fill="var(--primary)">{{regime_left_title}}</text>
  <text x="160" y="128" class="gloss" text-anchor="middle">{{regime_left_subtitle}}</text>
  <text x="60" y="165" class="gloss-strong" fill="var(--primary)">{{left_trait_1}}</text>
  <text x="60" y="190" class="gloss-strong" fill="var(--primary)">{{left_trait_2}}</text>
  <text x="60" y="215" class="gloss-strong" fill="var(--primary)">{{left_trait_3}}</text>
  <text x="60" y="240" class="gloss-strong" fill="var(--primary)">{{left_trait_4}}</text>
  <text x="60" y="265" class="gloss-strong" fill="var(--primary)">{{left_trait_5}}</text>
  <rect x="290" y="80" width="60" height="200" fill="url(#hatchb12)" stroke="var(--tertiary)" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="320" y="110" class="gloss-strong" text-anchor="middle" fill="var(--tertiary)">{{tension_line1}}</text>
  <text x="320" y="128" class="gloss" text-anchor="middle" fill="var(--tertiary)">{{tension_line2}}</text>
  <text x="320" y="170" class="gloss" text-anchor="middle">{{tension_gloss_1}}</text>
  <text x="320" y="185" class="gloss" text-anchor="middle">{{tension_gloss_2}}</text>
  <text x="320" y="220" class="gloss" text-anchor="middle">{{tension_gloss_3}}</text>
  <text x="320" y="235" class="gloss" text-anchor="middle">{{tension_gloss_4}}</text>
  <rect x="360" y="80" width="240" height="200" rx="6" fill="var(--bg)" stroke="var(--warm)" stroke-width="1.8"/>
  <text x="480" y="110" class="label-strong" text-anchor="middle" fill="var(--warm)">{{regime_right_title}}</text>
  <text x="480" y="128" class="gloss" text-anchor="middle">{{regime_right_subtitle}}</text>
  <text x="380" y="165" class="gloss-strong" fill="var(--warm)">{{right_trait_1}}</text>
  <text x="380" y="190" class="gloss-strong" fill="var(--warm)">{{right_trait_2}}</text>
  <text x="380" y="215" class="gloss-strong" fill="var(--warm)">{{right_trait_3}}</text>
  <text x="380" y="240" class="gloss-strong" fill="var(--warm)">{{right_trait_4}}</text>
  <text x="380" y="265" class="gloss-strong" fill="var(--warm)">{{right_trait_5}}</text>
  <text x="40" y="335" class="caption">{{caption}}</text>
</svg>