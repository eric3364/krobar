<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Inter, system-ui, sans-serif">
  <rect width="800" height="600" fill="var(--bg)"/>
  <text data-slot="title" x="400" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="var(--text)">Titre du cycle</text>

  <g>
    <circle cx="400" cy="170" r="70" fill="var(--primary)"/>
    <text data-slot="step_1" x="400" y="178" text-anchor="middle" font-size="16" font-weight="600" fill="var(--bg)">Étape 1</text>
  </g>
  <g>
    <circle cx="620" cy="340" r="70" fill="var(--accent)"/>
    <text data-slot="step_2" x="620" y="348" text-anchor="middle" font-size="16" font-weight="600" fill="var(--bg)">Étape 2</text>
  </g>
  <g>
    <circle cx="400" cy="510" r="70" fill="var(--primary)"/>
    <text data-slot="step_3" x="400" y="518" text-anchor="middle" font-size="16" font-weight="600" fill="var(--bg)">Étape 3</text>
  </g>
  <g>
    <circle cx="180" cy="340" r="70" fill="var(--accent)"/>
    <text data-slot="step_4" x="180" y="348" text-anchor="middle" font-size="16" font-weight="600" fill="var(--bg)">Étape 4</text>
  </g>

  <path d="M 470 200 Q 580 220 580 290" stroke="var(--text)" stroke-width="3" fill="none" marker-end="url(#a)" opacity="0.5"/>
  <path d="M 590 410 Q 540 500 460 490" stroke="var(--text)" stroke-width="3" fill="none" marker-end="url(#a)" opacity="0.5"/>
  <path d="M 330 490 Q 220 470 220 400" stroke="var(--text)" stroke-width="3" fill="none" marker-end="url(#a)" opacity="0.5"/>
  <path d="M 220 280 Q 270 200 340 200" stroke="var(--text)" stroke-width="3" fill="none" marker-end="url(#a)" opacity="0.5"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--text)"/>
    </marker>
  </defs>
</svg>
