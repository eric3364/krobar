<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="Plus Jakarta Sans, system-ui, sans-serif">
  <rect width="1040" height="600" fill="var(--bg)"/>
  <text x="105" y="72" font-size="13" font-weight="600" fill="var(--text)" opacity="0.55" style="text-transform: uppercase;">Roadmap Trimestrielle</text>
  <foreignObject x="60" y="90" width="920" height="56">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="width:100%;height:100%;display:flex;align-items:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:36px;color:var(--text);box-sizing:border-box;">Feuille de route 2024</div>
  </foreignObject>
  
  <!-- Timeline line -->
  <line x1="100" y1="350" x2="900" y2="350" stroke="var(--accent)" stroke-width="3"/>
  
  <!-- Q1 -->
  <circle cx="200" cy="350" r="8" fill="var(--primary)"/>
  <line x1="200" y1="350" x2="200" y2="280" stroke="var(--primary)" stroke-width="2"/>
  <rect x="120" y="200" width="180" height="80" rx="8" fill="var(--primary)" fill-opacity="0.1" stroke="var(--primary)" stroke-width="2" id="q1_title"/>
  <foreignObject x="130" y="215" width="180" height="25" data-shape="q1_title">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="q1_title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--primary);box-sizing:border-box;">Q1 - Recherche</div>
  </foreignObject>
  <foreignObject x="130" y="240" width="180" height="30" data-shape="q1_title">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="q1_content" style="width:100%;height:100%;display:flex;align-items:flex-start;justify-content:center;text-align:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:400;font-size:14px;color:var(--text);line-height:1.3;box-sizing:border-box;">Analyse marché et besoins</div>
  </foreignObject>
  
  <!-- Q2 -->
  <circle cx="380" cy="350" r="8" fill="var(--accent)"/>
  <line x1="380" y1="350" x2="380" y2="420" stroke="var(--accent)" stroke-width="2"/>
  <rect x="300" y="420" width="180" height="80" rx="8" fill="var(--accent)" fill-opacity="0.1" stroke="var(--accent)" stroke-width="2" id="q2_title"/>
  <foreignObject x="310" y="435" width="180" height="25" data-shape="q2_title">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="q2_title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--accent);box-sizing:border-box;">Q2 - Conception</div>
  </foreignObject>
  <foreignObject x="310" y="460" width="180" height="30" data-shape="q2_title">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="q2_content" style="width:100%;height:100%;display:flex;align-items:flex-start;justify-content:center;text-align:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:400;font-size:14px;color:var(--text);line-height:1.3;box-sizing:border-box;">Design et prototypage</div>
  </foreignObject>
  
  <!-- Q3 -->
  <circle cx="580" cy="350" r="8" fill="var(--primary)"/>
  <line x1="580" y1="350" x2="580" y2="280" stroke="var(--primary)" stroke-width="2"/>
  <rect x="500" y="200" width="180" height="80" rx="8" fill="var(--primary)" fill-opacity="0.1" stroke="var(--primary)" stroke-width="2" id="q3_title"/>
  <foreignObject x="510" y="215" width="180" height="25" data-shape="q3_title">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="q3_title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--primary);box-sizing:border-box;">Q3 - Développement</div>
  </foreignObject>
  <foreignObject x="510" y="240" width="180" height="30" data-shape="q3_title">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="q3_content" style="width:100%;height:100%;display:flex;align-items:flex-start;justify-content:center;text-align:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:400;font-size:14px;color:var(--text);line-height:1.3;box-sizing:border-box;">Implémentation et tests</div>
  </foreignObject>
  
  <!-- Q4 -->
  <circle cx="780" cy="350" r="8" fill="var(--accent)"/>
  <line x1="780" y1="350" x2="780" y2="420" stroke="var(--accent)" stroke-width="2"/>
  <rect x="700" y="420" width="180" height="80" rx="8" fill="var(--accent)" fill-opacity="0.1" stroke="var(--accent)" stroke-width="2" id="q4_title"/>
  <foreignObject x="710" y="435" width="180" height="25" data-shape="q4_title">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="q4_title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--accent);box-sizing:border-box;">Q4 - Lancement</div>
  </foreignObject>
  <foreignObject x="710" y="460" width="180" height="30" data-shape="q4_title">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="q4_content" style="width:100%;height:100%;display:flex;align-items:flex-start;justify-content:center;text-align:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:400;font-size:14px;color:var(--text);line-height:1.3;box-sizing:border-box;">Déploiement et suivi</div>
  </foreignObject>
  
  <text x="60" y="580" font-size="11" font-weight="600" fill="var(--text)" opacity="0.5" style="text-transform: uppercase;">Krobar · Planning</text>
</svg>
