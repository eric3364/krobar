<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Inter, system-ui, sans-serif">
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="var(--bg)"/>

  <foreignObject x="20" y="20" width="760" height="50">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:clamp(18px,3cqw,26px);color:var(--text);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Roadmap annuelle</div>
  </foreignObject>

  <!-- 4 columns: x = 30, 220, 410, 600; w = 170 -->
  <!-- Headers -->
  <g filter="url(#soft-shadow)">
    <rect x="30"  y="100" width="170" height="50" rx="12" fill="var(--primary)"/>
    <rect x="220" y="100" width="170" height="50" rx="12" fill="var(--primary)"/>
    <rect x="410" y="100" width="170" height="50" rx="12" fill="var(--primary)"/>
    <rect x="600" y="100" width="170" height="50" rx="12" fill="var(--primary)"/>
  </g>
  <g font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="20" fill="var(--bg)" text-anchor="middle">
    <text x="115" y="133">Q1</text>
    <text x="305" y="133">Q2</text>
    <text x="495" y="133">Q3</text>
    <text x="685" y="133">Q4</text>
  </g>

  <!-- Cards: 2 per column. Card 1 y=170 h=140, Card 2 y=325 h=140 -->
  <!-- Q1 -->
  <g filter="url(#soft-shadow)">
    <rect x="30"  y="170" width="170" height="140" rx="12" fill="var(--accent)" opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
    <rect x="30"  y="325" width="170" height="140" rx="12" fill="var(--accent)" opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
  </g>
  <foreignObject x="30" y="170" width="170" height="140">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="q1_item_1" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-size:clamp(11px,2cqw,14px);color:var(--text);padding:10px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Initiative Q1.1</div>
  </foreignObject>
  <foreignObject x="30" y="325" width="170" height="140">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="q1_item_2" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-size:clamp(11px,2cqw,14px);color:var(--text);padding:10px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Initiative Q1.2</div>
  </foreignObject>

  <!-- Q2 -->
  <g filter="url(#soft-shadow)">
    <rect x="220" y="170" width="170" height="140" rx="12" fill="var(--accent)" opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
    <rect x="220" y="325" width="170" height="140" rx="12" fill="var(--accent)" opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
  </g>
  <foreignObject x="220" y="170" width="170" height="140">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="q2_item_1" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-size:clamp(11px,2cqw,14px);color:var(--text);padding:10px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Initiative Q2.1</div>
  </foreignObject>
  <foreignObject x="220" y="325" width="170" height="140">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="q2_item_2" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-size:clamp(11px,2cqw,14px);color:var(--text);padding:10px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Initiative Q2.2</div>
  </foreignObject>

  <!-- Q3 -->
  <g filter="url(#soft-shadow)">
    <rect x="410" y="170" width="170" height="140" rx="12" fill="var(--accent)" opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
    <rect x="410" y="325" width="170" height="140" rx="12" fill="var(--accent)" opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
  </g>
  <foreignObject x="410" y="170" width="170" height="140">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="q3_item_1" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-size:clamp(11px,2cqw,14px);color:var(--text);padding:10px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Initiative Q3.1</div>
  </foreignObject>
  <foreignObject x="410" y="325" width="170" height="140">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="q3_item_2" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-size:clamp(11px,2cqw,14px);color:var(--text);padding:10px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Initiative Q3.2</div>
  </foreignObject>

  <!-- Q4 -->
  <g filter="url(#soft-shadow)">
    <rect x="600" y="170" width="170" height="140" rx="12" fill="var(--accent)" opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
    <rect x="600" y="325" width="170" height="140" rx="12" fill="var(--accent)" opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
  </g>
  <foreignObject x="600" y="170" width="170" height="140">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="q4_item_1" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-size:clamp(11px,2cqw,14px);color:var(--text);padding:10px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Initiative Q4.1</div>
  </foreignObject>
  <foreignObject x="600" y="325" width="170" height="140">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="q4_item_2" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-size:clamp(11px,2cqw,14px);color:var(--text);padding:10px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Initiative Q4.2</div>
  </foreignObject>

  <!-- Progress bar at the bottom -->
  <rect x="30" y="520" width="740" height="14" rx="7" fill="var(--text)" opacity="0.10"/>
  <rect x="30" y="520" width="555" height="14" rx="7" fill="var(--primary)"/>
  <circle cx="115" cy="527" r="10" fill="var(--accent)" stroke="var(--bg)" stroke-width="3"/>
  <circle cx="305" cy="527" r="10" fill="var(--accent)" stroke="var(--bg)" stroke-width="3"/>
  <circle cx="495" cy="527" r="10" fill="var(--accent)" stroke="var(--bg)" stroke-width="3"/>
  <circle cx="685" cy="527" r="10" fill="var(--text)" opacity="0.3" stroke="var(--bg)" stroke-width="3"/>
</svg>
