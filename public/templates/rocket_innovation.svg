<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="Plus Jakarta Sans, system-ui, sans-serif">

  <!-- Définitions -->
  <defs>
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:var(--bg);stop-opacity:1"/>
      <stop offset="100%" style="stop-color:var(--primary);stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="noseGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:var(--accent);stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:var(--accent);stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="flameGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:var(--accent);stop-opacity:1"/>
      <stop offset="60%" style="stop-color:var(--primary);stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:var(--primary);stop-opacity:0.2"/>
    </linearGradient>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:var(--accent);stop-opacity:0.18"/>
      <stop offset="80%" style="stop-color:var(--bg);stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="groundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:var(--accent);stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:var(--text);stop-opacity:0.15"/>
    </linearGradient>
  </defs>

  <!-- Fond blanc essentiel -->
  <rect width="1040" height="600" fill="var(--bg)"/>

  <!-- DÉCORATIF : ciel + sol (mode magazine) -->
  <rect width="1040" height="540" fill="url(#skyGradient)" opacity="var(--decoration-opacity, 0)"/>
  <rect y="540" width="1040" height="20" fill="url(#groundGradient)" opacity="var(--decoration-opacity, 0)"/>

  <!-- Header label -->
  <text x="60" y="72" font-size="13" font-weight="600" fill="var(--text)" opacity="0.55"
        style="text-transform: uppercase; letter-spacing: 0.5px;">Innovation Lancement</text>

  <!-- Titre principal -->
  <foreignObject x="60" y="90" width="920" height="56">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title"
         style="width:100%;height:100%;display:flex;align-items:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:36px;color:var(--text);box-sizing:border-box;">
      De l'idée au lancement réussi
    </div>
  </foreignObject>

  <!-- ============================================ -->
  <!-- DÉCORATIF : étoiles dans le ciel au-dessus de la fusée (mode magazine) -->
  <!-- ============================================ -->
  <g opacity="var(--decoration-opacity, 0)">
    <circle cx="160" cy="155" r="2" fill="var(--accent)"/>
    <circle cx="240" cy="170" r="1.5" fill="var(--accent)"/>
    <circle cx="115" cy="180" r="2.5" fill="var(--accent)"/>
    <circle cx="280" cy="195" r="1.5" fill="var(--accent)"/>
    <circle cx="200" cy="210" r="1" fill="var(--accent)"/>
    <line x1="113" y1="178" x2="117" y2="182" stroke="var(--accent)" stroke-width="0.8" opacity="0.6"/>
    <line x1="115" y1="176" x2="115" y2="184" stroke="var(--accent)" stroke-width="0.8" opacity="0.6"/>
    <line x1="159" y1="155" x2="161" y2="155" stroke="var(--accent)" stroke-width="0.6" opacity="0.5"/>
    <line x1="160" y1="153" x2="160" y2="157" stroke="var(--accent)" stroke-width="0.6" opacity="0.5"/>
  </g>

  <!-- ============================================ -->
  <!-- TRAJECTOIRE D'ASCENSION VERTICALE (essentielle) -->
  <!-- ============================================ -->
  <!-- Pointillé qui monte de la fusée vers les étoiles -->
  <path d="M 200 220 Q 195 200 190 175 Q 185 150 180 130"
        stroke="var(--text)" stroke-width="2" fill="none"
        stroke-dasharray="6 5" opacity="0.35"
        stroke-linecap="round"/>

  <!-- ============================================ -->
  <!-- FUMÉE DE DÉCOLLAGE (essentielle, sous la fusée) -->
  <!-- ============================================ -->
  <ellipse cx="200" cy="535" rx="65" ry="14" fill="var(--text)" fill-opacity="0.18"/>
  <ellipse cx="170" cy="530" rx="35" ry="10" fill="var(--text)" fill-opacity="0.12"/>
  <ellipse cx="230" cy="540" rx="40" ry="9" fill="var(--text)" fill-opacity="0.1"/>

  <!-- DÉCORATIF : fumée supplémentaire latérale -->
  <g opacity="var(--decoration-opacity, 0)">
    <ellipse cx="125" cy="525" rx="25" ry="7" fill="var(--text)" fill-opacity="0.15"/>
    <ellipse cx="280" cy="535" rx="22" ry="6" fill="var(--text)" fill-opacity="0.12"/>
    <ellipse cx="100" cy="540" rx="18" ry="5" fill="var(--text)" fill-opacity="0.08"/>
    <ellipse cx="305" cy="540" rx="15" ry="4" fill="var(--text)" fill-opacity="0.08"/>
  </g>

  <!-- ============================================ -->
  <!-- LIGNE DE SOL (essentielle) -->
  <!-- ============================================ -->
  <line x1="60" y1="540" x2="380" y2="540" stroke="var(--text)" stroke-width="1.5" opacity="0.3"/>

  <!-- ============================================ -->
  <!-- FUSÉE VERTICALE — CENTRÉE SUR x=200 -->
  <!-- ============================================ -->
  <!-- Sommet antenne : y=125 / Base flammes : y=515 -->
  <g transform="translate(200, 350)">
    <!-- Hauteur de référence : axe central vertical -->

    <!-- ============================================ -->
    <!-- FLAMMES propulsives (essentielles) — sous la tuyère -->
    <!-- ============================================ -->
    <path d="M -22 130
             L -10 175
             L -5 155
             L 0 200
             L 5 155
             L 10 175
             L 22 130 Z"
          fill="url(#flameGradient)"/>

    <!-- DÉCORATIF : flammes secondaires plus longues -->
    <path d="M -15 130 L -8 165 L 0 220 L 8 165 L 15 130 Z"
          fill="url(#flameGradient)"
          opacity="calc(var(--decoration-opacity, 0) * 0.5)"/>

    <!-- ============================================ -->
    <!-- TUYÈRE / PROPULSEUR (essentiel) -->
    <!-- ============================================ -->
    <path d="M -25 130 L -32 110 L 32 110 L 25 130 Z"
          fill="var(--primary)" fill-opacity="0.85"
          stroke="var(--primary)" stroke-width="1.5"
          stroke-linejoin="round"/>

    <!-- ============================================ -->
    <!-- AILERONS — 2 latéraux -->
    <!-- ============================================ -->
    <path d="M -25 110 L -55 130 L -50 100 L -25 80 Z"
          fill="var(--primary)" fill-opacity="0.7"
          stroke="var(--primary)" stroke-width="1.5"
          stroke-linejoin="round"/>
    <path d="M 25 110 L 55 130 L 50 100 L 25 80 Z"
          fill="var(--primary)" fill-opacity="0.85"
          stroke="var(--primary)" stroke-width="1.5"
          stroke-linejoin="round"/>

    <!-- ============================================ -->
    <!-- FUSELAGE PRINCIPAL (dégradé volume) -->
    <!-- ============================================ -->
    <rect x="-25" y="-100" width="50" height="210" rx="5"
          fill="url(#bodyGradient)"
          stroke="var(--primary)" stroke-width="2.5"
          stroke-linejoin="round"/>

    <!-- ============================================ -->
    <!-- BANDES DÉCORATIVES (essentielles, caractère NASA) -->
    <!-- ============================================ -->
    <rect x="-25" y="-70" width="50" height="12" fill="var(--primary)" fill-opacity="0.85"/>
    <rect x="-25" y="20" width="50" height="12" fill="var(--accent)" fill-opacity="0.85"/>
    <rect x="-25" y="85" width="50" height="12" fill="var(--primary)" fill-opacity="0.85"/>

    <!-- ============================================ -->
    <!-- HUBLOTS — 2 hublots ronds -->
    <!-- ============================================ -->
    <circle cx="0" cy="-30" r="9" fill="var(--bg)"
            stroke="var(--primary)" stroke-width="2"/>
    <circle cx="-2" cy="-32" r="3" fill="var(--accent)" fill-opacity="0.5"/>

    <circle cx="0" cy="60" r="9" fill="var(--bg)"
            stroke="var(--primary)" stroke-width="2"/>
    <circle cx="-2" cy="58" r="3" fill="var(--accent)" fill-opacity="0.5"/>

    <!-- ============================================ -->
    <!-- LOGO "K" stylisé sur le fuselage -->
    <!-- ============================================ -->
    <path d="M -10 -10 L -10 5 L -2 -2 L 8 8 L 8 -8 L -2 -2 Z"
          fill="var(--accent)" fill-opacity="0.9"
          stroke="var(--primary)" stroke-width="1"/>

    <!-- ============================================ -->
    <!-- CÔNE / NEZ POINTU (essentiel) -->
    <!-- ============================================ -->
    <path d="M -25 -100
             Q -15 -130 0 -150
             Q 15 -130 25 -100 Z"
          fill="url(#noseGradient)"
          stroke="var(--primary)" stroke-width="2.5"
          stroke-linejoin="round"/>

    <!-- DÉCORATIF : reflet sur le cône -->
    <path d="M -10 -120 Q -5 -140 0 -148 L -3 -125 Z"
          fill="var(--bg)"
          opacity="calc(var(--decoration-opacity, 0) * 0.5)"/>

    <!-- ============================================ -->
    <!-- ANTENNE au sommet -->
    <!-- ============================================ -->
    <line x1="0" y1="-150" x2="0" y2="-165" stroke="var(--primary)" stroke-width="2"/>
    <circle cx="0" cy="-167" r="2" fill="var(--accent)"/>

    <!-- DÉCORATIF : reflet vertical sur le fuselage -->
    <line x1="-15" y1="-90" x2="-15" y2="100" stroke="var(--bg)" stroke-width="2"
          opacity="calc(var(--decoration-opacity, 0) * 0.4)"/>

  </g>

  <!-- ============================================ -->
  <!-- COLONNE 4 PHASES À DROITE (essentielles) -->
  <!-- Phase 4 en haut (sommet/lancement), Phase 1 en bas (base/idée) -->
  <!-- ============================================ -->

  <!-- Phase 4 : Lancement (en HAUT, mise en valeur) -->
  <rect x="430" y="170" width="540" height="70" rx="12"
        fill="var(--accent)" fill-opacity="0.1"
        stroke="var(--accent)" stroke-width="2.5"/>
  <circle cx="465" cy="205" r="18" fill="var(--accent)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="465" y="211" font-size="15" font-weight="700" fill="var(--bg)" text-anchor="middle">4</text>
  <foreignObject x="495" y="172" width="465" height="66">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="stage_4_launch"
         style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:18px;color:var(--accent);box-sizing:border-box;padding:8px 12px;line-height:1.3;">
      Lancement
    </div>
  </foreignObject>

  <!-- Phase 3 : Développement -->
  <rect x="430" y="260" width="540" height="70" rx="12"
        fill="var(--bg)" stroke="var(--primary)" stroke-width="2"/>
  <circle cx="465" cy="295" r="18" fill="var(--primary)" fill-opacity="0.15"
          stroke="var(--primary)" stroke-width="1.5"/>
  <text x="465" y="301" font-size="14" font-weight="700" fill="var(--primary)" text-anchor="middle">3</text>
  <foreignObject x="495" y="262" width="465" height="66">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="stage_3_development"
         style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;padding:8px 12px;line-height:1.3;">
      Développement
    </div>
  </foreignObject>

  <!-- Phase 2 : Stratégie -->
  <rect x="430" y="350" width="540" height="70" rx="12"
        fill="var(--bg)" stroke="var(--accent)" stroke-width="2"/>
  <circle cx="465" cy="385" r="18" fill="var(--accent)" fill-opacity="0.15"
          stroke="var(--accent)" stroke-width="1.5"/>
  <text x="465" y="391" font-size="14" font-weight="700" fill="var(--accent)" text-anchor="middle">2</text>
  <foreignObject x="495" y="352" width="465" height="66">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="stage_2_strategy"
         style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;padding:8px 12px;line-height:1.3;">
      Stratégie
    </div>
  </foreignObject>

  <!-- Phase 1 : Idée (en BAS, point de départ) -->
  <rect x="430" y="440" width="540" height="70" rx="12"
        fill="var(--bg)" stroke="var(--primary)" stroke-width="2"/>
  <circle cx="465" cy="475" r="18" fill="var(--primary)" fill-opacity="0.15"
          stroke="var(--primary)" stroke-width="1.5"/>
  <text x="465" y="481" font-size="14" font-weight="700" fill="var(--primary)" text-anchor="middle">1</text>
  <foreignObject x="495" y="442" width="465" height="66">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="stage_1_idea"
         style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;padding:8px 12px;line-height:1.3;">
      Idée
    </div>
  </foreignObject>

  <!-- Footer -->
  <text x="60" y="585" font-size="11" font-weight="600" fill="var(--text)" opacity="0.5"
        style="text-transform: uppercase; letter-spacing: 0.5px;">
    Krobar · Innovation
  </text>

</svg>
