      <path d="M2 1L8 5L2 9" fill="none" stroke="var(--cool)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <line x1="60" y1="320" x2="640" y2="320" stroke="var(--border)" stroke-width="0.6"/>
