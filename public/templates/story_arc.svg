<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="Plus Jakarta Sans, system-ui, sans-serif">
  <defs>
    <filter id="editorialShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="var(--primary)" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="1040" height="600" fill="var(--bg)"/>

  <g transform="translate(60, 60)" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
  </g>

  <text x="105" y="72" font-size="13" font-weight="600" letter-spacing="1.04" fill="var(--text)" opacity="0.55" style="text-transform: uppercase;">Récit · Arc narratif en 5 actes</text>

  <foreignObject x="60" y="90" width="920" height="56">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:36px;letter-spacing:-0.01em;color:var(--text);box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Trajectoire narrative</div>
  </foreignObject>

  <line x1="60" y1="160" x2="148" y2="160" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>

  <g filter="url(#editorialShadow)">
    <rect x="60" y="200" width="920" height="360" rx="12" fill="#FFFFFF" stroke="var(--text)" stroke-opacity="0.12" stroke-width="1" id="act_1"/>
  </g>

  <path d="M 140,470 C 220,460 270,420 320,375 C 380,325 460,295 520,295 C 580,295 660,325 720,375 C 770,420 820,460 900,470" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6"/>

  <g>
    <text x="60" y="510" font-size="10" font-weight="700" fill="var(--accent)" style="text-transform: uppercase; letter-spacing: 0.08em;">Acte 1</text>
    <foreignObject x="60" y="515" width="180" height="40" data-shape="act_1">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="act_1" style="width:100%;height:100%;display:flex;align-items:flex-start;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:500;font-size:12px;line-height:1.4;color:var(--text);box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Situation initiale</div>
    </foreignObject>
    <circle cx="140" cy="470" r="20" fill="var(--accent)" stroke="#FFFFFF" stroke-width="3"/>
    <text x="140" y="476" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  </g>

  <g>
    <text x="245" y="328" font-size="10" font-weight="700" fill="var(--accent)" style="text-transform: uppercase; letter-spacing: 0.08em;">Acte 2</text>
    <foreignObject x="245" y="332" width="180" height="40" data-shape="act_1">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="act_2" style="width:100%;height:100%;display:flex;align-items:flex-start;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:500;font-size:12px;line-height:1.4;color:var(--text);box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Élément déclencheur</div>
    </foreignObject>
    <circle cx="320" cy="375" r="20" fill="var(--accent)" stroke="#FFFFFF" stroke-width="3"/>
    <text x="320" y="381" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  </g>

  <g>
    <text x="430" y="248" font-size="10" font-weight="700" fill="var(--accent)" style="text-transform: uppercase; letter-spacing: 0.08em;">Acte 3 · Climax</text>
    <foreignObject x="430" y="252" width="180" height="40" data-shape="act_1">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="act_3" style="width:100%;height:100%;display:flex;align-items:flex-start;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:12px;line-height:1.4;color:var(--text);box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Apogée du récit</div>
    </foreignObject>
    <circle cx="520" cy="295" r="22" fill="var(--accent)" stroke="#FFFFFF" stroke-width="3"/>
    <text x="520" y="301" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  </g>

  <g>
    <text x="640" y="328" font-size="10" font-weight="700" fill="var(--accent)" style="text-transform: uppercase; letter-spacing: 0.08em;">Acte 4</text>
    <foreignObject x="640" y="332" width="180" height="40" data-shape="act_1">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="act_4" style="width:100%;height:100%;display:flex;align-items:flex-start;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:500;font-size:12px;line-height:1.4;color:var(--text);box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Résolution</div>
    </foreignObject>
    <circle cx="720" cy="375" r="20" fill="var(--accent)" stroke="#FFFFFF" stroke-width="3"/>
    <text x="720" y="381" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  </g>

  <g>
    <text x="800" y="510" font-size="10" font-weight="700" fill="var(--accent)" style="text-transform: uppercase; letter-spacing: 0.08em;">Acte 5</text>
    <foreignObject x="800" y="515" width="180" height="40" data-shape="act_1">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="act_5" style="width:100%;height:100%;display:flex;align-items:flex-start;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:500;font-size:12px;line-height:1.4;color:var(--text);box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Situation finale</div>
    </foreignObject>
    <circle cx="900" cy="470" r="20" fill="var(--accent)" stroke="#FFFFFF" stroke-width="3"/>
    <text x="900" y="476" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  </g>

  <text x="60" y="585" font-size="11" font-weight="600" letter-spacing="0.88" fill="var(--text)" opacity="0.5" style="text-transform: uppercase;">Krobar · Narrative</text>
</svg>
