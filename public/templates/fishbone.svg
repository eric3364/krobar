<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Inter, system-ui, sans-serif">
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="fb-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--primary)"/>
    </marker>
  </defs>

  <rect width="800" height="600" fill="var(--bg)"/>

  <foreignObject x="20" y="10" width="760" height="50">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:clamp(18px,3cqw,26px);color:var(--text);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Diagramme d'Ishikawa</div>
  </foreignObject>

  <!-- Spine: horizontal line ending in arrow at the effect box -->
  <line x1="60" y1="320" x2="600" y2="320" stroke="var(--primary)" stroke-width="4" marker-end="url(#fb-arrow)"/>

  <!-- Effect box on the right -->
  <g filter="url(#soft-shadow)">
    <rect x="610" y="260" width="170" height="120" rx="12" fill="var(--primary)"/>
  </g>
  <foreignObject x="610" y="260" width="170" height="120">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="effect" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:clamp(12px,2.4cqw,16px);color:var(--bg);padding:10px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Effet</div>
  </foreignObject>

  <!-- 4 oblique branches: 2 top, 2 bottom. Each ends at the spine.
       Top-left attaches at (180,320), branch goes up-left to (90,120)
       Top-right attaches at (430,320), branch goes up-left to (340,120)
       Bottom-left attaches at (180,320), goes down-left to (90,520)
       Bottom-right attaches at (430,320), goes down-left to (340,520)
  -->

  <!-- Branch 1 (top-left) -->
  <line x1="90" y1="120" x2="180" y2="320" stroke="var(--accent)" stroke-width="3"/>
  <g filter="url(#soft-shadow)">
    <rect x="20" y="80" width="160" height="40" rx="10" fill="var(--accent)"/>
  </g>
  <foreignObject x="20" y="80" width="160" height="40">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="category_1" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:clamp(10px,2.2cqw,13px);color:var(--bg);padding:6px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Catégorie 1</div>
  </foreignObject>
  <!-- sub-causes (small oblique lines off the branch) -->
  <line x1="115" y1="178" x2="170" y2="170" stroke="var(--text)" stroke-width="2" opacity="0.6"/>
  <foreignObject x="170" y="150" width="130" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="cause_1_1" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;text-align:left;font-family:Inter,system-ui,sans-serif;font-size:clamp(10px,1.6cqw,12px);color:var(--text);padding:4px 6px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Cause 1.1</div>
  </foreignObject>
  <line x1="142" y1="237" x2="200" y2="230" stroke="var(--text)" stroke-width="2" opacity="0.6"/>
  <foreignObject x="200" y="210" width="130" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="cause_1_2" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;text-align:left;font-family:Inter,system-ui,sans-serif;font-size:clamp(10px,1.6cqw,12px);color:var(--text);padding:4px 6px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Cause 1.2</div>
  </foreignObject>

  <!-- Branch 2 (top-right) -->
  <line x1="340" y1="120" x2="430" y2="320" stroke="var(--accent)" stroke-width="3"/>
  <g filter="url(#soft-shadow)">
    <rect x="270" y="80" width="160" height="40" rx="10" fill="var(--accent)"/>
  </g>
  <foreignObject x="270" y="80" width="160" height="40">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="category_2" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:clamp(10px,2.2cqw,13px);color:var(--bg);padding:6px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Catégorie 2</div>
  </foreignObject>
  <line x1="365" y1="178" x2="420" y2="170" stroke="var(--text)" stroke-width="2" opacity="0.6"/>
  <foreignObject x="420" y="150" width="140" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="cause_2_1" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;text-align:left;font-family:Inter,system-ui,sans-serif;font-size:clamp(10px,1.6cqw,12px);color:var(--text);padding:4px 6px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Cause 2.1</div>
  </foreignObject>
  <line x1="392" y1="237" x2="450" y2="230" stroke="var(--text)" stroke-width="2" opacity="0.6"/>
  <foreignObject x="450" y="210" width="140" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="cause_2_2" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;text-align:left;font-family:Inter,system-ui,sans-serif;font-size:clamp(10px,1.6cqw,12px);color:var(--text);padding:4px 6px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Cause 2.2</div>
  </foreignObject>

  <!-- Branch 3 (bottom-left) -->
  <line x1="90" y1="520" x2="180" y2="320" stroke="var(--accent)" stroke-width="3"/>
  <g filter="url(#soft-shadow)">
    <rect x="20" y="520" width="160" height="40" rx="10" fill="var(--accent)"/>
  </g>
  <foreignObject x="20" y="520" width="160" height="40">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="category_3" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:clamp(10px,2.2cqw,13px);color:var(--bg);padding:6px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Catégorie 3</div>
  </foreignObject>
  <line x1="115" y1="462" x2="170" y2="470" stroke="var(--text)" stroke-width="2" opacity="0.6"/>
  <foreignObject x="170" y="455" width="130" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="cause_3_1" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;text-align:left;font-family:Inter,system-ui,sans-serif;font-size:clamp(10px,1.6cqw,12px);color:var(--text);padding:4px 6px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Cause 3.1</div>
  </foreignObject>
  <line x1="142" y1="403" x2="200" y2="411" stroke="var(--text)" stroke-width="2" opacity="0.6"/>
  <foreignObject x="200" y="395" width="130" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="cause_3_2" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;text-align:left;font-family:Inter,system-ui,sans-serif;font-size:clamp(10px,1.6cqw,12px);color:var(--text);padding:4px 6px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Cause 3.2</div>
  </foreignObject>

  <!-- Branch 4 (bottom-right) -->
  <line x1="340" y1="520" x2="430" y2="320" stroke="var(--accent)" stroke-width="3"/>
  <g filter="url(#soft-shadow)">
    <rect x="270" y="520" width="160" height="40" rx="10" fill="var(--accent)"/>
  </g>
  <foreignObject x="270" y="520" width="160" height="40">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="category_4" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:clamp(10px,2.2cqw,13px);color:var(--bg);padding:6px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Catégorie 4</div>
  </foreignObject>
  <line x1="365" y1="462" x2="420" y2="470" stroke="var(--text)" stroke-width="2" opacity="0.6"/>
  <foreignObject x="420" y="455" width="140" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="cause_4_1" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;text-align:left;font-family:Inter,system-ui,sans-serif;font-size:clamp(10px,1.6cqw,12px);color:var(--text);padding:4px 6px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Cause 4.1</div>
  </foreignObject>
  <line x1="392" y1="403" x2="450" y2="411" stroke="var(--text)" stroke-width="2" opacity="0.6"/>
  <foreignObject x="450" y="395" width="140" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="cause_4_2" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;text-align:left;font-family:Inter,system-ui,sans-serif;font-size:clamp(10px,1.6cqw,12px);color:var(--text);padding:4px 6px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Cause 4.2</div>
  </foreignObject>
</svg>
