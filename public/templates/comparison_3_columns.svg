<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="Plus Jakarta Sans, system-ui, sans-serif">
  <rect width="1040" height="600" fill="var(--bg)"/>
  <text x="105" y="72" font-size="13" font-weight="600" fill="var(--text)" opacity="0.55" style="text-transform: uppercase;">Comparaison 3 Colonnes</text>
  <foreignObject x="60" y="90" width="920" height="56">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="width:100%;height:100%;display:flex;align-items:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:36px;color:var(--text);box-sizing:border-box;">Comparaison des solutions</div>
  </foreignObject>
  
  <!-- Column 1 -->
  <rect x="80" y="180" width="280" height="320" rx="12" fill="var(--primary)" fill-opacity="0.05" stroke="var(--primary)" stroke-width="2"/>
  <foreignObject x="90" y="200" width="180" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="column_1_title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:18px;color:var(--primary);box-sizing:border-box;">Solution A</div>
  </foreignObject>
  <foreignObject x="90" y="250" width="180" height="200">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="column_1_content" style="width:100%;height:100%;display:flex;align-items:flex-start;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:400;font-size:15px;color:var(--text);line-height:1.5;box-sizing:border-box;">• Coût faible<br/>• Déploiement rapide<br/>• Maintenance simple</div>
  </foreignObject>
  
  <!-- Column 2 -->
  <rect x="380" y="180" width="280" height="320" rx="12" fill="var(--accent)" fill-opacity="0.05" stroke="var(--accent)" stroke-width="2"/>
  <foreignObject x="390" y="200" width="180" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="column_2_title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:18px;color:var(--accent);box-sizing:border-box;">Solution B</div>
  </foreignObject>
  <foreignObject x="390" y="250" width="180" height="200">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="column_2_content" style="width:100%;height:100%;display:flex;align-items:flex-start;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:400;font-size:15px;color:var(--text);line-height:1.5;box-sizing:border-box;">• Équilibre coût/fonctionnalités<br/>• Évolutif<br/>• Support technique</div>
  </foreignObject>
  
  <!-- Column 3 -->
  <rect x="680" y="180" width="280" height="320" rx="12" fill="var(--primary)" fill-opacity="0.05" stroke="var(--primary)" stroke-width="2"/>
  <foreignObject x="690" y="200" width="180" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="column_3_title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:18px;color:var(--primary);box-sizing:border-box;">Solution C</div>
  </foreignObject>
  <foreignObject x="690" y="250" width="180" height="200">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="column_3_content" style="width:100%;height:100%;display:flex;align-items:flex-start;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:400;font-size:15px;color:var(--text);line-height:1.5;box-sizing:border-box;">• Fonctionnalités avancées<br/>• Haute performance<br/>• Personnalisable</div>
  </foreignObject>
  
  <text x="60" y="580" font-size="11" font-weight="600" fill="var(--text)" opacity="0.5" style="text-transform: uppercase;">Krobar · Comparaisons</text>
</svg>
