  </foreignObject>
  <foreignObject x="290" y="440" width="220" height="120">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="col_2_item_3" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-size:clamp(11px,1.6cqw,15px);color:var(--text);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Élément 3</div>
  </foreignObject>

  <!-- Col 3 -->
  <g filter="url(#soft-shadow)">
    <rect x="530" y="100" width="240" height="470" rx="12" fill="var(--primary)" opacity="0.08" stroke="var(--primary)" stroke-width="2"/>
  </g>
  <rect x="530" y="100" width="240" height="60" rx="12" fill="var(--primary)"/>
  <foreignObject x="530" y="100" width="240" height="60">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="col_3_label" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:clamp(13px,2.2cqw,18px);color:var(--bg);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Option C</div>
  </foreignObject>
  <foreignObject x="540" y="180" width="220" height="120">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="col_3_item_1" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-size:clamp(11px,1.6cqw,15px);color:var(--text);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Élément 1</div>
  </foreignObject>
  <foreignObject x="540" y="310" width="220" height="120">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="col_3_item_2" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-size:clamp(11px,1.6cqw,15px);color:var(--text);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Élément 2</div>
  </foreignObject>
  <foreignObject x="540" y="440" width="220" height="120">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="col_3_item_3" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-size:clamp(11px,1.6cqw,15px);color:var(--text);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Élément 3</div>
  </foreignObject>
</svg>
