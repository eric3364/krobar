<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="Plus Jakarta Sans, system-ui, sans-serif">
  <defs>
    <mask id="donut1">
      <rect width="100%" height="100%" fill="white"/>
      <circle cx="200" cy="200" r="40" fill="black"/>
    </mask>
    <mask id="donut2">
      <rect width="100%" height="100%" fill="white"/>
      <circle cx="600" cy="200" r="40" fill="black"/>
    </mask>
    <mask id="donut3">
      <rect width="100%" height="100%" fill="white"/>
      <circle cx="1000" cy="200" r="40" fill="black"/>
    </mask>
  </defs>

  <rect width="1200" height="400" fill="var(--bg)"/>
  <text x="105" y="72" font-size="13" font-weight="600" fill="var(--text)" opacity="0.55" style="text-transform: uppercase;">Dashboard KPI</text>
  <foreignObject x="60" y="90" width="1080" height="56">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="width:100%;height:100%;display:flex;align-items:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:36px;color:var(--text);box-sizing:border-box;">Indicateurs de performance</div>
  </foreignObject>

  <!-- Donut 1: Sales (75%) -->
  <g>
    <circle cx="200" cy="200" r="70" fill="var(--primary)" fill-opacity="0.1" mask="url(#donut1)"/>
    <circle cx="200" cy="200" r="70" fill="none" stroke="var(--primary)" stroke-width="20" stroke-dasharray="329.87 109.96" stroke-dashoffset="-82.47" transform="rotate(-90 200 200)" mask="url(#donut1)"/>
    <text x="200" y="195" font-size="28" font-weight="700" fill="var(--primary)" text-anchor="middle">75%</text>
    <text x="200" y="210" font-size="12" fill="var(--text)" text-anchor="middle" opacity="0.7">OBJECTIF</text>
  </g>
  <foreignObject x="120" y="290" width="180" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="kpi_1_title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Ventes</div>
  </foreignObject>

  <!-- Donut 2: Customer Satisfaction (85%) -->
  <g>
    <circle cx="600" cy="200" r="70" fill="var(--accent)" fill-opacity="0.1" mask="url(#donut2)"/>
    <circle cx="600" cy="200" r="70" fill="none" stroke="var(--accent)" stroke-width="20" stroke-dasharray="373.85 65.98" stroke-dashoffset="-82.47" transform="rotate(-90 600 200)" mask="url(#donut2)"/>
    <text x="600" y="195" font-size="28" font-weight="700" fill="var(--accent)" text-anchor="middle">85%</text>
    <text x="600" y="210" font-size="12" fill="var(--text)" text-anchor="middle" opacity="0.7">SATISFACTION</text>
  </g>
  <foreignObject x="520" y="290" width="180" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="kpi_2_title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Satisfaction Client</div>
  </foreignObject>

  <!-- Donut 3: Team Performance (92%) -->
  <g>
    <circle cx="1000" cy="200" r="70" fill="var(--primary)" fill-opacity="0.1" mask="url(#donut3)"/>
    <circle cx="1000" cy="200" r="70" fill="none" stroke="var(--primary)" stroke-width="20" stroke-dasharray="404.67 35.16" stroke-dashoffset="-82.47" transform="rotate(-90 1000 200)" mask="url(#donut3)"/>
    <text x="1000" y="195" font-size="28" font-weight="700" fill="var(--primary)" text-anchor="middle">92%</text>
    <text x="1000" y="210" font-size="12" fill="var(--text)" text-anchor="middle" opacity="0.7">PERFORMANCE</text>
  </g>
  <foreignObject x="920" y="290" width="180" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="kpi_3_title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Équipe</div>
  </foreignObject>

  <text x="60" y="380" font-size="11" font-weight="600" fill="var(--text)" opacity="0.5" style="text-transform: uppercase;">Krobar · Dashboard</text>
</svg>
