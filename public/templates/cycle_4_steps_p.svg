  <metadata>
    <ns1:krobar-meta>
      <ns1:id>cycle_4_steps_p</ns1:id>
      <ns1:name>Cycle 4 étapes</ns1:name>
      <ns1:category>Process</ns1:category>
      <ns1:tier>premium</ns1:tier>
      <ns1:description>Cycle itératif de 4 phases qui se répètent en boucle. Idéal pour les processus récurrents type PDCA, amélioration continue, sprints agiles.</ns1:description>
      <ns1:best-for>cycle itératif, amélioration continue, boucle de feedback, processus récurrent</ns1:best-for>
      <ns1:markers>cycle, cyclique, itération, itératif, itère, boucle, en boucle, rotation, récurrence, récurrent, périodique, périodiquement, répétition, répété, à répéter, amélioration continue, kaizen, scrum, sprint, PDCA, Plan-Do-Check-Act, roue de Deming, phase 1, phase 2, phase 3, phase 4, à chaque cycle, à chaque itération</ns1:markers>
      <ns1:matching-types>process_cyclic</ns1:matching-types>
      <ns1:test-text>La roue de Deming structure l'amélioration continue en quatre phases qui se répètent en boucle : planifier les actions, déployer sur le terrain, vérifier les résultats, agir sur les écarts détectés.</ns1:test-text>
    </ns1:krobar-meta>
