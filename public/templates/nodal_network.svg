    <rect id="node_4" x="1000" y="400" width="140" height="60" rx="8" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="2"/>
    <foreignObject data-shape="node_4" x="1000" y="400" width="140" height="60">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="node_4" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;word-wrap:break-word;overflow-wrap:anywhere;line-height:1.2;padding:4px 8px;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:14px;color:var(--text);box-sizing:border-box;">ERP</div>
    </foreignObject>
    <line data-from="hub" data-to="node_4" x1="0" y1="0" x2="0" y2="0" stroke="#ef4444" stroke-width="3" opacity="0.7"/>
  </g>

  <g class="slot-group" data-slot-key="node_5">
    <rect id="node_5" x="800" y="600" width="140" height="60" rx="8" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="2"/>
    <foreignObject data-shape="node_5" x="800" y="600" width="140" height="60">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="node_5" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;word-wrap:break-word;overflow-wrap:anywhere;line-height:1.2;padding:4px 8px;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:14px;color:var(--text);box-sizing:border-box;">Support</div>
    </foreignObject>
    <line data-from="hub" data-to="node_5" x1="0" y1="0" x2="0" y2="0" stroke="#8b5cf6" stroke-width="3" opacity="0.7"/>
  </g>

  <g class="slot-group" data-slot-key="node_6">
    <rect id="node_6" x="500" y="650" width="140" height="60" rx="8" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="2"/>
    <foreignObject data-shape="node_6" x="500" y="650" width="140" height="60">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="node_6" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;word-wrap:break-word;overflow-wrap:anywhere;line-height:1.2;padding:4px 8px;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:14px;color:var(--text);box-sizing:border-box;">Database</div>
    </foreignObject>
    <line data-from="hub" data-to="node_6" x1="0" y1="0" x2="0" y2="0" stroke="#06b6d4" stroke-width="3" opacity="0.7"/>
  </g>

  <g class="slot-group" data-slot-key="node_7">
    <rect id="node_7" x="200" y="600" width="140" height="60" rx="8" fill="#84cc16" fill-opacity="0.2" stroke="#84cc16" stroke-width="2"/>
    <foreignObject data-shape="node_7" x="200" y="600" width="140" height="60">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="node_7" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;word-wrap:break-word;overflow-wrap:anywhere;line-height:1.2;padding:4px 8px;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:14px;color:var(--text);box-sizing:border-box;">Marketing</div>
    </foreignObject>
    <line data-from="hub" data-to="node_7" x1="0" y1="0" x2="0" y2="0" stroke="#84cc16" stroke-width="3" opacity="0.7"/>
  </g>

  <g class="slot-group" data-slot-key="node_8">
    <rect id="node_8" x="100" y="400" width="140" height="60" rx="8" fill="#f97316" fill-opacity="0.2" stroke="#f97316" stroke-width="2"/>
    <foreignObject data-shape="node_8" x="100" y="400" width="140" height="60">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="node_8" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;word-wrap:break-word;overflow-wrap:anywhere;line-height:1.2;padding:4px 8px;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:14px;color:var(--text);box-sizing:border-box;">Finance</div>
    </foreignObject>
    <line data-from="hub" data-to="node_8" x1="0" y1="0" x2="0" y2="0" stroke="#f97316" stroke-width="3" opacity="0.7"/>
  </g>

  <text x="60" y="880" font-size="11" font-weight="600" fill="var(--text)" opacity="0.5" style="text-transform: uppercase;">Krobar · Network</text>
</svg>
