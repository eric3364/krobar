<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="Plus Jakarta Sans, system-ui, sans-serif">
  <rect width="1400" height="900" fill="var(--bg)"/>
  <text x="105" y="72" font-size="13" font-weight="600" fill="var(--text)" opacity="0.55" style="text-transform: uppercase;">Réseau Nodal</text>
  <foreignObject x="60" y="90" width="1280" height="56">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="width:100%;height:100%;display:flex;align-items:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:36px;color:var(--text);box-sizing:border-box;word-wrap:break-word;overflow-wrap:anywhere;line-height:1.1;">Écosystème d'intégrations et connexions</div>
  </foreignObject>

  <!-- Central hub : id="hub" + foreignObject data-shape="hub" -->
  <rect id="hub" x="600" y="400" width="200" height="100" rx="12" fill="var(--primary)" fill-opacity="0.3" stroke="var(--primary)" stroke-width="4"/>
  <foreignObject data-shape="hub" x="600" y="400" width="200" height="100">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="central_hub" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;word-wrap:break-word;overflow-wrap:anywhere;line-height:1.2;padding:4px 12px;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:18px;color:var(--primary);box-sizing:border-box;">Plateforme Centrale</div>
  </foreignObject>

  <g class="slot-group" data-slot-key="node_1">
    <rect id="node_1" x="200" y="200" width="140" height="60" rx="8" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="2"/>
    <foreignObject data-shape="node_1" x="200" y="200" width="140" height="60">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="node_1" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;word-wrap:break-word;overflow-wrap:anywhere;line-height:1.2;padding:4px 8px;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:14px;color:var(--text);box-sizing:border-box;">CRM System</div>
    </foreignObject>
    <line data-from="hub" data-to="node_1" x1="0" y1="0" x2="0" y2="0" stroke="#3b82f6" stroke-width="3" opacity="0.7"/>
  </g>

  <g class="slot-group" data-slot-key="node_2">
    <rect id="node_2" x="500" y="180" width="140" height="60" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="2"/>
    <foreignObject data-shape="node_2" x="500" y="180" width="140" height="60">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="node_2" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;word-wrap:break-word;overflow-wrap:anywhere;line-height:1.2;padding:4px 8px;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:14px;color:var(--text);box-sizing:border-box;">Analytics</div>
    </foreignObject>
    <line data-from="hub" data-to="node_2" x1="0" y1="0" x2="0" y2="0" stroke="#10b981" stroke-width="3" opacity="0.7"/>
  </g>

  <g class="slot-group" data-slot-key="node_3">
    <rect id="node_3" x="800" y="200" width="140" height="60" rx="8" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="2"/>
    <foreignObject data-shape="node_3" x="800" y="200" width="140" height="60">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="node_3" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;word-wrap:break-word;overflow-wrap:anywhere;line-height:1.2;padding:4px 8px;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:14px;color:var(--text);box-sizing:border-box;">E-Commerce</div>
    </foreignObject>
    <line data-from="hub" data-to="node_3" x1="0" y1="0" x2="0" y2="0" stroke="#f59e0b" stroke-width="3" opacity="0.7"/>
  </g>

