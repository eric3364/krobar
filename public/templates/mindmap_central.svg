<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="Plus Jakarta Sans, system-ui, sans-serif">
  <rect width="1040" height="600" fill="var(--bg)"/>
  <text x="105" y="72" font-size="13" font-weight="600" fill="var(--text)" opacity="0.55" style="text-transform: uppercase;">Carte Mentale</text>
  <foreignObject x="60" y="90" width="920" height="56">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="width:100%;height:100%;display:flex;align-items:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:36px;color:var(--text);box-sizing:border-box;word-wrap:break-word;overflow-wrap:anywhere;line-height:1.1;">Stratégie d'entreprise</div>
  </foreignObject>

  <!-- Centre : id="centre" -->
  <circle id="centre" cx="520" cy="320" r="80" fill="var(--primary)" fill-opacity="0.2" stroke="var(--primary)" stroke-width="3"/>
  <foreignObject x="450" y="280" width="140" height="80">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="central_topic" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;word-wrap:break-word;overflow-wrap:anywhere;line-height:1.2;padding:4px 8px;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:16px;color:var(--primary);box-sizing:border-box;">Sujet central</div>
  </foreignObject>

  <g class="slot-group" data-slot-key="branch_1">
    <line data-from="centre" data-to="branch_1" x1="0" y1="0" x2="0" y2="0" stroke="var(--accent)" stroke-width="3"/>
    <circle id="branch_1" cx="520" cy="160" r="55" fill="var(--accent)" fill-opacity="0.1" stroke="var(--accent)" stroke-width="2"/>
    <foreignObject x="470" y="120" width="100" height="80">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="branch_1" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;word-wrap:break-word;overflow-wrap:anywhere;line-height:1.2;padding:2px 4px;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:13px;color:var(--text);box-sizing:border-box;">Marketing</div>
    </foreignObject>
  </g>

  <g class="slot-group" data-slot-key="branch_2">
    <line data-from="centre" data-to="branch_2" x1="0" y1="0" x2="0" y2="0" stroke="var(--accent)" stroke-width="3"/>
    <circle id="branch_2" cx="700" cy="180" r="55" fill="var(--accent)" fill-opacity="0.1" stroke="var(--accent)" stroke-width="2"/>
    <foreignObject x="650" y="140" width="100" height="80">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="branch_2" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;word-wrap:break-word;overflow-wrap:anywhere;line-height:1.2;padding:2px 4px;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:13px;color:var(--text);box-sizing:border-box;">Innovation</div>
    </foreignObject>
  </g>

  <g class="slot-group" data-slot-key="branch_3">
    <line data-from="centre" data-to="branch_3" x1="0" y1="0" x2="0" y2="0" stroke="var(--accent)" stroke-width="3"/>
    <circle id="branch_3" cx="740" cy="320" r="55" fill="var(--accent)" fill-opacity="0.1" stroke="var(--accent)" stroke-width="2"/>
    <foreignObject x="690" y="280" width="100" height="80">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="branch_3" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;word-wrap:break-word;overflow-wrap:anywhere;line-height:1.2;padding:2px 4px;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:13px;color:var(--text);box-sizing:border-box;">Opérations</div>
    </foreignObject>
  </g>

  <g class="slot-group" data-slot-key="branch_4">
    <line data-from="centre" data-to="branch_4" x1="0" y1="0" x2="0" y2="0" stroke="var(--accent)" stroke-width="3"/>
    <circle id="branch_4" cx="700" cy="460" r="55" fill="var(--accent)" fill-opacity="0.1" stroke="var(--accent)" stroke-width="2"/>
    <foreignObject x="650" y="420" width="100" height="80">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="branch_4" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;word-wrap:break-word;overflow-wrap:anywhere;line-height:1.2;padding:2px 4px;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:13px;color:var(--text);box-sizing:border-box;">Finances</div>
    </foreignObject>
  </g>

  <g class="slot-group" data-slot-key="branch_5">
    <line data-from="centre" data-to="branch_5" x1="0" y1="0" x2="0" y2="0" stroke="var(--accent)" stroke-width="3"/>
    <circle id="branch_5" cx="340" cy="460" r="55" fill="var(--accent)" fill-opacity="0.1" stroke="var(--accent)" stroke-width="2"/>
    <foreignObject x="290" y="420" width="100" height="80">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="branch_5" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;word-wrap:break-word;overflow-wrap:anywhere;line-height:1.2;padding:2px 4px;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:13px;color:var(--text);box-sizing:border-box;">Ressources humaines</div>
    </foreignObject>
  </g>

  <g class="slot-group" data-slot-key="branch_6">
    <line data-from="centre" data-to="branch_6" x1="0" y1="0" x2="0" y2="0" stroke="var(--accent)" stroke-width="3"/>
    <circle id="branch_6" cx="300" cy="320" r="55" fill="var(--accent)" fill-opacity="0.1" stroke="var(--accent)" stroke-width="2"/>
    <foreignObject x="250" y="280" width="100" height="80">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="branch_6" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;word-wrap:break-word;overflow-wrap:anywhere;line-height:1.2;padding:2px 4px;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:13px;color:var(--text);box-sizing:border-box;">Technologies</div>
    </foreignObject>
  </g>

  <text x="60" y="580" font-size="11" font-weight="600" fill="var(--text)" opacity="0.5" style="text-transform: uppercase;">Krobar · Mindmap</text>
</svg>
