<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Plus Jakarta Sans, system-ui, sans-serif">
  <defs>
    <filter id="realisticShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="3" dy="6" result="offset"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
    <linearGradient id="realisticGradient1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4"/>
      <stop offset="50%" style="stop-color:var(--primary);stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:var(--primary);stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="realisticGradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4"/>
      <stop offset="50%" style="stop-color:var(--accent);stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:var(--accent);stop-opacity:1"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="600" fill="var(--bg)"/>
  <text x="105" y="72" font-size="13" font-weight="600" fill="var(--text)" opacity="0.55" style="text-transform: uppercase;">Effet Réaliste</text>
  <foreignObject x="60" y="90" width="880" height="56">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="width:100%;height:100%;display:flex;align-items:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:36px;color:var(--text);box-sizing:border-box;">Rendu réaliste avec ombres et reliefs</div>
  </foreignObject>

  <!-- Realistic card 1 -->
  <rect x="100" y="200" width="200" height="120" rx="12" fill="url(#realisticGradient1)" stroke="var(--primary)" stroke-width="1" filter="url(#realisticShadow)" id="card_1_title"/>
  <circle cx="130" cy="230" r="8" fill="#ffffff" opacity="0.8"/>
  <foreignObject x="110" y="250" width="180" height="30" data-shape="card_1_title">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="card_1_title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--bg);box-sizing:border-box;">Design System</div>
  </foreignObject>

  <!-- Realistic card 2 -->
  <rect x="350" y="180" width="200" height="120" rx="12" fill="url(#realisticGradient2)" stroke="var(--accent)" stroke-width="1" filter="url(#realisticShadow)" id="card_2_title"/>
  <circle cx="380" cy="210" r="8" fill="#ffffff" opacity="0.8"/>
  <foreignObject x="360" y="230" width="180" height="30" data-shape="card_2_title">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="card_2_title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--bg);box-sizing:border-box;">User Experience</div>
  </foreignObject>

  <!-- Realistic card 3 -->
  <rect x="600" y="220" width="200" height="120" rx="12" fill="url(#realisticGradient1)" stroke="var(--primary)" stroke-width="1" filter="url(#realisticShadow)" id="card_3_title"/>
  <circle cx="630" cy="250" r="8" fill="#ffffff" opacity="0.8"/>
  <foreignObject x="610" y="270" width="180" height="30" data-shape="card_3_title">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="card_3_title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--bg);box-sizing:border-box;">Development</div>
  </foreignObject>

  <!-- Realistic connecting elements -->
  <path d="M 300 260 Q 325 240 350 250" stroke="var(--text)" stroke-width="2" opacity="0.6" filter="url(#realisticShadow)"/>
  <path d="M 550 240 Q 575 220 600 270" stroke="var(--text)" stroke-width="2" opacity="0.6" filter="url(#realisticShadow)"/>

  <!-- Realistic button -->
  <rect x="300" y="400" width="160" height="50" rx="25" fill="url(#realisticGradient2)" stroke="var(--accent)" stroke-width="1" filter="url(#realisticShadow)" id="action_button"/>
  <foreignObject x="310" y="415" width="180" height="20" data-shape="action_button">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="action_button" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--bg);box-sizing:border-box;">Démarrer</div>
  </foreignObject>

  <text x="60" y="580" font-size="11" font-weight="600" fill="var(--text)" opacity="0.5" style="text-transform: uppercase;">Krobar · Realistic</text>
</svg>
