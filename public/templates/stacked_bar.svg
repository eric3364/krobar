<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Inter, system-ui, sans-serif" data-template="stacked_bar">
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Clip the rounded bar so segments don't poke past the rounded corners -->
    <clipPath id="bar-clip">
      <rect x="40" y="240" width="510" height="120" rx="14"/>
    </clipPath>
  </defs>

  <rect width="800" height="600" fill="var(--bg)"/>

  <foreignObject x="20" y="20" width="760" height="50">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:clamp(18px,3cqw,26px);color:var(--text);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Répartition empilée</div>
  </foreignObject>

  <!--
    Bar: x=40, y=240, total width = 510, height = 120, rounded.
    Each segment is a <rect> clipped to bar-clip.
    Defaults: 25% each → width 127.5. JS recalcule x/width depuis percent_N.
  -->
  <g filter="url(#soft-shadow)" clip-path="url(#bar-clip)">
    <rect data-slot="seg_1" data-pct="25" x="40"    y="240" width="127.5" height="120" fill="var(--primary)"/>
    <rect data-slot="seg_2" data-pct="25" x="167.5" y="240" width="127.5" height="120" fill="var(--accent)"/>
    <rect data-slot="seg_3" data-pct="25" x="295"   y="240" width="127.5" height="120" fill="var(--primary)" fill-opacity="0.55"/>
    <rect data-slot="seg_4" data-pct="25" x="422.5" y="240" width="127.5" height="120" fill="var(--accent)"  fill-opacity="0.55"/>
  </g>
  <!-- Bar outline -->
  <rect x="40" y="240" width="510" height="120" rx="14" fill="none" stroke="var(--text)" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Percent labels centered on each segment.
       Repositioned by JS from actual percentages. -->
  <foreignObject data-slot-pos="segment_1_percent" x="63" y="285" width="82" height="32">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="segment_1_percent" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:14px;color:var(--bg);padding:4px;box-sizing:border-box;">25%</div>
  </foreignObject>
  <foreignObject data-slot-pos="segment_2_percent" x="190" y="285" width="82" height="32">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="segment_2_percent" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:14px;color:var(--bg);padding:4px;box-sizing:border-box;">25%</div>
  </foreignObject>
  <foreignObject data-slot-pos="segment_3_percent" x="318" y="285" width="82" height="32">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="segment_3_percent" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:14px;color:var(--bg);padding:4px;box-sizing:border-box;">25%</div>
  </foreignObject>
  <foreignObject data-slot-pos="segment_4_percent" x="445" y="285" width="82" height="32">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="segment_4_percent" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:14px;color:var(--bg);padding:4px;box-sizing:border-box;">25%</div>
  </foreignObject>

  <!-- Vertical legend on the right -->
  <g filter="url(#soft-shadow)">
    <rect x="590" y="120" width="190" height="360" rx="12" fill="var(--text)" opacity="0.05" stroke="var(--text)" stroke-opacity="0.15" stroke-width="1"/>
  </g>

  <rect x="610" y="155" width="22" height="22" rx="4" fill="var(--primary)"/>
  <foreignObject x="645" y="150" width="125" height="32">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="segment_1_label" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;text-align:left;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(11px,2.4cqw,14px);color:var(--text);padding:4px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Segment 1</div>
  </foreignObject>

  <rect x="610" y="235" width="22" height="22" rx="4" fill="var(--accent)"/>
  <foreignObject x="645" y="230" width="125" height="32">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="segment_2_label" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;text-align:left;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(11px,2.4cqw,14px);color:var(--text);padding:4px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Segment 2</div>
  </foreignObject>

  <rect x="610" y="315" width="22" height="22" rx="4" fill="var(--primary)" fill-opacity="0.55"/>
  <foreignObject x="645" y="310" width="125" height="32">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="segment_3_label" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;text-align:left;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(11px,2.4cqw,14px);color:var(--text);padding:4px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Segment 3</div>
  </foreignObject>

  <rect x="610" y="395" width="22" height="22" rx="4" fill="var(--accent)" fill-opacity="0.55"/>
  <foreignObject x="645" y="390" width="125" height="32">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="segment_4_label" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;text-align:left;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(11px,2.4cqw,14px);color:var(--text);padding:4px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Segment 4</div>
  </foreignObject>
</svg>
