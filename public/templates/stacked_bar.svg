<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="Plus Jakarta Sans, system-ui, sans-serif">
  <rect width="1040" height="600" fill="var(--bg)"/>
  <text x="105" y="72" font-size="13" font-weight="600" fill="var(--text)" opacity="0.55" style="text-transform: uppercase;">Barres Empilées</text>
  <foreignObject x="60" y="90" width="920" height="56">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="width:100%;height:100%;display:flex;align-items:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:36px;color:var(--text);box-sizing:border-box;">Répartition par trimestre</div>
  </foreignObject>
  
  <!-- Bar 1 -->
  <foreignObject x="100" y="200" width="180" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="bar_1_label" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Q1 2024</div>
  </foreignObject>
  <rect x="300" y="200" width="200" height="30" fill="var(--primary)" opacity="0.8"/>
  <rect x="500" y="200" width="150" height="30" fill="var(--accent)" opacity="0.8"/>
  <rect x="650" y="200" width="100" height="30" fill="var(--primary)" opacity="0.4"/>
  
  <!-- Bar 2 -->
  <foreignObject x="100" y="260" width="180" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="bar_2_label" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Q2 2024</div>
  </foreignObject>
  <rect x="300" y="260" width="180" height="30" fill="var(--primary)" opacity="0.8"/>
  <rect x="480" y="260" width="170" height="30" fill="var(--accent)" opacity="0.8"/>
  <rect x="650" y="260" width="120" height="30" fill="var(--primary)" opacity="0.4"/>
  
  <!-- Bar 3 -->
  <foreignObject x="100" y="320" width="180" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="bar_3_label" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Q3 2024</div>
  </foreignObject>
  <rect x="300" y="320" width="160" height="30" fill="var(--primary)" opacity="0.8"/>
  <rect x="460" y="320" width="190" height="30" fill="var(--accent)" opacity="0.8"/>
  <rect x="650" y="320" width="140" height="30" fill="var(--primary)" opacity="0.4"/>
  
  <!-- Legend -->
  <rect x="300" y="400" width="15" height="15" fill="var(--primary)" opacity="0.8"/>
  <foreignObject x="325" y="395" width="180" height="25">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="legend_1" style="width:100%;height:100%;display:flex;align-items:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:500;font-size:14px;color:var(--text);box-sizing:border-box;">Ventes</div>
  </foreignObject>
  
  <rect x="500" y="400" width="15" height="15" fill="var(--accent)" opacity="0.8"/>
  <foreignObject x="525" y="395" width="180" height="25">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="legend_2" style="width:100%;height:100%;display:flex;align-items:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:500;font-size:14px;color:var(--text);box-sizing:border-box;">Marketing</div>
  </foreignObject>
  
  <text x="60" y="580" font-size="11" font-weight="600" fill="var(--text)" opacity="0.5" style="text-transform: uppercase;">Krobar · Charts</text>
</svg>
