<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" font-family="Plus Jakarta Sans, system-ui, sans-serif">
  <rect width="800" height="800" fill="var(--bg)"/>
  <text x="105" y="72" font-size="13" font-weight="600" fill="var(--text)" opacity="0.55" style="text-transform: uppercase;">Cible de Priorisation</text>
  <foreignObject x="60" y="90" width="680" height="56">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="width:100%;height:100%;display:flex;align-items:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:36px;color:var(--text);box-sizing:border-box;">Niveaux d'impact et priorités</div>
  </foreignObject>

  <!-- Ring 4 (Outermost - Low priority) -->
  <circle cx="400" cy="400" r="180" fill="var(--accent)" fill-opacity="0.1" stroke="var(--accent)" stroke-width="3"/>
  <foreignObject x="220" y="520" width="180" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="ring_4_title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Impact Faible</div>
  </foreignObject>

  <!-- Ring 3 (Medium priority) -->
  <circle cx="400" cy="400" r="135" fill="var(--primary)" fill-opacity="0.15" stroke="var(--primary)" stroke-width="3"/>
  <foreignObject x="320" y="480" width="180" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="ring_3_title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Impact Modéré</div>
  </foreignObject>

  <!-- Ring 2 (High priority) -->
  <circle cx="400" cy="400" r="90" fill="var(--accent)" fill-opacity="0.2" stroke="var(--accent)" stroke-width="3"/>
  <foreignObject x="350" y="440" width="180" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="ring_2_title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Impact Élevé</div>
  </foreignObject>

  <!-- Ring 1 (Center - Critical) -->
  <circle cx="400" cy="400" r="45" fill="var(--primary)" fill-opacity="0.3" stroke="var(--primary)" stroke-width="4"/>
  <foreignObject x="320" y="385" width="180" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="ring_1_title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:18px;color:var(--primary);box-sizing:border-box;">Impact Critique</div>
  </foreignObject>

  <!-- Radial lines for sectors -->
  <line x1="400" y1="220" x2="400" y2="580" stroke="var(--text)" stroke-width="1" opacity="0.3"/>
  <line x1="220" y1="400" x2="580" y2="400" stroke="var(--text)" stroke-width="1" opacity="0.3"/>
  <line x1="290" y1="290" x2="510" y2="510" stroke="var(--text)" stroke-width="1" opacity="0.3"/>
  <line x1="290" y1="510" x2="510" y2="290" stroke="var(--text)" stroke-width="1" opacity="0.3"/>

  <!-- Icons in different sectors (optional visual elements) -->
  <g transform="translate(350, 250)">
    <circle cx="0" cy="0" r="8" fill="var(--primary)" opacity="0.8"/>
    <text x="0" y="4" font-size="12" font-weight="700" fill="var(--bg)" text-anchor="middle">1</text>
  </g>

  <g transform="translate(450, 250)">
    <circle cx="0" cy="0" r="8" fill="var(--accent)" opacity="0.8"/>
    <text x="0" y="4" font-size="12" font-weight="700" fill="var(--bg)" text-anchor="middle">2</text>
  </g>

  <g transform="translate(450, 350)">
    <circle cx="0" cy="0" r="8" fill="var(--primary)" opacity="0.8"/>
    <text x="0" y="4" font-size="12" font-weight="700" fill="var(--bg)" text-anchor="middle">3</text>
  </g>

  <g transform="translate(350, 350)">
    <circle cx="0" cy="0" r="8" fill="var(--accent)" opacity="0.8"/>
    <text x="0" y="4" font-size="12" font-weight="700" fill="var(--bg)" text-anchor="middle">4</text>
  </g>

  <!-- Legend on the side -->
  <rect x="620" y="300" width="15" height="15" fill="var(--primary)" opacity="0.3"/>
  <foreignObject x="640" y="290" width="120" height="25">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="legend_high" style="width:100%;height:100%;display:flex;align-items:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:500;font-size:14px;color:var(--text);box-sizing:border-box;">Priorité haute</div>
  </foreignObject>

  <rect x="620" y="330" width="15" height="15" fill="var(--accent)" opacity="0.2"/>
  <foreignObject x="640" y="320" width="120" height="25">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="legend_medium" style="width:100%;height:100%;display:flex;align-items:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:500;font-size:14px;color:var(--text);box-sizing:border-box;">Priorité moyenne</div>
  </foreignObject>

  <text x="60" y="780" font-size="11" font-weight="600" fill="var(--text)" opacity="0.5" style="text-transform: uppercase;">Krobar · Prioritization</text>
</svg>
