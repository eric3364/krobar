<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="Plus Jakarta Sans, system-ui, sans-serif">

  <!-- Définitions -->
  <defs>
    <!-- Dégradé essentiel : faisceau lumineux principal -->
    <linearGradient id="beamGradient" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:var(--accent);stop-opacity:0.55"/>
      <stop offset="50%" style="stop-color:var(--accent);stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:var(--accent);stop-opacity:0.05"/>
    </linearGradient>
    <!-- Dégradé essentiel : fût du phare (volume) -->
    <linearGradient id="towerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:var(--bg);stop-opacity:1"/>
      <stop offset="40%" style="stop-color:var(--primary);stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:var(--primary);stop-opacity:0.25"/>
    </linearGradient>
    <!-- Dégradé décoratif : ciel (mode magazine) -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:var(--bg);stop-opacity:1"/>
      <stop offset="100%" style="stop-color:var(--accent);stop-opacity:0.1"/>
    </linearGradient>
    <!-- Dégradé décoratif : mer (mode magazine) -->
    <linearGradient id="seaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:var(--accent);stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:var(--primary);stop-opacity:0.3"/>
    </linearGradient>
    <!-- Dégradé décoratif : halo lumineux -->
    <radialGradient id="haloGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:var(--accent);stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:var(--accent);stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Fond blanc essentiel -->
  <rect width="1040" height="600" fill="var(--bg)"/>

  <!-- DÉCORATIF : ciel + mer dégradés (mode magazine) -->
  <rect width="1040" height="430" fill="url(#skyGradient)" opacity="var(--decoration-opacity, 0)" id="title">
  <rect y="430" width="1040" height="170" fill="url(#seaGradient)" opacity="var(--decoration-opacity, 0)"/>

  <!-- Header label (essentiel) -->
  <text x="300" y="72" font-size="13" font-weight="600" fill="var(--text)" opacity="0.55"
        style="text-transform: uppercase; letter-spacing: 0.5px;">Phare Directeur</text>

  <!-- Titre principal (essentiel) -->
  <foreignObject x="300" y="90" width="680" height="56" data-shape="title">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title"
         style="width:100%;height:100%;display:flex;align-items:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:36px;color:var(--text);box-sizing:border-box;">
      Vision claire vers l'objectif
    </div>
  </foreignObject>

  <!-- ============================================ -->
  <!-- FAISCEAU LUMINEUX (essentiel) -->
  <!-- ============================================ -->
  <!-- Cône principal du faisceau, émane de la lampe (170, 165) -->
  <path d="M 195 158 L 990 250 L 990 320 L 195 172 Z"
        fill="url(#beamGradient)"/>

  <!-- DÉCORATIF : faisceau secondaire (deuxième cône, plus large, mode magazine) -->
  <path d="M 195 158 L 990 200 L 990 370 L 195 175 Z"
        fill="url(#beamGradient)"
        opacity="calc(var(--decoration-opacity, 0) * 0.35)"/>

  <!-- DÉCORATIF : halo radial autour de la lampe -->
  <circle cx="170" cy="165" r="40" fill="url(#haloGradient)"
          opacity="var(--decoration-opacity, 0)"/>

  <!-- ============================================ -->
  <!-- BASE ROCHEUSE (essentielle) -->
  <!-- ============================================ -->
  <!-- Forme irrégulière, anguleuse (pas ovoïde) -->
  <path d="M 90 470
           L 110 455
           L 130 462
           L 145 448
           L 165 458
           L 180 445
           L 200 455
           L 220 460
           L 240 450
           L 255 462
           L 270 470
           L 270 490
           L 90 490 Z"
        fill="var(--text)" fill-opacity="0.25"
        stroke="var(--text)" stroke-width="1.5" stroke-opacity="0.4"
        stroke-linejoin="round"/>

  <!-- DÉCORATIF : ombre interne sur la base rocheuse -->
  <path d="M 200 455 L 220 460 L 240 450 L 255 462 L 270 470 L 270 490 L 200 490 Z"
        fill="var(--text)" fill-opacity="0.1"
        opacity="var(--decoration-opacity, 0)"/>

  <!-- ============================================ -->
  <!-- FÛT DU PHARE (essentiel) -->
  <!-- ============================================ -->
  <!-- Fût principal : trapézoïdal (plus large en bas qu'en haut) -->
  <path d="M 145 470 L 145 200 L 195 200 L 195 470 Z"
        fill="url(#towerGradient)"
        stroke="var(--primary)" stroke-width="2.5"
        stroke-linejoin="round"/>

  <!-- ESSENTIEL : bandes rayées alternées (caractère phare !) -->
  <rect x="145" y="220" width="50" height="35" fill="var(--primary)" fill-opacity="0.85"/>
  <rect x="145" y="290" width="50" height="35" fill="var(--primary)" fill-opacity="0.85"/>
  <rect x="145" y="360" width="50" height="35" fill="var(--primary)" fill-opacity="0.85"/>
  <rect x="145" y="430" width="50" height="35" fill="var(--primary)" fill-opacity="0.85"/>

  <!-- ESSENTIEL : porte d'entrée à la base du phare -->
  <rect x="160" y="442" width="20" height="28" rx="2"
        fill="var(--text)" fill-opacity="0.5"/>

  <!-- DÉCORATIF : reflets verticaux sur le fût (effet lumière) -->
  <line x1="155" y1="200" x2="155" y2="470" stroke="var(--bg)" stroke-width="3"
        opacity="calc(var(--decoration-opacity, 0) * 0.4)"/>

  <!-- ============================================ -->
  <!-- GALERIE INFÉRIEURE (essentielle) -->
  <!-- ============================================ -->
  <!-- Disque saillant qui dépasse du fût -->
  <rect x="135" y="190" width="70" height="14" rx="2"
        fill="var(--primary)" fill-opacity="0.7"
        stroke="var(--primary)" stroke-width="1.5"/>

  <!-- ============================================ -->
  <!-- LANTERNE (cabine vitrée avec lampe) (essentielle) -->
  <!-- ============================================ -->
  <!-- Cabine carrée -->
  <rect x="148" y="148" width="44" height="44" rx="3"
        fill="var(--accent)" fill-opacity="0.18"
        stroke="var(--primary)" stroke-width="2"/>

  <!-- Croisillons des vitres -->
  <line x1="170" y1="150" x2="170" y2="190" stroke="var(--primary)" stroke-width="1" opacity="0.5"/>
  <line x1="150" y1="170" x2="190" y2="170" stroke="var(--primary)" stroke-width="1" opacity="0.5"/>

  <!-- Lampe centrale (point lumineux) -->
  <circle cx="170" cy="165" r="8" fill="var(--accent)" stroke="var(--primary)" stroke-width="1.5"/>
  <circle cx="170" cy="165" r="4" fill="var(--bg)"/>

  <!-- ============================================ -->
  <!-- GALERIE SUPÉRIEURE (essentielle) -->
  <!-- ============================================ -->
  <rect x="143" y="138" width="54" height="10" rx="2"
        fill="var(--primary)" fill-opacity="0.7"
        stroke="var(--primary)" stroke-width="1.5"/>

  <!-- ============================================ -->
  <!-- DÔME CONIQUE (essentiel) -->
  <!-- ============================================ -->
  <path d="M 148 138 L 170 110 L 192 138 Z"
        fill="var(--primary)" fill-opacity="0.85"
        stroke="var(--primary)" stroke-width="1.5"/>

  <!-- DÉCORATIF : reflet sur le dôme -->
  <path d="M 158 132 L 170 115 L 168 132 Z"
        fill="var(--bg)"
        opacity="calc(var(--decoration-opacity, 0) * 0.5)"/>

  <!-- ============================================ -->
  <!-- GIROUETTE / FLÈCHE AU SOMMET (essentielle) -->
  <!-- ============================================ -->
  <line x1="170" y1="110" x2="170" y2="92" stroke="var(--primary)" stroke-width="2"/>
  <path d="M 170 92 L 178 96 L 170 100 Z" fill="var(--primary)"/>

  <!-- ============================================ -->
  <!-- DÉCORATIF : VAGUES (mode magazine) -->
  <!-- ============================================ -->
  <g opacity="var(--decoration-opacity, 0)">
    <path d="M 90 510 Q 130 506 170 510 Q 210 514 250 510 Q 290 506 330 510"
          stroke="var(--accent)" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M 90 522 Q 130 518 170 522 Q 210 526 250 522 Q 290 518 330 522"
          stroke="var(--accent)" stroke-width="1.5" fill="none" opacity="0.35"/>
  </g>

  <!-- ============================================ -->
  <!-- BOX OBJECTIF PRINCIPAL (essentielle) -->
  <!-- ============================================ -->
  <rect x="700" y="220" width="280" height="130" rx="12"
        fill="var(--bg)" stroke="var(--accent)" stroke-width="2.5" id="main_target">

  <!-- Petite indication "OBJECTIF" en label -->
  <text x="715" y="245" font-size="11" font-weight="600" fill="var(--accent)" opacity="0.7"
        style="text-transform: uppercase; letter-spacing: 0.5px;">Cap principal</text>

  <foreignObject x="700" y="252" width="280" height="48" data-shape="main_target">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="main_target"
         style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:20px;color:var(--accent);box-sizing:border-box;padding:8px;line-height:1.3;">
      Objectif principal
    </div>
  </foreignObject>

  <foreignObject x="710" y="300" width="260" height="48" data-shape="main_target">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="target_description"
         style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:400;font-size:13px;color:var(--text);box-sizing:border-box;padding:6px;line-height:1.4;">
      Description du cap stratégique à atteindre
    </div>
  </foreignObject>

  <!-- ============================================ -->
  <!-- BOXES DES 3 PHASES (essentielles) -->
  <!-- ============================================ -->

  <!-- Phase 1 : Préparation -->
  <rect x="320" y="475" width="200" height="58" rx="12"
        fill="var(--bg)" stroke="var(--primary)" stroke-width="2" id="prep_phase">
  <circle cx="345" cy="504" r="14" fill="var(--primary)" fill-opacity="0.15"
          stroke="var(--primary)" stroke-width="1.5"/>
  <text x="345" y="509" font-size="13" font-weight="700" fill="var(--primary)" text-anchor="middle">1</text>
  <foreignObject x="365" y="479" width="150" height="50" data-shape="prep_phase">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="prep_phase"
         style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:14px;color:var(--text);box-sizing:border-box;padding:6px;line-height:1.3;">
      Préparation
    </div>
  </foreignObject>

  <!-- Phase 2 : Passage -->
  <rect x="540" y="475" width="200" height="58" rx="12"
        fill="var(--bg)" stroke="var(--accent)" stroke-width="2" id="passage_phase">
  <circle cx="565" cy="504" r="14" fill="var(--accent)" fill-opacity="0.15"
          stroke="var(--accent)" stroke-width="1.5"/>
  <text x="565" y="509" font-size="13" font-weight="700" fill="var(--accent)" text-anchor="middle">2</text>
  <foreignObject x="585" y="479" width="150" height="50" data-shape="passage_phase">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="passage_phase"
         style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:14px;color:var(--text);box-sizing:border-box;padding:6px;line-height:1.3;">
      Passage
    </div>
  </foreignObject>

  <!-- Phase 3 : Arrivée -->
  <rect x="760" y="475" width="200" height="58" rx="12"
        fill="var(--bg)" stroke="var(--primary)" stroke-width="2" id="arrival_phase">
  <circle cx="785" cy="504" r="14" fill="var(--primary)" fill-opacity="0.15"
          stroke="var(--primary)" stroke-width="1.5"/>
  <text x="785" y="509" font-size="13" font-weight="700" fill="var(--primary)" text-anchor="middle">3</text>
  <foreignObject x="805" y="479" width="150" height="50" data-shape="arrival_phase">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="arrival_phase"
         style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:14px;color:var(--text);box-sizing:border-box;padding:6px;line-height:1.3;">
      Arrivée
    </div>
  </foreignObject>

  <!-- Footer (essentiel) -->
  <text x="60" y="585" font-size="11" font-weight="600" fill="var(--text)" opacity="0.5"
        style="text-transform: uppercase; letter-spacing: 0.5px;">
    Krobar · Vision
  </text>

</svg>
