<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
  <style>
    .label-strong { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: 600; }
    .label { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 13px; font-weight: 500; }
    .gloss { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 11px; font-weight: 400; font-style: italic; fill: var(--muted); }
    .gloss-strong { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 11px; font-weight: 500; }
    .caption { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 10px; font-weight: 400; font-style: italic; fill: var(--muted); }
    .axis { stroke: var(--border); stroke-width: 0.6; fill: none; }
  </style>

  <defs>
    <pattern id="hatcha10" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="var(--tertiary)" stroke-width="0.6" opacity="0.5"/>
    </pattern>
  </defs>
  <rect x="220" y="140" width="240" height="120" fill="var(--bg)" stroke="var(--muted)" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="340" y="195" class="label-strong" text-anchor="middle" dominant-baseline="central" fill="var(--muted)" font-style="italic">{{void_label}}</text>
  <text x="340" y="218" class="gloss" text-anchor="middle" dominant-baseline="central">{{void_subtitle}}</text>
  <rect x="40" y="60" width="160" height="55" fill="url(#hatcha10)" stroke="var(--tertiary)" stroke-width="0.8" stroke-dasharray="2 3"/>
  <text x="120" y="83" class="gloss-strong" text-anchor="middle" dominant-baseline="central" fill="var(--tertiary)">{{exclusion_1}}</text>
  <text x="120" y="100" class="gloss" text-anchor="middle" dominant-baseline="central">{{exclusion_1_gloss}}</text>
  <rect x="480" y="60" width="160" height="55" fill="url(#hatcha10)" stroke="var(--tertiary)" stroke-width="0.8" stroke-dasharray="2 3"/>
  <text x="560" y="83" class="gloss-strong" text-anchor="middle" dominant-baseline="central" fill="var(--tertiary)">{{exclusion_2}}</text>
  <text x="560" y="100" class="gloss" text-anchor="middle" dominant-baseline="central">{{exclusion_2_gloss}}</text>
  <rect x="40" y="285" width="160" height="55" fill="url(#hatcha10)" stroke="var(--tertiary)" stroke-width="0.8" stroke-dasharray="2 3"/>
  <text x="120" y="308" class="gloss-strong" text-anchor="middle" dominant-baseline="central" fill="var(--tertiary)">{{exclusion_3}}</text>
  <text x="120" y="325" class="gloss" text-anchor="middle" dominant-baseline="central">{{exclusion_3_gloss}}</text>
  <rect x="480" y="285" width="160" height="55" fill="url(#hatcha10)" stroke="var(--tertiary)" stroke-width="0.8" stroke-dasharray="2 3"/>
  <text x="560" y="308" class="gloss-strong" text-anchor="middle" dominant-baseline="central" fill="var(--tertiary)">{{exclusion_4}}</text>
  <text x="560" y="325" class="gloss" text-anchor="middle" dominant-baseline="central">{{exclusion_4_gloss}}</text>
  <text x="40" y="375" class="caption">{{caption}}</text>
</svg>