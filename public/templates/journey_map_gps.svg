<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Plus Jakarta Sans, system-ui, sans-serif">
  <defs>
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="var(--bg)"/>
  <text x="105" y="72" font-size="13" font-weight="600" fill="var(--text)" opacity="0.55" style="text-transform: uppercase;">Journey Map GPS</text>
  <foreignObject x="60" y="90" width="1080" height="56">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="width:100%;height:100%;display:flex;align-items:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:36px;color:var(--text);box-sizing:border-box;">Parcours utilisateur avec points de repère</div>
  </foreignObject>

  <!-- Circular journey area -->
  <circle cx="600" cy="400" r="280" fill="var(--primary)" fill-opacity="0.05" stroke="var(--primary)" stroke-width="2" stroke-dasharray="10,5"/>

  <!-- GPS Point 1 - Start -->
  <g transform="translate(400, 250)">
    <circle cx="0" cy="0" r="20" fill="var(--primary)" filter="url(#dropShadow)"/>
    <circle cx="0" cy="0" r="12" fill="var(--bg)"/>
    <text x="0" y="4" font-size="12" font-weight="700" fill="var(--primary)" text-anchor="middle">1</text>
  </g>
  <line x1="400" y1="280" x2="400" y2="320" stroke="var(--primary)" stroke-width="2"/>
  <foreignObject x="320" y="330" width="180" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="point_1" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Découverte produit</div>
  </foreignObject>

  <!-- GPS Point 2 -->
  <g transform="translate(720, 200)">
    <circle cx="0" cy="0" r="20" fill="var(--accent)" filter="url(#dropShadow)"/>
    <circle cx="0" cy="0" r="12" fill="var(--bg)"/>
    <text x="0" y="4" font-size="12" font-weight="700" fill="var(--accent)" text-anchor="middle">2</text>
  </g>
  <line x1="720" y1="230" x2="720" y2="270" stroke="var(--accent)" stroke-width="2"/>
  <foreignObject x="640" y="280" width="180" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="point_2" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Recherche d'infos</div>
  </foreignObject>

  <!-- GPS Point 3 -->
  <g transform="translate(850, 400)">
    <circle cx="0" cy="0" r="20" fill="var(--primary)" filter="url(#dropShadow)"/>
    <circle cx="0" cy="0" r="12" fill="var(--bg)"/>
    <text x="0" y="4" font-size="12" font-weight="700" fill="var(--primary)" text-anchor="middle">3</text>
  </g>
  <line x1="880" y1="400" x2="920" y2="400" stroke="var(--primary)" stroke-width="2"/>
  <foreignObject x="930" y="385" width="180" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="point_3" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Comparaison</div>
  </foreignObject>

  <!-- GPS Point 4 -->
  <g transform="translate(750, 580)">
    <circle cx="0" cy="0" r="20" fill="var(--accent)" filter="url(#dropShadow)"/>
    <circle cx="0" cy="0" r="12" fill="var(--bg)"/>
    <text x="0" y="4" font-size="12" font-weight="700" fill="var(--accent)" text-anchor="middle">4</text>
  </g>
  <line x1="750" y1="610" x2="750" y2="650" stroke="var(--accent)" stroke-width="2"/>
  <foreignObject x="670" y="660" width="180" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="point_4" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Décision d'achat</div>
  </foreignObject>

  <!-- GPS Point 5 -->
  <g transform="translate(450, 600)">
    <circle cx="0" cy="0" r="20" fill="var(--primary)" filter="url(#dropShadow)"/>
    <circle cx="0" cy="0" r="12" fill="var(--bg)"/>
    <text x="0" y="4" font-size="12" font-weight="700" fill="var(--primary)" text-anchor="middle">5</text>
  </g>
  <line x1="450" y1="630" x2="450" y2="670" stroke="var(--primary)" stroke-width="2"/>
  <foreignObject x="370" y="680" width="180" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="point_5" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Utilisation</div>
  </foreignObject>

  <!-- GPS Point 6 - End -->
  <g transform="translate(350, 450)">
    <circle cx="0" cy="0" r="20" fill="var(--accent)" filter="url(#dropShadow)"/>
    <circle cx="0" cy="0" r="12" fill="var(--bg)"/>
    <text x="0" y="4" font-size="12" font-weight="700" fill="var(--accent)" text-anchor="middle">6</text>
  </g>
  <line x1="320" y1="450" x2="280" y2="450" stroke="var(--accent)" stroke-width="2"/>
  <foreignObject x="100" y="435" width="180" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="point_6" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-end;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Recommandation</div>
  </foreignObject>

  <!-- Journey path (dotted lines) -->
  <path d="M 420 260 Q 500 180 720 210" stroke="var(--accent)" stroke-width="2" stroke-dasharray="8,4" fill="none" opacity="0.7"/>
  <path d="M 740 220 Q 800 280 840 380" stroke="var(--accent)" stroke-width="2" stroke-dasharray="8,4" fill="none" opacity="0.7"/>
  <path d="M 840 420 Q 820 500 760 560" stroke="var(--accent)" stroke-width="2" stroke-dasharray="8,4" fill="none" opacity="0.7"/>
  <path d="M 730 590 Q 650 620 470 610" stroke="var(--accent)" stroke-width="2" stroke-dasharray="8,4" fill="none" opacity="0.7"/>
  <path d="M 430 590 Q 380 550 360 470" stroke="var(--accent)" stroke-width="2" stroke-dasharray="8,4" fill="none" opacity="0.7"/>

  <text x="60" y="780" font-size="11" font-weight="600" fill="var(--text)" opacity="0.5" style="text-transform: uppercase;">Krobar · Journey</text>
</svg>
