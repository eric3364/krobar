<svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
  <style>
    .label-strong { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: 600; }
    .label { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 13px; font-weight: 500; }
    .gloss { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 11px; font-weight: 400; font-style: italic; fill: var(--muted); }
    .gloss-strong { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 11px; font-weight: 500; }
    .caption { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 10px; font-weight: 400; font-style: italic; fill: var(--muted); }
    .axis { stroke: var(--border); stroke-width: 0.6; fill: none; }
  </style>

  <ellipse cx="340" cy="80" rx="135" ry="38" fill="none" stroke="var(--muted)" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="340" y="74" class="gloss" text-anchor="middle">{{link_label}}</text>
  <text x="340" y="92" class="gloss" text-anchor="middle">{{link_subtitle}}</text>
  <line x1="340" y1="118" x2="340" y2="160" stroke="var(--muted)" stroke-width="0.8" stroke-dasharray="2 3"/>
  <line x1="265" y1="190" x2="415" y2="190" stroke="var(--text)" stroke-width="2"/>
  <circle cx="200" cy="190" r="60" fill="var(--bg)" stroke="var(--primary)" stroke-width="2"/>
  <text x="200" y="186" class="label-strong" text-anchor="middle" dominant-baseline="central" fill="var(--primary)">{{node_left}}</text>
  <text x="200" y="206" class="gloss-strong" text-anchor="middle" dominant-baseline="central" fill="var(--primary)">{{node_left_gloss}}</text>
  <circle cx="480" cy="190" r="60" fill="var(--bg)" stroke="var(--primary)" stroke-width="2"/>
  <text x="480" y="186" class="label-strong" text-anchor="middle" dominant-baseline="central" fill="var(--primary)">{{node_right}}</text>
  <text x="480" y="206" class="gloss-strong" text-anchor="middle" dominant-baseline="central" fill="var(--primary)">{{node_right_gloss}}</text>
  <text x="340" y="285" class="gloss" text-anchor="middle" style="font-size:12px;">{{caption}}</text>
</svg>