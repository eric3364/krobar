<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Inter, system-ui, sans-serif">
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)"/>
    </marker>
  </defs>

  <rect width="800" height="600" fill="var(--bg)"/>

  <foreignObject x="20" y="40" width="760" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:clamp(20px,3.4cqw,30px);color:var(--text);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Titre du processus</div>
  </foreignObject>

  <!-- 5 cards: x = 20, 175, 330, 485, 640; width 140; gap 15 -->
  <g filter="url(#soft-shadow)">
    <rect x="20"  y="270" width="140" height="180" rx="12" fill="var(--primary)"/>
    <rect x="175" y="270" width="140" height="180" rx="12" fill="var(--primary)"/>
    <rect x="330" y="270" width="140" height="180" rx="12" fill="var(--primary)"/>
    <rect x="485" y="270" width="140" height="180" rx="12" fill="var(--primary)"/>
    <rect x="640" y="270" width="140" height="180" rx="12" fill="var(--primary)"/>
  </g>

  <!-- Connecting arrows between cards (gap 15px) -->
  <path d="M 162 360 L 173 360" stroke="var(--accent)" stroke-width="3" fill="none" marker-end="url(#arrow5)"/>
  <path d="M 317 360 L 328 360" stroke="var(--accent)" stroke-width="3" fill="none" marker-end="url(#arrow5)"/>
  <path d="M 472 360 L 483 360" stroke="var(--accent)" stroke-width="3" fill="none" marker-end="url(#arrow5)"/>
  <path d="M 627 360 L 638 360" stroke="var(--accent)" stroke-width="3" fill="none" marker-end="url(#arrow5)"/>

  <!-- Numbered accent circles centered above each card -->
  <g filter="url(#soft-shadow)">
    <circle cx="90"  cy="240" r="26" fill="var(--accent)"/>
    <circle cx="245" cy="240" r="26" fill="var(--accent)"/>
    <circle cx="400" cy="240" r="26" fill="var(--accent)"/>
    <circle cx="555" cy="240" r="26" fill="var(--accent)"/>
    <circle cx="710" cy="240" r="26" fill="var(--accent)"/>
  </g>
  <g font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="18" fill="var(--bg)" text-anchor="middle">
    <text x="90"  y="247">1</text>
    <text x="245" y="247">2</text>
    <text x="400" y="247">3</text>
    <text x="555" y="247">4</text>
    <text x="710" y="247">5</text>
  </g>

  <!-- Step text slots -->
  <foreignObject x="20"  y="290" width="140" height="160">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="step_1" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(11px,1.4cqw,16px);color:var(--bg);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Étape 1</div>
  </foreignObject>
  <foreignObject x="175" y="290" width="140" height="160">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="step_2" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(11px,1.4cqw,16px);color:var(--bg);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Étape 2</div>
  </foreignObject>
  <foreignObject x="330" y="290" width="140" height="160">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="step_3" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(11px,1.4cqw,16px);color:var(--bg);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Étape 3</div>
  </foreignObject>
  <foreignObject x="485" y="290" width="140" height="160">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="step_4" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(11px,1.4cqw,16px);color:var(--bg);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Étape 4</div>
  </foreignObject>
  <foreignObject x="640" y="290" width="140" height="160">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="step_5" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(11px,1.4cqw,16px);color:var(--bg);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Étape 5</div>
  </foreignObject>
</svg>
