<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="Plus Jakarta Sans, system-ui, sans-serif">

  <!-- Définitions -->
  <defs>
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:var(--primary);stop-opacity:0"/>
      <stop offset="50%" style="stop-color:var(--primary);stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:var(--primary);stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Fond blanc essentiel -->
  <rect width="1040" height="600" fill="var(--bg)"/>

  <!-- Header label -->
  <text x="60" y="72" font-size="13" font-weight="600" fill="var(--text)" opacity="0.55"
        style="text-transform: uppercase; letter-spacing: 0.5px;">Processus 5 Étapes</text>

  <!-- Titre principal -->
  <foreignObject x="60" y="90" width="920" height="56">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title"
         style="width:100%;height:100%;display:flex;align-items:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:36px;color:var(--text);box-sizing:border-box;">
      Processus complet de développement
    </div>
  </foreignObject>

  <!-- ============================================ -->
  <!-- DÉCORATIF : filets horizontaux (mode magazine) -->
  <!-- ============================================ -->
  <line x1="60" y1="200" x2="980" y2="200" stroke="url(#lineGradient)" stroke-width="1"
        opacity="var(--decoration-opacity, 0)"/>
  <line x1="60" y1="490" x2="980" y2="490" stroke="url(#lineGradient)" stroke-width="1"
        opacity="var(--decoration-opacity, 0)"/>

  <!-- DÉCORATIF : fond très léger sous toute la zone des étapes -->
  <rect x="40" y="240" width="960" height="220" rx="20"
        fill="var(--accent)" fill-opacity="0.04"
        opacity="var(--decoration-opacity, 0)"/>

  <!-- ============================================ -->
  <!-- ÉTAPE 1 — Analyse — colonne centrée à x=143 -->
  <!-- ============================================ -->
  <text x="143" y="335" font-size="80" font-weight="800" fill="var(--primary)" fill-opacity="0.85"
        text-anchor="middle">1</text>
  <rect x="61" y="340" width="165" height="80" rx="8"
        fill="var(--bg)"
        stroke="var(--primary)" stroke-width="2"/>
  <rect x="61" y="340" width="4" height="80"
        fill="var(--primary)"/>
  <foreignObject x="65" y="340" width="161" height="80">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="step_1_title"
         style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:15px;color:var(--text);box-sizing:border-box;padding:8px;line-height:1.3;">
      Analyse
    </div>
  </foreignObject>

  <line x1="232" y1="380" x2="248" y2="380" stroke="var(--text)" stroke-width="1.5" opacity="0.4"/>
  <path d="M 248 375 L 256 380 L 248 385 Z" fill="var(--text)" opacity="0.5"/>

  <!-- ============================================ -->
  <!-- ÉTAPE 2 — Design — colonne centrée à x=332 -->
  <!-- ============================================ -->
  <text x="332" y="335" font-size="80" font-weight="800" fill="var(--accent)" fill-opacity="0.85"
        text-anchor="middle">2</text>
  <rect x="250" y="340" width="165" height="80" rx="8"
        fill="var(--bg)"
        stroke="var(--accent)" stroke-width="2"/>
  <rect x="250" y="340" width="4" height="80"
        fill="var(--accent)"/>
  <foreignObject x="254" y="340" width="161" height="80">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="step_2_title"
         style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:15px;color:var(--text);box-sizing:border-box;padding:8px;line-height:1.3;">
      Design
    </div>
  </foreignObject>

  <line x1="421" y1="380" x2="437" y2="380" stroke="var(--text)" stroke-width="1.5" opacity="0.4"/>
  <path d="M 437 375 L 445 380 L 437 385 Z" fill="var(--text)" opacity="0.5"/>

  <!-- ============================================ -->
  <!-- ÉTAPE 3 — Développement — colonne centrée à x=521 -->
  <!-- ============================================ -->
  <text x="521" y="335" font-size="80" font-weight="800" fill="var(--primary)" fill-opacity="0.85"
        text-anchor="middle">3</text>
  <rect x="439" y="340" width="165" height="80" rx="8"
        fill="var(--bg)"
        stroke="var(--primary)" stroke-width="2"/>
  <rect x="439" y="340" width="4" height="80"
        fill="var(--primary)"/>
  <foreignObject x="443" y="340" width="161" height="80">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="step_3_title"
         style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:15px;color:var(--text);box-sizing:border-box;padding:8px;line-height:1.3;">
      Développement
    </div>
  </foreignObject>

  <line x1="610" y1="380" x2="626" y2="380" stroke="var(--text)" stroke-width="1.5" opacity="0.4"/>
  <path d="M 626 375 L 634 380 L 626 385 Z" fill="var(--text)" opacity="0.5"/>

  <!-- ============================================ -->
  <!-- ÉTAPE 4 — Tests — colonne centrée à x=710 -->
  <!-- ============================================ -->
  <text x="710" y="335" font-size="80" font-weight="800" fill="var(--accent)" fill-opacity="0.85"
        text-anchor="middle">4</text>
  <rect x="628" y="340" width="165" height="80" rx="8"
        fill="var(--bg)"
        stroke="var(--accent)" stroke-width="2"/>
  <rect x="628" y="340" width="4" height="80"
        fill="var(--accent)"/>
  <foreignObject x="632" y="340" width="161" height="80">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="step_4_title"
         style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:15px;color:var(--text);box-sizing:border-box;padding:8px;line-height:1.3;">
      Tests
    </div>
  </foreignObject>

  <line x1="799" y1="380" x2="815" y2="380" stroke="var(--text)" stroke-width="1.5" opacity="0.4"/>
  <path d="M 815 375 L 823 380 L 815 385 Z" fill="var(--text)" opacity="0.5"/>

  <!-- ============================================ -->
  <!-- ÉTAPE 5 — Déploiement — colonne centrée à x=897 (mise en valeur) -->
  <!-- ============================================ -->
  <text x="897" y="335" font-size="80" font-weight="800" fill="var(--accent)"
        text-anchor="middle">5</text>
  <rect x="815" y="340" width="165" height="80" rx="8"
        fill="var(--accent)" fill-opacity="0.1"
        stroke="var(--accent)" stroke-width="2.5"/>
  <rect x="815" y="340" width="4" height="80"
        fill="var(--accent)"/>
  <foreignObject x="819" y="340" width="161" height="80">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="step_5_title"
         style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:15px;color:var(--accent);box-sizing:border-box;padding:8px;line-height:1.3;">
      Déploiement
    </div>
  </foreignObject>

  <!-- Footer -->
  <text x="60" y="585" font-size="11" font-weight="600" fill="var(--text)" opacity="0.5"
        style="text-transform: uppercase; letter-spacing: 0.5px;">
    Krobar · Processus
  </text>

</svg>
