<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="Plus Jakarta Sans, system-ui, sans-serif">
  <rect width="1040" height="600" fill="var(--bg)"/>
  <text x="105" y="72" font-size="13" font-weight="600" fill="var(--text)" opacity="0.55" style="text-transform: uppercase;">Organigramme</text>
  <foreignObject x="60" y="90" width="920" height="56">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="width:100%;height:100%;display:flex;align-items:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:36px;color:var(--text);box-sizing:border-box;">Structure organisationnelle</div>
  </foreignObject>
  
  <!-- CEO Level -->
  <rect x="420" y="180" width="200" height="60" rx="8" fill="var(--primary)" fill-opacity="0.1" stroke="var(--primary)" stroke-width="2"/>
  <foreignObject x="430" y="195" width="180" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="ceo_title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Directeur Général</div>
  </foreignObject>
  
  <!-- Vertical line down -->
  <line x1="520" y1="240" x2="520" y2="280" stroke="var(--accent)" stroke-width="2"/>
  <!-- Horizontal connector -->
  <line x1="320" y1="280" x2="720" y2="280" stroke="var(--accent)" stroke-width="2"/>
  
  <!-- Department 1 -->
  <line x1="320" y1="280" x2="320" y2="300" stroke="var(--accent)" stroke-width="2"/>
  <rect x="220" y="300" width="200" height="60" rx="8" fill="var(--accent)" fill-opacity="0.1" stroke="var(--accent)" stroke-width="2"/>
  <foreignObject x="230" y="315" width="180" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="dept_1_title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Développement</div>
  </foreignObject>
  
  <!-- Department 2 -->
  <line x1="520" y1="280" x2="520" y2="300" stroke="var(--accent)" stroke-width="2"/>
  <rect x="420" y="300" width="200" height="60" rx="8" fill="var(--accent)" fill-opacity="0.1" stroke="var(--accent)" stroke-width="2"/>
  <foreignObject x="430" y="315" width="180" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="dept_2_title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Marketing</div>
  </foreignObject>
  
  <!-- Department 3 -->
  <line x1="720" y1="280" x2="720" y2="300" stroke="var(--accent)" stroke-width="2"/>
  <rect x="620" y="300" width="200" height="60" rx="8" fill="var(--accent)" fill-opacity="0.1" stroke="var(--accent)" stroke-width="2"/>
  <foreignObject x="630" y="315" width="180" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="dept_3_title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Opérations</div>
  </foreignObject>
  
  <text x="60" y="580" font-size="11" font-weight="600" fill="var(--text)" opacity="0.5" style="text-transform: uppercase;">Krobar · Structure</text>
</svg>
