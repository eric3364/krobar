<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Inter, system-ui, sans-serif">
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="var(--bg)"/>

  <foreignObject x="20" y="30" width="760" height="60">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:clamp(18px,3.2cqw,28px);color:var(--text);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Organigramme</div>
  </foreignObject>

  <!-- Connection lines (drawn first, behind cards) -->
  <!-- vertical from root center to mid bus -->
  <path d="M 400 250 L 400 320" stroke="var(--muted, #cbd5e1)" stroke-width="2" fill="none"/>
  <!-- horizontal bus across the 3 children centers (140, 400, 660) -->
  <path d="M 140 320 L 660 320" stroke="var(--muted, #cbd5e1)" stroke-width="2" fill="none"/>
  <!-- verticals down to each child -->
  <path d="M 140 320 L 140 380" stroke="var(--muted, #cbd5e1)" stroke-width="2" fill="none"/>
  <path d="M 400 320 L 400 380" stroke="var(--muted, #cbd5e1)" stroke-width="2" fill="none"/>
  <path d="M 660 320 L 660 380" stroke="var(--muted, #cbd5e1)" stroke-width="2" fill="none"/>

  <!-- Root -->
  <g filter="url(#soft-shadow)">
    <rect x="290" y="130" width="220" height="120" rx="12" fill="var(--primary)"/>
  </g>
  <foreignObject x="290" y="130" width="220" height="120">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="root" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:clamp(13px,2.4cqw,18px);color:var(--bg);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Racine</div>
  </foreignObject>

  <!-- Children: width 200, height 130; centers at 140, 400, 660 -->
  <g filter="url(#soft-shadow)">
    <rect x="40"  y="380" width="200" height="130" rx="12" fill="var(--accent)"/>
    <rect x="300" y="380" width="200" height="130" rx="12" fill="var(--accent)"/>
    <rect x="560" y="380" width="200" height="130" rx="12" fill="var(--accent)"/>
  </g>
  <foreignObject x="40"  y="380" width="200" height="130">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="child_1" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(11px,2cqw,16px);color:var(--bg);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Enfant 1</div>
  </foreignObject>
  <foreignObject x="300" y="380" width="200" height="130">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="child_2" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(11px,2cqw,16px);color:var(--bg);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Enfant 2</div>
  </foreignObject>
  <foreignObject x="560" y="380" width="200" height="130">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="child_3" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(11px,2cqw,16px);color:var(--bg);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Enfant 3</div>
  </foreignObject>
</svg>
