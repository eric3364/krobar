<svg viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg">
  <style>
    .label-strong { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: 600; }
    .label { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 13px; font-weight: 500; }
    .gloss { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 11px; font-weight: 400; font-style: italic; fill: var(--muted); }
    .gloss-strong { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 11px; font-weight: 500; }
    .caption { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 10px; font-weight: 400; font-style: italic; fill: var(--muted); }
    .axis { stroke: var(--border); stroke-width: 0.6; fill: none; }
  </style>

  <defs>
    <marker id="arrowa4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="50" y="115" width="120" height="65" rx="8" fill="var(--bg)" stroke="var(--primary)" stroke-width="1.8"/>
  <text x="110" y="143" class="label" text-anchor="middle" dominant-baseline="central" fill="var(--primary)">{{step_1}}</text>
  <text x="110" y="163" class="gloss" text-anchor="middle">{{step_1_gloss}}</text>
  <line x1="170" y1="148" x2="200" y2="148" stroke="var(--muted)" stroke-width="0.9" marker-end="url(#arrowa4)"/>
  <rect x="200" y="115" width="120" height="65" rx="8" fill="var(--bg)" stroke="var(--primary)" stroke-width="1.8"/>
  <text x="260" y="143" class="label" text-anchor="middle" dominant-baseline="central" fill="var(--primary)">{{step_2}}</text>
  <text x="260" y="163" class="gloss" text-anchor="middle">{{step_2_gloss}}</text>
  <line x1="320" y1="148" x2="350" y2="148" stroke="var(--muted)" stroke-width="0.9" marker-end="url(#arrowa4)"/>
  <rect x="350" y="115" width="120" height="65" rx="8" fill="var(--bg)" stroke="var(--primary)" stroke-width="1.8"/>
  <text x="410" y="143" class="label" text-anchor="middle" dominant-baseline="central" fill="var(--primary)">{{step_3}}</text>
  <text x="410" y="163" class="gloss" text-anchor="middle">{{step_3_gloss}}</text>
  <line x1="470" y1="148" x2="500" y2="148" stroke="var(--muted)" stroke-width="0.9" marker-end="url(#arrowa4)"/>
  <rect x="500" y="115" width="120" height="65" rx="8" fill="var(--bg)" stroke="var(--primary)" stroke-width="1.8"/>
  <text x="560" y="143" class="label" text-anchor="middle" dominant-baseline="central" fill="var(--primary)">{{step_4}}</text>
  <text x="560" y="163" class="gloss" text-anchor="middle">{{step_4_gloss}}</text>
  <text x="50" y="240" class="caption">{{caption}}</text>
</svg>