  <text x="290" y="80" class="gloss" fill="var(--accent)" data-slot="vector_milestone_1">vector_milestone_1</text>
  <text x="410" y="95" class="gloss" fill="var(--accent)" data-slot="vector_milestone_2">vector_milestone_2</text>
  <text x="40" y="345" class="caption" data-slot="caption">caption</text>
