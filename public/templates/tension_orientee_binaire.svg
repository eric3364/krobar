  <circle cx="500" cy="200" r="55" fill="var(--bg)" stroke="var(--cool)" stroke-width="2"/>
  <text x="500" y="196" class="label-strong" text-anchor="middle" dominant-baseline="central" fill="var(--cool)" data-slot="pole_right_line1">pole_right_line1</text>
  <text x="500" y="214" class="label-strong" text-anchor="middle" dominant-baseline="central" fill="var(--cool)" data-slot="pole_right_line2">pole_right_line2</text>
  <text x="500" y="285" class="gloss" text-anchor="middle" data-slot="pole_right_gloss_1">pole_right_gloss_1</text>
  <text x="500" y="302" class="gloss" text-anchor="middle" data-slot="pole_right_gloss_2">pole_right_gloss_2</text>
  <line x1="160" y1="80" x2="560" y2="120" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#arrowc1)"/>
  <circle cx="160" cy="80" r="3" fill="var(--accent)"/>
  <circle cx="280" cy="92" r="3" fill="var(--accent)"/>
