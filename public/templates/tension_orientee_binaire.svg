<svg viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg">
  <style>
    .label-strong { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: 600; }
    .label { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 13px; font-weight: 500; }
    .gloss { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 11px; font-weight: 400; font-style: italic; fill: var(--muted); }
    .gloss-strong { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 11px; font-weight: 500; }
    .caption { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 10px; font-weight: 400; font-style: italic; fill: var(--muted); }
    .axis { stroke: var(--border); stroke-width: 0.6; fill: none; }
  </style>

  <defs>
    <marker id="arrowc1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <line x1="100" y1="200" x2="580" y2="200" stroke="var(--border)" stroke-width="0.8"/>
  <circle cx="180" cy="200" r="55" fill="var(--bg)" stroke="var(--warm)" stroke-width="2"/>
  <text x="180" y="196" class="label-strong" text-anchor="middle" dominant-baseline="central" fill="var(--warm)" data-slot="pole_left_line1">pole_left_line1</text>
  <text x="180" y="214" class="label-strong" text-anchor="middle" dominant-baseline="central" fill="var(--warm)" data-slot="pole_left_line2">pole_left_line2</text>
  <text x="180" y="285" class="gloss" text-anchor="middle" data-slot="pole_left_gloss_1">pole_left_gloss_1</text>
