<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Inter, system-ui, sans-serif">
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="var(--bg)"/>

  <foreignObject x="20" y="10" width="760" height="40">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:clamp(16px,2.8cqw,24px);color:var(--text);padding:6px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Business Model Canvas</div>
  </foreignObject>

  <!-- Top row: 5 columns. Layout:
       Partners (160w, full top h=320)
       Activities (top half h=160) / Resources (bottom half h=160)  — 160w
       Value Proposition (160w, full top h=320)
       Relationships (top half) / Channels (bottom half) — 160w
       Segments (160w, full top h=320)
       Bottom row: Cost Structure (400w) | Revenue Streams (400w), h=160
  -->

  <!-- Partners (full height) -->
  <g filter="url(#soft-shadow)">
    <rect x="20" y="60" width="160" height="380" rx="12" fill="var(--primary)" opacity="0.10" stroke="var(--primary)" stroke-width="2"/>
  </g>
  <foreignObject x="25" y="65" width="150" height="32">
    <div xmlns="http://www.w3.org/1999/xhtml" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:clamp(10px,2cqw,13px);color:var(--primary);padding:4px;box-sizing:border-box;">Partenaires clés</div>
  </foreignObject>
  <foreignObject x="25" y="100" width="150" height="335">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="partners" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-size:clamp(10px,1.7cqw,13px);color:var(--text);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Vos partenaires</div>
  </foreignObject>

  <!-- Activities (top half) -->
  <g filter="url(#soft-shadow)">
    <rect x="185" y="60" width="160" height="190" rx="12" fill="var(--accent)" opacity="0.12" stroke="var(--accent)" stroke-width="2"/>
  </g>
  <foreignObject x="190" y="65" width="150" height="32">
    <div xmlns="http://www.w3.org/1999/xhtml" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:clamp(10px,2cqw,13px);color:var(--accent);padding:4px;box-sizing:border-box;">Activités clés</div>
  </foreignObject>
  <foreignObject x="190" y="100" width="150" height="145">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="activities" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-size:clamp(10px,1.7cqw,13px);color:var(--text);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Vos activités</div>
  </foreignObject>

  <!-- Resources (bottom half, under activities) -->
  <g filter="url(#soft-shadow)">
    <rect x="185" y="255" width="160" height="185" rx="12" fill="var(--accent)" opacity="0.12" stroke="var(--accent)" stroke-width="2"/>
  </g>
  <foreignObject x="190" y="260" width="150" height="32">
    <div xmlns="http://www.w3.org/1999/xhtml" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:clamp(10px,2cqw,13px);color:var(--accent);padding:4px;box-sizing:border-box;">Ressources clés</div>
  </foreignObject>
  <foreignObject x="190" y="295" width="150" height="140">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="resources" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-size:clamp(10px,1.7cqw,13px);color:var(--text);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Vos ressources</div>
  </foreignObject>

  <!-- Value proposition (full height, center, primary opaque) -->
  <g filter="url(#soft-shadow)">
    <rect x="350" y="60" width="160" height="380" rx="12" fill="var(--primary)" opacity="0.85"/>
  </g>
  <foreignObject x="355" y="65" width="150" height="34">
    <div xmlns="http://www.w3.org/1999/xhtml" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:800;font-size:clamp(10px,2cqw,13px);color:var(--bg);padding:4px;box-sizing:border-box;">Proposition de valeur</div>
  </foreignObject>
  <foreignObject x="355" y="100" width="150" height="335">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="value_proposition" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(10px,1.8cqw,14px);color:var(--bg);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Votre proposition</div>
  </foreignObject>

  <!-- Relationships (top half) -->
  <g filter="url(#soft-shadow)">
    <rect x="515" y="60" width="160" height="190" rx="12" fill="var(--accent)" opacity="0.12" stroke="var(--accent)" stroke-width="2"/>
  </g>
  <foreignObject x="520" y="65" width="150" height="32">
    <div xmlns="http://www.w3.org/1999/xhtml" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:clamp(10px,2cqw,13px);color:var(--accent);padding:4px;box-sizing:border-box;">Relation client</div>
  </foreignObject>
  <foreignObject x="520" y="100" width="150" height="145">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="relationships" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-size:clamp(10px,1.7cqw,13px);color:var(--text);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Type de relation</div>
  </foreignObject>

  <!-- Channels (bottom half) -->
  <g filter="url(#soft-shadow)">
    <rect x="515" y="255" width="160" height="185" rx="12" fill="var(--accent)" opacity="0.12" stroke="var(--accent)" stroke-width="2"/>
  </g>
  <foreignObject x="520" y="260" width="150" height="32">
    <div xmlns="http://www.w3.org/1999/xhtml" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:clamp(10px,2cqw,13px);color:var(--accent);padding:4px;box-sizing:border-box;">Canaux</div>
  </foreignObject>
  <foreignObject x="520" y="295" width="150" height="140">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="channels" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-size:clamp(10px,1.7cqw,13px);color:var(--text);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Canaux de distribution</div>
  </foreignObject>

  <!-- Segments (full height, right) -->
  <g filter="url(#soft-shadow)">
    <rect x="680" y="60" width="100" height="380" rx="12" fill="var(--primary)" opacity="0.10" stroke="var(--primary)" stroke-width="2"/>
  </g>
  <foreignObject x="683" y="65" width="94" height="32">
    <div xmlns="http://www.w3.org/1999/xhtml" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:clamp(10px,2.6cqw,12px);color:var(--primary);padding:4px;box-sizing:border-box;">Segments clients</div>
  </foreignObject>
  <foreignObject x="683" y="100" width="94" height="335">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="segments" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-size:clamp(10px,2cqw,12px);color:var(--text);padding:6px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Vos clients</div>
  </foreignObject>

  <!-- Bottom row: Costs (left half) | Revenues (right half) -->
  <g filter="url(#soft-shadow)">
    <rect x="20" y="450" width="380" height="135" rx="12" fill="var(--text)" opacity="0.08" stroke="var(--text)" stroke-width="2"/>
  </g>
  <foreignObject x="25" y="455" width="370" height="32">
    <div xmlns="http://www.w3.org/1999/xhtml" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:clamp(11px,1.6cqw,14px);color:var(--text);padding:4px;box-sizing:border-box;">Structure de coûts</div>
  </foreignObject>
  <foreignObject x="25" y="490" width="370" height="90">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="cost_structure" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-size:clamp(10px,1.5cqw,13px);color:var(--text);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Vos coûts principaux</div>
  </foreignObject>

  <g filter="url(#soft-shadow)">
    <rect x="405" y="450" width="375" height="135" rx="12" fill="var(--accent)" opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
  </g>
  <foreignObject x="410" y="455" width="365" height="32">
    <div xmlns="http://www.w3.org/1999/xhtml" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:clamp(11px,1.6cqw,14px);color:var(--accent);padding:4px;box-sizing:border-box;">Sources de revenus</div>
  </foreignObject>
  <foreignObject x="410" y="490" width="365" height="90">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="revenue_streams" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-size:clamp(10px,1.5cqw,13px);color:var(--text);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Vos revenus</div>
  </foreignObject>
</svg>
