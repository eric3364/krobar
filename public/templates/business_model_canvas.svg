<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="Plus Jakarta Sans, system-ui, sans-serif">
  <defs>
    <filter id="editorialShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="var(--primary)" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="1040" height="600" fill="var(--bg)"/>

  <g transform="translate(60, 60)" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="2" y="6" width="24" height="16" rx="2"/>
    <path d="M2 12h24"/>
    <path d="M14 6v16"/>
  </g>

  <text x="105" y="72" font-size="13" font-weight="600" letter-spacing="1.04" fill="var(--text)" opacity="0.55" style="text-transform: uppercase;">Business Model Canvas</text>

  <foreignObject x="60" y="90" width="920" height="56">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:36px;letter-spacing:-0.01em;color:var(--text);box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Modèle économique</div>
  </foreignObject>

  <line x1="60" y1="160" x2="148" y2="160" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>

  <g filter="url(#editorialShadow)">
    <rect x="60" y="200" width="180" height="270" rx="12" fill="#FFFFFF" stroke="var(--text)" stroke-opacity="0.12" stroke-width="1" id="partners">
  </g>
  <path d="M 60,212 A 12,12 0 0,1 72,200 L 228,200 A 12,12 0 0,1 240,212 L 240,212 L 60,212 Z" fill="var(--accent)"/>
  <text x="78" y="232" font-size="11" font-weight="700" fill="var(--text)" opacity="0.65" style="text-transform: uppercase; letter-spacing: 0.06em;">Partenaires clés</text>
  <foreignObject x="78" y="245" width="144" height="215" data-shape="partners">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="partners" style="width:100%;height:100%;display:flex;align-items:flex-start;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:500;font-size:11px;color:var(--text);line-height:1.5;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Vos partenaires</div>
  </foreignObject>

  <g filter="url(#editorialShadow)">
    <rect x="250" y="200" width="180" height="130" rx="12" fill="#FFFFFF" stroke="var(--text)" stroke-opacity="0.12" stroke-width="1" id="activities">
  </g>
  <path d="M 250,212 A 12,12 0 0,1 262,200 L 418,200 A 12,12 0 0,1 430,212 L 430,212 L 250,212 Z" fill="var(--accent)"/>
  <text x="268" y="232" font-size="11" font-weight="700" fill="var(--text)" opacity="0.65" style="text-transform: uppercase; letter-spacing: 0.06em;">Activités clés</text>
  <foreignObject x="268" y="245" width="144" height="78" data-shape="activities">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="activities" style="width:100%;height:100%;display:flex;align-items:flex-start;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:500;font-size:11px;color:var(--text);line-height:1.5;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Vos activités</div>
  </foreignObject>

  <g filter="url(#editorialShadow)">
    <rect x="250" y="340" width="180" height="130" rx="12" fill="#FFFFFF" stroke="var(--text)" stroke-opacity="0.12" stroke-width="1" id="resources">
  </g>
  <path d="M 250,352 A 12,12 0 0,1 262,340 L 418,340 A 12,12 0 0,1 430,352 L 430,352 L 250,352 Z" fill="var(--accent)"/>
  <text x="268" y="372" font-size="11" font-weight="700" fill="var(--text)" opacity="0.65" style="text-transform: uppercase; letter-spacing: 0.06em;">Ressources clés</text>
  <foreignObject x="268" y="385" width="144" height="78" data-shape="resources">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="resources" style="width:100%;height:100%;display:flex;align-items:flex-start;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:500;font-size:11px;color:var(--text);line-height:1.5;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Vos ressources</div>
  </foreignObject>

  <g filter="url(#editorialShadow)">
    <rect x="440" y="200" width="180" height="270" rx="12" fill="var(--accent)" id="value_proposition">
  </g>
  <text x="458" y="232" font-size="11" font-weight="700" fill="var(--bg)" opacity="0.85" style="text-transform: uppercase; letter-spacing: 0.06em;">Proposition de valeur</text>
  <foreignObject x="458" y="245" width="144" height="215" data-shape="value_proposition">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="value_proposition" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:13px;color:var(--bg);line-height:1.5;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Votre proposition unique</div>
  </foreignObject>

  <g filter="url(#editorialShadow)">
    <rect x="630" y="200" width="180" height="130" rx="12" fill="#FFFFFF" stroke="var(--text)" stroke-opacity="0.12" stroke-width="1" id="relationships">
  </g>
  <path d="M 630,212 A 12,12 0 0,1 642,200 L 798,200 A 12,12 0 0,1 810,212 L 810,212 L 630,212 Z" fill="var(--accent)"/>
  <text x="648" y="232" font-size="11" font-weight="700" fill="var(--text)" opacity="0.65" style="text-transform: uppercase; letter-spacing: 0.06em;">Relation client</text>
  <foreignObject x="648" y="245" width="144" height="78" data-shape="relationships">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="relationships" style="width:100%;height:100%;display:flex;align-items:flex-start;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:500;font-size:11px;color:var(--text);line-height:1.5;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Type de relation</div>
  </foreignObject>

  <g filter="url(#editorialShadow)">
    <rect x="630" y="340" width="180" height="130" rx="12" fill="#FFFFFF" stroke="var(--text)" stroke-opacity="0.12" stroke-width="1" id="channels">
  </g>
  <path d="M 630,352 A 12,12 0 0,1 642,340 L 798,340 A 12,12 0 0,1 810,352 L 810,352 L 630,352 Z" fill="var(--accent)"/>
  <text x="648" y="372" font-size="11" font-weight="700" fill="var(--text)" opacity="0.65" style="text-transform: uppercase; letter-spacing: 0.06em;">Canaux</text>
  <foreignObject x="648" y="385" width="144" height="78" data-shape="channels">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="channels" style="width:100%;height:100%;display:flex;align-items:flex-start;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:500;font-size:11px;color:var(--text);line-height:1.5;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Vos canaux</div>
  </foreignObject>

  <g filter="url(#editorialShadow)">
    <rect x="820" y="200" width="160" height="270" rx="12" fill="#FFFFFF" stroke="var(--text)" stroke-opacity="0.12" stroke-width="1" id="segments">
  </g>
  <path d="M 820,212 A 12,12 0 0,1 832,200 L 968,200 A 12,12 0 0,1 980,212 L 980,212 L 820,212 Z" fill="var(--accent)"/>
  <text x="838" y="232" font-size="11" font-weight="700" fill="var(--text)" opacity="0.65" style="text-transform: uppercase; letter-spacing: 0.06em;">Segments clients</text>
  <foreignObject x="838" y="245" width="124" height="215" data-shape="segments">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="segments" style="width:100%;height:100%;display:flex;align-items:flex-start;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:500;font-size:11px;color:var(--text);line-height:1.5;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Vos clients</div>
  </foreignObject>

  <g filter="url(#editorialShadow)">
    <rect x="60" y="480" width="460" height="80" rx="12" fill="#FFFFFF" stroke="var(--text)" stroke-opacity="0.12" stroke-width="1" id="cost_structure">
  </g>
  <path d="M 60,492 A 12,12 0 0,1 72,480 L 508,480 A 12,12 0 0,1 520,492 L 520,492 L 60,492 Z" fill="var(--primary)" opacity="0.7"/>
  <text x="78" y="512" font-size="11" font-weight="700" fill="var(--primary)" opacity="0.55" style="text-transform: uppercase; letter-spacing: 0.06em;">Structure de coûts</text>
  <foreignObject x="78" y="520" width="424" height="38" data-shape="cost_structure">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="cost_structure" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:500;font-size:11px;color:var(--text);line-height:1.5;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Salaires, technologie, marketing</div>
  </foreignObject>

  <g filter="url(#editorialShadow)">
    <rect x="540" y="480" width="440" height="80" rx="12" fill="#FFFFFF" stroke="var(--text)" stroke-opacity="0.12" stroke-width="1" id="revenue_streams">
  </g>
  <path d="M 540,492 A 12,12 0 0,1 552,480 L 968,480 A 12,12 0 0,1 980,492 L 980,492 L 540,492 Z" fill="var(--accent)"/>
  <text x="558" y="512" font-size="11" font-weight="700" fill="var(--accent)" style="text-transform: uppercase; letter-spacing: 0.06em;">Sources de revenus</text>
  <foreignObject x="558" y="520" width="404" height="38" data-shape="revenue_streams">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="revenue_streams" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:500;font-size:11px;color:var(--text);line-height:1.5;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Frais, abonnements, services</div>
  </foreignObject>

  <text x="60" y="588" font-size="11" font-weight="600" letter-spacing="0.88" fill="var(--text)" opacity="0.5" style="text-transform: uppercase;">Krobar · Business</text>
</svg>
