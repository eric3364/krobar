<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="Inter, system-ui, sans-serif">
  <rect width="1040" height="600" fill="var(--bg)"/>
  <foreignObject x="20" y="40" width="1000" height="80">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:clamp(20px,2.4vw,32px);color:var(--text);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Titre du processus</div>
  </foreignObject>

  <g>
    <rect x="40" y="220" width="260" height="160" rx="16" fill="var(--primary)"/>
    <foreignObject x="40" y="220" width="260" height="160">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="step_1_label" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(12px,1.4vw,18px);color:var(--bg);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Étape 1</div>
    </foreignObject>
  </g>

  <path d="M 310 300 L 360 300" stroke="var(--accent)" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <g>
    <rect x="370" y="220" width="260" height="160" rx="16" fill="var(--accent)"/>
    <foreignObject x="370" y="220" width="260" height="160">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="step_2_label" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(12px,1.4vw,18px);color:var(--bg);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Étape 2</div>
    </foreignObject>
  </g>

  <path d="M 640 300 L 690 300" stroke="var(--accent)" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <g>
    <rect x="700" y="220" width="260" height="160" rx="16" fill="var(--primary)"/>
    <foreignObject x="700" y="220" width="260" height="160">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="step_3_label" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(12px,1.4vw,18px);color:var(--bg);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Étape 3</div>
    </foreignObject>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)"/>
    </marker>
  </defs>
</svg>
