<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="Plus Jakarta Sans, system-ui, sans-serif">
  <rect width="1040" height="600" fill="var(--bg)"/>
  <text x="105" y="72" font-size="13" font-weight="600" fill="var(--text)" opacity="0.55" style="text-transform: uppercase;">Processus 3 Étapes</text>
  <foreignObject x="60" y="90" width="920" height="56">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="width:100%;height:100%;display:flex;align-items:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:36px;color:var(--text);box-sizing:border-box;">Processus de développement</div>
  </foreignObject>
  
  <!-- Step 1 -->
  <rect x="80" y="200" width="250" height="80" rx="12" fill="var(--primary)" fill-opacity="0.1" stroke="var(--primary)" stroke-width="2"/>
  <foreignObject x="90" y="220" width="180" height="40">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="step_1_title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:18px;color:var(--text);box-sizing:border-box;">Planification</div>
  </foreignObject>
  
  <!-- Arrow 1->2 -->
  <polygon points="350,240 380,240 370,250 380,240 370,230" fill="var(--accent)"/>
  
  <!-- Step 2 -->
  <rect x="400" y="200" width="250" height="80" rx="12" fill="var(--accent)" fill-opacity="0.1" stroke="var(--accent)" stroke-width="2"/>
  <foreignObject x="410" y="220" width="180" height="40">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="step_2_title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:18px;color:var(--text);box-sizing:border-box;">Développement</div>
  </foreignObject>
  
  <!-- Arrow 2->3 -->
  <polygon points="670,240 700,240 690,250 700,240 690,230" fill="var(--accent)"/>
  
  <!-- Step 3 -->
  <rect x="720" y="200" width="250" height="80" rx="12" fill="var(--primary)" fill-opacity="0.1" stroke="var(--primary)" stroke-width="2"/>
  <foreignObject x="730" y="220" width="180" height="40">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="step_3_title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:18px;color:var(--text);box-sizing:border-box;">Déploiement</div>
  </foreignObject>
  
  <text x="60" y="580" font-size="11" font-weight="600" fill="var(--text)" opacity="0.5" style="text-transform: uppercase;">Krobar · Process</text>
</svg>
