<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="Plus Jakarta Sans, system-ui, sans-serif">
  <rect width="1040" height="600" fill="var(--bg)"/>
  <text x="105" y="72" font-size="13" font-weight="600" fill="var(--text)" opacity="0.55" style="text-transform: uppercase;">Cluster d'Idées</text>
  <foreignObject x="60" y="90" width="920" height="56">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="width:100%;height:100%;display:flex;align-items:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:36px;color:var(--text);box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;line-height:1.1;">Brainstorming créatif</div>
  </foreignObject>

  <!-- Centre : id="centre" -->
  <circle id="centre" cx="520" cy="320" r="70" fill="var(--primary)" fill-opacity="0.1" stroke="var(--primary)" stroke-width="2"/>
  <foreignObject x="440" y="300" width="180" height="40">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="central_idea" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;word-wrap:break-word;overflow-wrap:break-word;line-height:1.2;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:18px;color:var(--primary);box-sizing:border-box;">Idée centrale</div>
  </foreignObject>

  <g class="slot-group" data-slot-key="idea_1">
    <circle id="idea_1" cx="300" cy="220" r="45" fill="var(--accent)" fill-opacity="0.1" stroke="var(--accent)" stroke-width="2"/>
    <line data-from="centre" data-to="idea_1" x1="0" y1="0" x2="0" y2="0" stroke="var(--accent)" stroke-width="1" opacity="0.4"/>
    <foreignObject x="220" y="200" width="180" height="40">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="idea_1" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;word-wrap:break-word;overflow-wrap:break-word;line-height:1.2;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Innovation</div>
    </foreignObject>
  </g>

  <g class="slot-group" data-slot-key="idea_2">
    <circle id="idea_2" cx="740" cy="220" r="45" fill="var(--accent)" fill-opacity="0.1" stroke="var(--accent)" stroke-width="2"/>
    <line data-from="centre" data-to="idea_2" x1="0" y1="0" x2="0" y2="0" stroke="var(--accent)" stroke-width="1" opacity="0.4"/>
    <foreignObject x="660" y="200" width="180" height="40">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="idea_2" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;word-wrap:break-word;overflow-wrap:break-word;line-height:1.2;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Collaboration</div>
    </foreignObject>
  </g>

  <g class="slot-group" data-slot-key="idea_3">
    <circle id="idea_3" cx="300" cy="420" r="45" fill="var(--accent)" fill-opacity="0.1" stroke="var(--accent)" stroke-width="2"/>
    <line data-from="centre" data-to="idea_3" x1="0" y1="0" x2="0" y2="0" stroke="var(--accent)" stroke-width="1" opacity="0.4"/>
    <foreignObject x="220" y="400" width="180" height="40">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="idea_3" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;word-wrap:break-word;overflow-wrap:break-word;line-height:1.2;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Efficacité</div>
    </foreignObject>
  </g>

  <g class="slot-group" data-slot-key="idea_4">
    <circle id="idea_4" cx="740" cy="420" r="45" fill="var(--accent)" fill-opacity="0.1" stroke="var(--accent)" stroke-width="2"/>
    <line data-from="centre" data-to="idea_4" x1="0" y1="0" x2="0" y2="0" stroke="var(--accent)" stroke-width="1" opacity="0.4"/>
    <foreignObject x="660" y="400" width="180" height="40">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="idea_4" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;word-wrap:break-word;overflow-wrap:break-word;line-height:1.2;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Durabilité</div>
    </foreignObject>
  </g>

  <g class="slot-group" data-slot-key="idea_5">
    <circle id="idea_5" cx="800" cy="320" r="35" fill="var(--primary)" fill-opacity="0.2" stroke="var(--primary)" stroke-width="2"/>
    <line data-from="centre" data-to="idea_5" x1="0" y1="0" x2="0" y2="0" stroke="var(--accent)" stroke-width="1" opacity="0.4"/>
    <foreignObject x="720" y="300" width="180" height="40">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="idea_5" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;word-wrap:break-word;overflow-wrap:break-word;line-height:1.2;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Croissance</div>
    </foreignObject>
  </g>

  <text x="60" y="580" font-size="11" font-weight="600" fill="var(--text)" opacity="0.5" style="text-transform: uppercase;">Krobar · Creativity</text>
</svg>
