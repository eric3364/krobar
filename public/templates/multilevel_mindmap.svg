<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Plus Jakarta Sans, system-ui, sans-serif">
  <rect width="1600" height="1000" fill="var(--bg)"/>
  <text x="105" y="72" font-size="13" font-weight="600" fill="var(--text)" opacity="0.55" style="text-transform: uppercase;">Mindmap Multi-Niveaux</text>
  <foreignObject x="60" y="90" width="1480" height="56">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="width:100%;height:100%;display:flex;align-items:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:36px;color:var(--text);box-sizing:border-box;">Architecture hiérarchique complexe</div>
  </foreignObject>

  <!-- Central node (Level 0) -->
  <rect x="700" y="450" width="200" height="100" rx="12" fill="var(--primary)" fill-opacity="0.3" stroke="var(--primary)" stroke-width="4"/>
  <foreignObject x="710" y="485" width="180" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="central_concept" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:18px;color:var(--primary);box-sizing:border-box;">Projet Principal</div>
  </foreignObject>

  <!-- Level 1 branches -->
  <!-- Branch 1.1 -->
  <line x1="700" y1="480" x2="500" y2="350" stroke="var(--primary)" stroke-width="4"/>
  <rect x="400" y="320" width="160" height="60" rx="8" fill="var(--accent)" fill-opacity="0.2" stroke="var(--accent)" stroke-width="3"/>
  <foreignObject x="410" y="340" width="180" height="20">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="branch_1_1" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Stratégie</div>
  </foreignObject>

  <!-- Branch 1.2 -->
  <line x1="800" y1="450" x2="950" y2="300" stroke="var(--primary)" stroke-width="4"/>
  <rect x="880" y="270" width="160" height="60" rx="8" fill="var(--accent)" fill-opacity="0.2" stroke="var(--accent)" stroke-width="3"/>
  <foreignObject x="890" y="290" width="180" height="20">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="branch_1_2" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Exécution</div>
  </foreignObject>

  <!-- Branch 1.3 -->
  <line x1="900" y1="500" x2="1150" y2="500" stroke="var(--primary)" stroke-width="4"/>
  <rect x="1170" y="470" width="160" height="60" rx="8" fill="var(--accent)" fill-opacity="0.2" stroke="var(--accent)" stroke-width="3"/>
  <foreignObject x="1180" y="490" width="180" height="20">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="branch_1_3" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Contrôle</div>
  </foreignObject>

  <!-- Level 2 branches from Strategy -->
  <!-- Sub-branch 2.1.1 -->
  <line x1="400" y1="340" x2="250" y2="280" stroke="var(--accent)" stroke-width="3"/>
  <rect x="150" y="260" width="140" height="40" rx="6" fill="var(--primary)" fill-opacity="0.1" stroke="var(--primary)" stroke-width="2"/>
  <foreignObject x="160" y="270" width="180" height="20">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="sub_branch_2_1_1" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:500;font-size:14px;color:var(--text);box-sizing:border-box;">Analyse concurrentielle</div>
  </foreignObject>

  <!-- Sub-branch 2.1.2 -->
  <line x1="400" y1="360" x2="280" y2="420" stroke="var(--accent)" stroke-width="3"/>
  <rect x="180" y="400" width="140" height="40" rx="6" fill="var(--primary)" fill-opacity="0.1" stroke="var(--primary)" stroke-width="2"/>
  <foreignObject x="190" y="410" width="180" height="20">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="sub_branch_2_1_2" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:500;font-size:14px;color:var(--text);box-sizing:border-box;">Positionnement marché</div>
  </foreignObject>

  <!-- Level 2 branches from Execution -->
  <!-- Sub-branch 2.2.1 -->
  <line x1="960" y1="270" x2="850" y2="200" stroke="var(--accent)" stroke-width="3"/>
  <rect x="750" y="180" width="140" height="40" rx="6" fill="var(--accent)" fill-opacity="0.1" stroke="var(--accent)" stroke-width="2"/>
  <foreignObject x="760" y="190" width="180" height="20">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="sub_branch_2_2_1" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:500;font-size:14px;color:var(--text);box-sizing:border-box;">Équipes</div>
  </foreignObject>

  <!-- Sub-branch 2.2.2 -->
  <line x1="1040" y1="290" x2="1150" y2="230" stroke="var(--accent)" stroke-width="3"/>
  <rect x="1170" y="210" width="140" height="40" rx="6" fill="var(--accent)" fill-opacity="0.1" stroke="var(--accent)" stroke-width="2"/>
  <foreignObject x="1180" y="220" width="180" height="20">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="sub_branch_2_2_2" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:500;font-size:14px;color:var(--text);box-sizing:border-box;">Processus</div>
  </foreignObject>

  <!-- Level 3 branches (deepest level) -->
  <!-- Sub-sub-branch 3.1.1.1 -->
  <line x1="150" y1="270" x2="80" y2="230" stroke="var(--primary)" stroke-width="2"/>
  <rect x="30" y="210" width="100" height="30" rx="4" fill="var(--text)" fill-opacity="0.05" stroke="var(--text)" stroke-width="1"/>
  <foreignObject x="40" y="215" width="120" height="20">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="sub_sub_branch_3_1_1_1" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:400;font-size:12px;color:var(--text);box-sizing:border-box;">SWOT</div>
  </foreignObject>

  <!-- Sub-sub-branch 3.1.1.2 -->
  <line x1="160" y1="260" x2="90" y2="300" stroke="var(--primary)" stroke-width="2"/>
  <rect x="40" y="290" width="100" height="30" rx="4" fill="var(--text)" fill-opacity="0.05" stroke="var(--text)" stroke-width="1"/>
  <foreignObject x="50" y="295" width="120" height="20">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="sub_sub_branch_3_1_1_2" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:400;font-size:12px;color:var(--text);box-sizing:border-box;">Benchmark</div>
  </foreignObject>

  <!-- Sub-sub-branch 3.2.2.1 -->
  <line x1="1310" y1="220" x2="1420" y2="180" stroke="var(--accent)" stroke-width="2"/>
  <rect x="1440" y="160" width="100" height="30" rx="4" fill="var(--text)" fill-opacity="0.05" stroke="var(--text)" stroke-width="1"/>
  <foreignObject x="1450" y="165" width="120" height="20">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="sub_sub_branch_3_2_2_1" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:400;font-size:12px;color:var(--text);box-sizing:border-box;">Méthodologie</div>
  </foreignObject>

  <text x="60" y="980" font-size="11" font-weight="600" fill="var(--text)" opacity="0.5" style="text-transform: uppercase;">Krobar · Multi-Level</text>
</svg>
