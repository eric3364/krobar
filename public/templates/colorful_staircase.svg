<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Plus Jakarta Sans, system-ui, sans-serif">
  <rect width="1200" height="800" fill="var(--bg)"/>
  <text x="105" y="72" font-size="13" font-weight="600" fill="var(--text)" opacity="0.55" style="text-transform: uppercase;">Escalier de Progression</text>
  <foreignObject x="60" y="90" width="1080" height="56">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="width:100%;height:100%;display:flex;align-items:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:36px;color:var(--text);box-sizing:border-box;">Niveaux de maturité progressive</div>
  </foreignObject>

  <!-- Step 1 (Bottom - Purple) -->
  <rect x="120" y="600" width="180" height="80" rx="12" fill="#9333ea" fill-opacity="0.2" stroke="#9333ea" stroke-width="3"/>
  <text x="210" y="630" font-size="24" font-weight="700" fill="#9333ea" text-anchor="middle">1</text>
  <foreignObject x="130" y="550" width="180" height="40">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="step_1_title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:18px;color:var(--text);box-sizing:border-box;">Initiation</div>
  </foreignObject>

  <!-- Step 2 (Blue) -->
  <rect x="320" y="520" width="180" height="80" rx="12" fill="#2563eb" fill-opacity="0.2" stroke="#2563eb" stroke-width="3"/>
  <text x="410" y="550" font-size="24" font-weight="700" fill="#2563eb" text-anchor="middle">2</text>
  <foreignObject x="330" y="470" width="180" height="40">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="step_2_title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:18px;color:var(--text);box-sizing:border-box;">Développement</div>
  </foreignObject>

  <!-- Step 3 (Green) -->
  <rect x="520" y="440" width="180" height="80" rx="12" fill="#16a34a" fill-opacity="0.2" stroke="#16a34a" stroke-width="3"/>
  <text x="610" y="470" font-size="24" font-weight="700" fill="#16a34a" text-anchor="middle">3</text>
  <foreignObject x="530" y="390" width="180" height="40">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="step_3_title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:18px;color:var(--text);box-sizing:border-box;">Compétence</div>
  </foreignObject>

  <!-- Step 4 (Orange) -->
  <rect x="720" y="360" width="180" height="80" rx="12" fill="#ea580c" fill-opacity="0.2" stroke="#ea580c" stroke-width="3"/>
  <text x="810" y="390" font-size="24" font-weight="700" fill="#ea580c" text-anchor="middle">4</text>
  <foreignObject x="730" y="310" width="180" height="40">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="step_4_title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:18px;color:var(--text);box-sizing:border-box;">Excellence</div>
  </foreignObject>

  <!-- Step 5 (Red) -->
  <rect x="920" y="280" width="180" height="80" rx="12" fill="#dc2626" fill-opacity="0.2" stroke="#dc2626" stroke-width="3"/>
  <text x="1010" y="310" font-size="24" font-weight="700" fill="#dc2626" text-anchor="middle">5</text>
  <foreignObject x="930" y="230" width="180" height="40">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="step_5_title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:18px;color:var(--text);box-sizing:border-box;">Maîtrise</div>
  </foreignObject>

  <!-- Connecting lines between steps -->
  <line x1="300" y1="600" x2="320" y2="580" stroke="var(--accent)" stroke-width="2" opacity="0.6"/>
  <line x1="500" y1="520" x2="520" y2="500" stroke="var(--accent)" stroke-width="2" opacity="0.6"/>
  <line x1="700" y1="440" x2="720" y2="420" stroke="var(--accent)" stroke-width="2" opacity="0.6"/>
  <line x1="900" y1="360" x2="920" y2="340" stroke="var(--accent)" stroke-width="2" opacity="0.6"/>

  <!-- Ascending arrows -->
  <g transform="translate(360, 540)">
    <polygon points="0,10 10,0 20,10 15,10 15,20 5,20 5,10" fill="var(--primary)" opacity="0.6"/>
  </g>
  <g transform="translate(560, 460)">
    <polygon points="0,10 10,0 20,10 15,10 15,20 5,20 5,10" fill="var(--primary)" opacity="0.6"/>
  </g>
  <g transform="translate(760, 380)">
    <polygon points="0,10 10,0 20,10 15,10 15,20 5,20 5,10" fill="var(--primary)" opacity="0.6"/>
  </g>
  <g transform="translate(960, 300)">
    <polygon points="0,10 10,0 20,10 15,10 15,20 5,20 5,10" fill="var(--primary)" opacity="0.6"/>
  </g>

  <text x="60" y="780" font-size="11" font-weight="600" fill="var(--text)" opacity="0.5" style="text-transform: uppercase;">Krobar · Progression</text>
</svg>
