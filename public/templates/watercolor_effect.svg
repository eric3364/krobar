<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Plus Jakarta Sans, system-ui, sans-serif">
  <defs>
    <filter id="watercolor" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence baseFrequency="0.04" numOctaves="3" result="turbulence"/>
      <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="8" result="displace"/>
      <feGaussianBlur in="displace" stdDeviation="2" result="blur"/>
      <feComponentTransfer in="blur">
        <feFuncA type="discrete" tableValues="0 0.3 0.6 0.8"/>
      </feComponentTransfer>
    </filter>
    <filter id="softEdge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <rect width="1000" height="600" fill="var(--bg)"/>
  <text x="105" y="72" font-size="13" font-weight="600" fill="var(--text)" opacity="0.55" style="text-transform: uppercase;">Effet Aquarelle</text>
  <foreignObject x="60" y="90" width="880" height="56">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="width:100%;height:100%;display:flex;align-items:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:36px;color:var(--text);box-sizing:border-box;">Style aquarelle artistique et doux</div>
  </foreignObject>

  <!-- Watercolor blob 1 -->
  <ellipse cx="200" cy="250" rx="80" ry="60" fill="var(--primary)" opacity="0.6" filter="url(#watercolor)"/>
  <ellipse cx="210" cy="240" rx="60" ry="45" fill="var(--primary)" opacity="0.4" filter="url(#softEdge)"/>
  <foreignObject x="140" y="230" width="180" height="40">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="concept_1" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Inspiration</div>
  </foreignObject>

  <!-- Watercolor blob 2 -->
  <ellipse cx="500" cy="220" rx="90" ry="70" fill="var(--accent)" opacity="0.7" filter="url(#watercolor)"/>
  <ellipse cx="490" cy="210" rx="70" ry="50" fill="var(--accent)" opacity="0.5" filter="url(#softEdge)"/>
  <foreignObject x="420" y="200" width="180" height="40">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="concept_2" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Créativité</div>
  </foreignObject>

  <!-- Watercolor blob 3 -->
  <ellipse cx="750" cy="280" rx="85" ry="65" fill="var(--primary)" opacity="0.5" filter="url(#watercolor)"/>
  <ellipse cx="760" cy="270" rx="65" ry="50" fill="var(--primary)" opacity="0.3" filter="url(#softEdge)"/>
  <foreignObject x="680" y="260" width="180" height="40">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="concept_3" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Expression</div>
  </foreignObject>

  <!-- Watercolor connecting flows -->
  <path d="M 280 250 Q 350 200 420 230" stroke="var(--accent)" stroke-width="8" opacity="0.4" fill="none" filter="url(#watercolor)"/>
  <path d="M 590 240 Q 650 220 680 260" stroke="var(--primary)" stroke-width="8" opacity="0.4" fill="none" filter="url(#watercolor)"/>

  <!-- Central watercolor merge -->
  <ellipse cx="500" cy="400" rx="120" ry="80" fill="var(--accent)" opacity="0.3" filter="url(#watercolor)"/>
  <ellipse cx="480" cy="390" rx="100" ry="60" fill="var(--primary)" opacity="0.2" filter="url(#watercolor)"/>
  <ellipse cx="520" cy="410" rx="80" ry="50" fill="var(--accent)" opacity="0.2" filter="url(#softEdge)"/>
  <foreignObject x="420" y="380" width="180" height="40">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="synthesis" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:18px;color:var(--text);box-sizing:border-box;">Synthèse artistique</div>
  </foreignObject>

  <!-- Watercolor droplets -->
  <circle cx="150" cy="180" r="8" fill="var(--primary)" opacity="0.6" filter="url(#softEdge)"/>
  <circle cx="800" cy="190" r="6" fill="var(--accent)" opacity="0.5" filter="url(#softEdge)"/>
  <circle cx="650" cy="350" r="10" fill="var(--primary)" opacity="0.4" filter="url(#softEdge)"/>

  <text x="60" y="580" font-size="11" font-weight="600" fill="var(--text)" opacity="0.5" style="text-transform: uppercase;">Krobar · Watercolor</text>
</svg>
