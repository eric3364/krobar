<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Inter, system-ui, sans-serif" data-template="donut_4_parts">
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="var(--bg)"/>

  <foreignObject x="20" y="20" width="760" height="50">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:clamp(18px,3cqw,26px);color:var(--text);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Répartition</div>
  </foreignObject>

  <!--
    Donut: center (260,340), r=130, stroke-width=60.
    Circumference = 2*pi*r ≈ 816.81.
    Each arc rendered as a stroked circle, rotated -90deg so it starts at 12 o'clock.
    Default percentages: 25 / 25 / 25 / 25 → dasharray = (pct*C/100) (C - pct*C/100)
    Offsets are cumulative and applied via stroke-dashoffset.
    JS will recompute these from data-slot percent_N values.
  -->
  <g transform="rotate(-90 260 340)" filter="url(#soft-shadow)">
    <!-- background ring -->
    <circle cx="260" cy="340" r="130" fill="none" stroke="var(--text)" stroke-opacity="0.08" stroke-width="60"/>
    <circle data-slot="arc_1" data-pct="25" data-offset="0"
            cx="260" cy="340" r="130" fill="none"
            stroke="var(--primary)" stroke-width="60"
            stroke-dasharray="204.20 612.61" stroke-dashoffset="0"/>
    <circle data-slot="arc_2" data-pct="25" data-offset="25"
            cx="260" cy="340" r="130" fill="none"
            stroke="var(--accent)" stroke-width="60"
            stroke-dasharray="204.20 612.61" stroke-dashoffset="-204.20"/>
    <circle data-slot="arc_3" data-pct="25" data-offset="50"
            cx="260" cy="340" r="130" fill="none"
            stroke="var(--primary)" stroke-opacity="0.55" stroke-width="60"
            stroke-dasharray="204.20 612.61" stroke-dashoffset="-408.41"/>
    <circle data-slot="arc_4" data-pct="25" data-offset="75"
            cx="260" cy="340" r="130" fill="none"
            stroke="var(--accent)" stroke-opacity="0.55" stroke-width="60"
            stroke-dasharray="204.20 612.61" stroke-dashoffset="-612.61"/>
  </g>

  <!-- Percent labels positioned at the middle of each default segment.
       They are repositioned by JS based on actual percentages. -->
  <foreignObject data-slot-pos="percent_1" x="295" y="180" width="80" height="34">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="percent_1" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:14px;color:var(--bg);padding:4px;box-sizing:border-box;">25%</div>
  </foreignObject>
  <foreignObject data-slot-pos="percent_2" x="295" y="465" width="80" height="34">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="percent_2" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:14px;color:var(--bg);padding:4px;box-sizing:border-box;">25%</div>
  </foreignObject>
  <foreignObject data-slot-pos="percent_3" x="145" y="465" width="80" height="34">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="percent_3" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:14px;color:var(--bg);padding:4px;box-sizing:border-box;">25%</div>
  </foreignObject>
  <foreignObject data-slot-pos="percent_4" x="145" y="180" width="80" height="34">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="percent_4" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:14px;color:var(--bg);padding:4px;box-sizing:border-box;">25%</div>
  </foreignObject>

  <!-- Legend on the right -->
  <g filter="url(#soft-shadow)">
    <rect x="470" y="160" width="310" height="360" rx="12" fill="var(--text)" opacity="0.05" stroke="var(--text)" stroke-opacity="0.15" stroke-width="1"/>
  </g>

  <!-- Legend rows: swatch + label, 4 rows -->
  <rect x="490" y="195" width="22" height="22" rx="4" fill="var(--primary)"/>
  <foreignObject x="525" y="190" width="240" height="32">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="label_1" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;text-align:left;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(12px,2cqw,15px);color:var(--text);padding:6px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Catégorie 1</div>
  </foreignObject>

  <rect x="490" y="275" width="22" height="22" rx="4" fill="var(--accent)"/>
  <foreignObject x="525" y="270" width="240" height="32">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="label_2" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;text-align:left;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(12px,2cqw,15px);color:var(--text);padding:6px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Catégorie 2</div>
  </foreignObject>

  <rect x="490" y="355" width="22" height="22" rx="4" fill="var(--primary)" fill-opacity="0.55"/>
  <foreignObject x="525" y="350" width="240" height="32">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="label_3" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;text-align:left;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(12px,2cqw,15px);color:var(--text);padding:6px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Catégorie 3</div>
  </foreignObject>

  <rect x="490" y="435" width="22" height="22" rx="4" fill="var(--accent)" fill-opacity="0.55"/>
  <foreignObject x="525" y="430" width="240" height="32">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="label_4" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;text-align:left;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(12px,2cqw,15px);color:var(--text);padding:6px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Catégorie 4</div>
  </foreignObject>
</svg>
