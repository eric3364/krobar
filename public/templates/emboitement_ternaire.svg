  <text x="100" y="230" class="label-strong" dominant-baseline="central" fill="var(--primary)" data-slot="layer_3">layer_3</text>
  <text x="100" y="248" class="gloss" dominant-baseline="central" data-slot="layer_3_gloss">layer_3_gloss</text>
