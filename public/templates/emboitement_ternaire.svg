  <text x="100" y="310" class="label-strong" dominant-baseline="central" fill="var(--primary)" data-slot="layer_4">layer_4</text>
  <text x="100" y="328" class="gloss" dominant-baseline="central" data-slot="layer_4_gloss">layer_4_gloss</text>
