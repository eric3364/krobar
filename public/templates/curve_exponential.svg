<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="Plus Jakarta Sans, system-ui, sans-serif">
  <rect width="1040" height="600" fill="var(--bg)"/>
  <text x="105" y="72" font-size="13" font-weight="600" fill="var(--text)" opacity="0.55" style="text-transform: uppercase;">Courbe Croissance</text>
  <foreignObject x="60" y="90" width="920" height="56">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="width:100%;height:100%;display:flex;align-items:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:36px;color:var(--text);box-sizing:border-box;">Croissance exponentielle</div>
  </foreignObject>
  <g transform="translate(100, 200)">
    <line x1="0" y1="300" x2="700" y2="300" stroke="var(--text)" stroke-width="2" opacity="0.3"/>
    <line x1="0" y1="300" x2="0" y2="0" stroke="var(--text)" stroke-width="2" opacity="0.3"/>
    <path d="M 0 290 Q 100 280 200 240 Q 300 180 400 100 Q 500 40 600 10" fill="none" stroke="var(--primary)" stroke-width="4"/>
    <foreignObject x="-180" y="-10" width="180" height="20">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="y_max" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-end;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:14px;color:var(--text);opacity:0.7;box-sizing:border-box;">1M€</div>
    </foreignObject>
    <foreignObject x="-180" y="110" width="180" height="20">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="y_mid" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-end;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:14px;color:var(--text);opacity:0.7;box-sizing:border-box;">500K€</div>
    </foreignObject>
  </g>
  <text x="60" y="580" font-size="11" font-weight="600" fill="var(--text)" opacity="0.5" style="text-transform: uppercase;">Krobar · Charts</text>
</svg>
