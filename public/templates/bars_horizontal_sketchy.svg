<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="Plus Jakarta Sans, system-ui, sans-serif">
  <defs>
    <filter id="editorialShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="var(--primary)" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="1040" height="600" fill="var(--bg)"/>

  <!-- Header icon + label -->
  <g transform="translate(60, 60)" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="8" y="16" width="4" height="8"/>
    <rect x="14" y="12" width="4" height="12"/>
    <rect x="20" y="8" width="4" height="16"/>
  </g>

  <text x="105" y="72" font-size="13" font-weight="600" letter-spacing="1.04" fill="var(--text)" opacity="0.55" style="text-transform: uppercase;">Barres Horizontales</text>

  <!-- Main title -->
  <foreignObject x="60" y="90" width="920" height="56">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:36px;letter-spacing:-0.01em;color:var(--text);box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Performance par équipe</div>
  </foreignObject>

  <!-- Accent line -->
  <line x1="60" y1="160" x2="148" y2="160" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>

  <!-- Chart area with anti-collision zones -->
  <g transform="translate(60, 200)">
    
    <!-- Bar 1 - Zone sécurisée 180px pour label -->
    <foreignObject x="0" y="0" width="180" height="40">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="bar_1_label" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);line-height:1.2;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Équipe Alpha</div>
    </foreignObject>
    
    <!-- Sketchy bar 1 - Décalée avec offset sécurité 50px -->
    <path d="M 250 8 L 480 8 C 482 9 483 10 482 12 L 252 12 C 250 11 249 9 250 8 Z" 
          fill="var(--primary)" fill-opacity="0.8" 
          stroke="var(--primary)" stroke-width="1.5"/>
    <path d="M 250 28 L 480 28 C 482 29 483 30 482 32 L 252 32 C 250 31 249 29 250 28 Z" 
          fill="var(--primary)" fill-opacity="0.3"/>
    
    <!-- Valeur positionnée après la barre la plus longue + offset -->
    <foreignObject x="530" y="0" width="80" height="40">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="bar_1_value" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);opacity:0.8;line-height:1.2;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">85%</div>
    </foreignObject>

    <!-- Bar 2 - Zone sécurisée -->
    <foreignObject x="0" y="70" width="180" height="40">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="bar_2_label" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);line-height:1.2;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Équipe Beta</div>
    </foreignObject>
    
    <!-- Sketchy bar 2 -->
    <path d="M 250 78 L 420 78 C 422 79 423 80 422 82 L 252 82 C 250 81 249 79 250 78 Z" 
          fill="var(--accent)" fill-opacity="0.8" 
          stroke="var(--accent)" stroke-width="1.5"/>
    <path d="M 250 98 L 420 98 C 422 99 423 100 422 102 L 252 102 C 250 101 249 99 250 98 Z" 
          fill="var(--accent)" fill-opacity="0.3"/>
    
    <!-- Valeur zone fixe -->
    <foreignObject x="530" y="70" width="80" height="40">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="bar_2_value" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);opacity:0.8;line-height:1.2;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">72%</div>
    </foreignObject>

    <!-- Bar 3 - Zone sécurisée -->
    <foreignObject x="0" y="140" width="180" height="40">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="bar_3_label" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);line-height:1.2;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Équipe Gamma</div>
    </foreignObject>
    
    <!-- Sketchy bar 3 -->
    <path d="M 250 148 L 380 148 C 382 149 383 150 382 152 L 252 152 C 250 151 249 149 250 148 Z" 
          fill="var(--primary)" fill-opacity="0.6" 
          stroke="var(--primary)" stroke-width="1.5"/>
    <path d="M 250 168 L 380 168 C 382 169 383 170 382 172 L 252 172 C 250 171 249 169 250 168 Z" 
          fill="var(--primary)" fill-opacity="0.2"/>
    
    <!-- Valeur zone fixe -->
    <foreignObject x="530" y="140" width="80" height="40">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="bar_3_value" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);opacity:0.8;line-height:1.2;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">64%</div>
    </foreignObject>

    <!-- Bar 4 - Zone sécurisée -->
    <foreignObject x="0" y="210" width="180" height="40">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="bar_4_label" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);line-height:1.2;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Équipe Delta</div>
    </foreignObject>
    
    <!-- Sketchy bar 4 -->
    <path d="M 250 218 L 340 218 C 342 219 343 220 342 222 L 252 222 C 250 221 249 219 250 218 Z" 
          fill="var(--accent)" fill-opacity="0.6" 
          stroke="var(--accent)" stroke-width="1.5"/>
    <path d="M 250 238 L 340 238 C 342 239 343 240 342 242 L 252 242 C 250 241 249 239 250 238 Z" 
          fill="var(--accent)" fill-opacity="0.2"/>
    
    <!-- Valeur zone fixe -->
    <foreignObject x="530" y="210" width="80" height="40">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="bar_4_value" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);opacity:0.8;line-height:1.2;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">48%</div>
    </foreignObject>

  </g>

  <!-- Footer -->
  <text x="60" y="580" font-size="11" font-weight="600" letter-spacing="0.88" fill="var(--text)" opacity="0.5" style="text-transform: uppercase;">Krobar · Charts</text>
</svg>
