<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Plus Jakarta Sans, system-ui, sans-serif">
  <defs>
    <filter id="markerRough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence baseFrequency="0.3" numOctaves="2" result="turbulence"/>
      <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="1.5"/>
    </filter>
    <pattern id="whiteboardGrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="var(--text)" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="1000" height="600" fill="#fefefe"/>
  <rect width="1000" height="600" fill="url(#whiteboardGrid)"/>
  
  <text x="105" y="72" font-size="13" font-weight="600" fill="var(--text)" opacity="0.55" style="text-transform: uppercase;">Effet Tableau Blanc</text>
  <foreignObject x="60" y="90" width="880" height="56">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="width:100%;height:100%;display:flex;align-items:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:36px;color:var(--text);box-sizing:border-box;">Brainstorming sur tableau blanc</div>
  </foreignObject>

  <!-- Whiteboard elements -->
  <rect x="150" y="200" width="180" height="100" rx="8" fill="none" stroke="#2563eb" stroke-width="3" filter="url(#markerRough)"/>
  <foreignObject x="160" y="230" width="180" height="40">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="idea_1" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:#2563eb;box-sizing:border-box;">Analyse</div>
  </foreignObject>

  <rect x="400" y="180" width="180" height="100" rx="8" fill="none" stroke="#dc2626" stroke-width="3" filter="url(#markerRough)"/>
  <foreignObject x="410" y="210" width="180" height="40">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="idea_2" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:#dc2626;box-sizing:border-box;">Design</div>
  </foreignObject>

  <rect x="650" y="220" width="180" height="100" rx="8" fill="none" stroke="#16a34a" stroke-width="3" filter="url(#markerRough)"/>
  <foreignObject x="660" y="250" width="180" height="40">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="idea_3" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:#16a34a;box-sizing:border-box;">Tests</div>
  </foreignObject>

  <circle cx="500" cy="400" r="80" fill="none" stroke="#f59e0b" stroke-width="4" filter="url(#markerRough)"/>
  <foreignObject x="420" y="385" width="180" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="synthesis" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:18px;color:#f59e0b;box-sizing:border-box;">Solution</div>
  </foreignObject>

  <text x="60" y="580" font-size="11" font-weight="600" fill="var(--text)" opacity="0.5" style="text-transform: uppercase;">Krobar · Whiteboard</text>
</svg>
