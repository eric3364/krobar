<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="Plus Jakarta Sans, system-ui, sans-serif">
  <defs>
    <filter id="editorialShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="var(--primary)" flood-opacity="0.05"/>
    </filter>
    <marker id="arrowBPS" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1040" height="600" fill="var(--bg)"/>

  <g transform="translate(60, 60)" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M3 22h22"/>
    <path d="M6 22V14a8 8 0 0 1 16 0v8"/>
    <path d="M10 22v-8M18 22v-8M14 22v-8"/>
  </g>

  <text x="105" y="72" font-size="13" font-weight="600" letter-spacing="1.04" fill="var(--text)" opacity="0.55" style="text-transform: uppercase;">Pont · Problème → Solution</text>

  <foreignObject x="60" y="90" width="920" height="56">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:36px;letter-spacing:-0.01em;color:var(--text);box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Du problème à la solution</div>
  </foreignObject>

  <line x1="60" y1="160" x2="148" y2="160" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>

  <g filter="url(#editorialShadow)">
    <rect x="60" y="200" width="920" height="360" rx="12" fill="#FFFFFF" stroke="var(--text)" stroke-opacity="0.12" stroke-width="1"/>
  </g>

  <g>
    <rect x="100" y="270" width="240" height="220" rx="12" fill="#FFFFFF" stroke="var(--primary)" stroke-width="2" stroke-opacity="0.7" id="problem_label"/>
    <path d="M 100,282 A 12,12 0 0,1 112,270 L 328,270 A 12,12 0 0,1 340,282 L 340,282 L 100,282 Z" fill="var(--primary)" opacity="0.7"/>
    <text x="120" y="304" font-size="11" font-weight="700" fill="var(--primary)" opacity="0.55" style="text-transform: uppercase; letter-spacing: 0.06em;">Problème</text>
    <foreignObject x="120" y="312" width="200" height="36" data-shape="problem_label">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="problem_label" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:18px;color:var(--text);box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Côté problème</div>
    </foreignObject>
    <circle cx="128" cy="380" r="3" fill="var(--primary)" opacity="0.6"/>
    <foreignObject x="145" y="365" width="180" height="32" data-shape="problem_label">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="problem_item_1" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:500;font-size:12px;color:var(--text);line-height:1.4;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Constat 1</div>
    </foreignObject>
    <circle cx="128" cy="430" r="3" fill="var(--primary)" opacity="0.6"/>
    <foreignObject x="145" y="415" width="180" height="32" data-shape="problem_label">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="problem_item_2" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:500;font-size:12px;color:var(--text);line-height:1.4;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Constat 2</div>
    </foreignObject>
  </g>

  <line x1="340" y1="380" x2="400" y2="380" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowBPS)" data-from="problem_label" data-to="bridge_step_1"/>

  <g>
    <rect x="410" y="320" width="220" height="60" rx="12" fill="var(--accent)" id="bridge_step_1"/>
    <text x="425" y="342" font-size="10" font-weight="700" fill="var(--bg)" opacity="0.75" style="text-transform: uppercase; letter-spacing: 0.06em;">Étape 1</text>
    <foreignObject x="425" y="346" width="190" height="30" data-shape="bridge_step_1">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="bridge_step_1" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:13px;color:var(--bg);line-height:1.3;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Action</div>
    </foreignObject>
  </g>

  <g>
    <rect x="410" y="400" width="220" height="60" rx="12" fill="var(--accent)" id="bridge_step_2"/>
    <text x="425" y="422" font-size="10" font-weight="700" fill="var(--bg)" opacity="0.75" style="text-transform: uppercase; letter-spacing: 0.06em;">Étape 2</text>
    <foreignObject x="425" y="426" width="190" height="30" data-shape="bridge_step_2">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="bridge_step_2" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:13px;color:var(--bg);line-height:1.3;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Action</div>
    </foreignObject>
  </g>

  <line x1="640" y1="380" x2="700" y2="380" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowBPS)" data-from="bridge_step_1" data-to="solution_label"/>

  <g>
    <rect x="710" y="270" width="240" height="220" rx="12" fill="#FFFFFF" stroke="var(--accent)" stroke-width="2" id="solution_label"/>
    <path d="M 710,282 A 12,12 0 0,1 722,270 L 938,270 A 12,12 0 0,1 950,282 L 950,282 L 710,282 Z" fill="var(--accent)"/>
    <text x="730" y="304" font-size="11" font-weight="700" fill="var(--accent)" style="text-transform: uppercase; letter-spacing: 0.06em;">Solution</text>
    <foreignObject x="730" y="312" width="200" height="36" data-shape="solution_label">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="solution_label" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:18px;color:var(--text);box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Côté solution</div>
    </foreignObject>
    <circle cx="738" cy="380" r="3" fill="var(--accent)"/>
    <foreignObject x="755" y="365" width="180" height="32" data-shape="solution_label">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="solution_item_1" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:500;font-size:12px;color:var(--text);line-height:1.4;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Bénéfice 1</div>
    </foreignObject>
    <circle cx="738" cy="430" r="3" fill="var(--accent)"/>
    <foreignObject x="755" y="415" width="180" height="32" data-shape="solution_label">
      <div xmlns="http://www.w3.org/1999/xhtml" data-slot="solution_item_2" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:500;font-size:12px;color:var(--text);line-height:1.4;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Bénéfice 2</div>
    </foreignObject>
  </g>

  <text x="60" y="585" font-size="11" font-weight="600" letter-spacing="0.88" fill="var(--text)" opacity="0.5" style="text-transform: uppercase;">Krobar · Bridge</text>
</svg>
