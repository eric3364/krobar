<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Inter, system-ui, sans-serif">
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="var(--bg)"/>

  <foreignObject x="20" y="10" width="760" height="40">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:clamp(16px,2.6cqw,22px);color:var(--text);padding:6px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Du problème à la solution</div>
  </foreignObject>

  <!-- Left cliff (problem) -->
  <g filter="url(#soft-shadow)">
    <path d="M 30 250 L 230 250 L 240 560 L 30 560 Z" fill="var(--accent)" fill-opacity="0.85"/>
  </g>
  <foreignObject x="35" y="265" width="190" height="36">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="problem_label" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:800;font-size:clamp(13px,2.6cqw,18px);color:var(--bg);padding:4px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Problème</div>
  </foreignObject>
  <foreignObject x="35" y="310" width="190" height="80">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="problem_item_1" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-size:clamp(11px,2cqw,14px);color:var(--bg);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Symptôme 1</div>
  </foreignObject>
  <foreignObject x="35" y="400" width="190" height="80">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="problem_item_2" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-size:clamp(11px,2cqw,14px);color:var(--bg);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Symptôme 2</div>
  </foreignObject>

  <!-- Right cliff (solution) -->
  <g filter="url(#soft-shadow)">
    <path d="M 570 250 L 770 250 L 770 560 L 560 560 Z" fill="var(--primary)"/>
  </g>
  <foreignObject x="575" y="265" width="190" height="36">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="solution_label" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:800;font-size:clamp(13px,2.6cqw,18px);color:var(--bg);padding:4px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Solution</div>
  </foreignObject>
  <foreignObject x="575" y="310" width="190" height="80">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="solution_item_1" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-size:clamp(11px,2cqw,14px);color:var(--bg);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Bénéfice 1</div>
  </foreignObject>
  <foreignObject x="575" y="400" width="190" height="80">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="solution_item_2" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-size:clamp(11px,2cqw,14px);color:var(--bg);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Bénéfice 2</div>
  </foreignObject>

  <!-- Bridge: arch + deck spanning the gap (230 → 570 at y≈250) -->
  <!-- Deck -->
  <g filter="url(#soft-shadow)">
    <rect x="230" y="240" width="340" height="20" rx="6" fill="var(--text)" opacity="0.85"/>
  </g>
  <!-- Arch beneath -->
  <path d="M 240 260 Q 400 360 560 260" stroke="var(--text)" stroke-width="3" fill="none" opacity="0.55"/>
  <!-- Suspension cables (decorative) -->
  <line x1="290" y1="240" x2="290" y2="290" stroke="var(--text)" stroke-width="1.5" opacity="0.45"/>
  <line x1="350" y1="240" x2="350" y2="320" stroke="var(--text)" stroke-width="1.5" opacity="0.45"/>
  <line x1="450" y1="240" x2="450" y2="320" stroke="var(--text)" stroke-width="1.5" opacity="0.45"/>
  <line x1="510" y1="240" x2="510" y2="290" stroke="var(--text)" stroke-width="1.5" opacity="0.45"/>

  <!-- Bridge step labels (under the arch) -->
  <g filter="url(#soft-shadow)">
    <rect x="255" y="380" width="130" height="60" rx="12" fill="var(--accent)" opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
    <rect x="415" y="380" width="130" height="60" rx="12" fill="var(--primary)" opacity="0.18" stroke="var(--primary)" stroke-width="2"/>
  </g>
  <foreignObject x="255" y="380" width="130" height="60">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="bridge_step_1" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(11px,2.4cqw,13px);color:var(--text);padding:6px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Levier 1</div>
  </foreignObject>
  <foreignObject x="415" y="380" width="130" height="60">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="bridge_step_2" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(11px,2.4cqw,13px);color:var(--text);padding:6px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Levier 2</div>
  </foreignObject>

  <!-- Connecting lines from arch to step labels -->
  <line x1="320" y1="320" x2="320" y2="380" stroke="var(--text)" stroke-width="1.5" opacity="0.45"/>
  <line x1="480" y1="320" x2="480" y2="380" stroke="var(--text)" stroke-width="1.5" opacity="0.45"/>
</svg>
