<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="Plus Jakarta Sans, system-ui, sans-serif">
  <defs>
    <linearGradient id="flowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:var(--primary);stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:var(--accent);stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:var(--primary);stop-opacity:0.4"/>
    </linearGradient>
    <marker id="flowArrow" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="var(--primary)" opacity="0.8"/>
    </marker>
  </defs>

  <rect width="1200" height="400" fill="var(--bg)"/>
  <text x="105" y="72" font-size="13" font-weight="600" fill="var(--text)" opacity="0.55" style="text-transform: uppercase;">Flux Continu</text>
  <foreignObject x="60" y="90" width="1080" height="56">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="width:100%;height:100%;display:flex;align-items:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:36px;color:var(--text);box-sizing:border-box;">Flux de données et transitions</div>
  </foreignObject>

  <!-- Main flowing ribbon -->
  <path d="M 80 200 Q 200 150 320 200 Q 440 250 560 200 Q 680 150 800 200 Q 920 250 1040 200" 
        stroke="url(#flowGradient)" stroke-width="15" fill="none" marker-end="url(#flowArrow)"/>

  <!-- Flow stage labels -->
  <foreignObject x="100" y="120" width="180" height="40">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="flow_start" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Données brutes</div>
  </foreignObject>

  <foreignObject x="300" y="260" width="180" height="40">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="flow_process" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Traitement</div>
  </foreignObject>

  <foreignObject x="500" y="120" width="180" height="40">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="flow_transform" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Transformation</div>
  </foreignObject>

  <foreignObject x="700" y="260" width="180" height="40">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="flow_refine" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Raffinement</div>
  </foreignObject>

  <foreignObject x="900" y="120" width="180" height="40">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="flow_output" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Résultat final</div>
  </foreignObject>

  <!-- Secondary flow lines -->
  <path d="M 80 230 Q 150 280 220 230 Q 290 180 360 230" 
        stroke="var(--accent)" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M 840 170 Q 910 120 980 170 Q 1050 220 1120 170" 
        stroke="var(--accent)" stroke-width="3" fill="none" opacity="0.5"/>

  <text x="60" y="380" font-size="11" font-weight="600" fill="var(--text)" opacity="0.5" style="text-transform: uppercase;">Krobar · Flow</text>
</svg>
