<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Inter, system-ui, sans-serif">
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ce-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)"/>
    </marker>
  </defs>

  <rect width="800" height="600" fill="var(--bg)"/>

  <foreignObject x="20" y="20" width="760" height="50">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:clamp(18px,3cqw,26px);color:var(--text);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Causes et effet</div>
  </foreignObject>

  <!-- 3 cause boxes on the left, evenly spaced -->
  <g filter="url(#soft-shadow)">
    <rect x="40"  y="120" width="240" height="100" rx="12" fill="var(--accent)" opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
    <rect x="40"  y="260" width="240" height="100" rx="12" fill="var(--accent)" opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
    <rect x="40"  y="400" width="240" height="100" rx="12" fill="var(--accent)" opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
  </g>
  <foreignObject x="40" y="120" width="240" height="100">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="cause_1" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(11px,2cqw,15px);color:var(--text);padding:10px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Cause 1</div>
  </foreignObject>
  <foreignObject x="40" y="260" width="240" height="100">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="cause_2" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(11px,2cqw,15px);color:var(--text);padding:10px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Cause 2</div>
  </foreignObject>
  <foreignObject x="40" y="400" width="240" height="100">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="cause_3" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(11px,2cqw,15px);color:var(--text);padding:10px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Cause 3</div>
  </foreignObject>

  <!-- Effect box on the right (centered vertically) -->
  <g filter="url(#soft-shadow)">
    <rect x="500" y="240" width="260" height="160" rx="12" fill="var(--primary)"/>
  </g>
  <foreignObject x="500" y="240" width="260" height="160">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="effect" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:clamp(13px,2.6cqw,20px);color:var(--bg);padding:14px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Effet</div>
  </foreignObject>

  <!-- Convergent arrows from each cause to the effect box -->
  <path d="M 280 170 Q 400 170 500 290" stroke="var(--accent)" stroke-width="3" fill="none" marker-end="url(#ce-arrow)"/>
  <path d="M 280 310 L 495 320" stroke="var(--accent)" stroke-width="3" fill="none" marker-end="url(#ce-arrow)"/>
  <path d="M 280 450 Q 400 450 500 350" stroke="var(--accent)" stroke-width="3" fill="none" marker-end="url(#ce-arrow)"/>
</svg>
