<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="Plus Jakarta Sans, system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--accent)"/>
    </marker>
  </defs>
  
  <rect width="1040" height="600" fill="var(--bg)"/>
  <text x="105" y="72" font-size="13" font-weight="600" fill="var(--text)" opacity="0.55" style="text-transform: uppercase;">Cause à Effet</text>
  <foreignObject x="60" y="90" width="920" height="56">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="width:100%;height:100%;display:flex;align-items:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:36px;color:var(--text);box-sizing:border-box;">Analyse cause-effet</div>
  </foreignObject>
  
  <!-- Cause 1 -->
  <rect x="80" y="200" width="180" height="60" rx="8" fill="var(--primary)" fill-opacity="0.1" stroke="var(--primary)" stroke-width="2" id="cause_1">
  <foreignObject x="90" y="220" width="180" height="20" data-shape="cause_1">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="cause_1" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Manque de formation</div>
  </foreignObject>
  
  <!-- Arrow 1 -->
  <line x1="260" y1="230" x2="360" y2="300" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow)" data-from="cause_1" data-to="problem"/>
  
  <!-- Cause 2 -->
  <rect x="80" y="320" width="180" height="60" rx="8" fill="var(--primary)" fill-opacity="0.1" stroke="var(--primary)" stroke-width="2" id="cause_2">
  <foreignObject x="90" y="340" width="180" height="20" data-shape="cause_2">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="cause_2" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Outils inadéquats</div>
  </foreignObject>
  
  <!-- Arrow 2 -->
  <line x1="260" y1="350" x2="360" y2="320" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow)" data-from="cause_2" data-to="problem"/>
  
  <!-- Cause 3 -->
  <rect x="80" y="440" width="180" height="60" rx="8" fill="var(--primary)" fill-opacity="0.1" stroke="var(--primary)" stroke-width="2" id="cause_3">
  <foreignObject x="90" y="460" width="180" height="20" data-shape="cause_3">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="cause_3" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Processus défaillant</div>
  </foreignObject>
  
  <!-- Arrow 3 -->
  <line x1="260" y1="470" x2="360" y2="340" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow)" data-from="cause_3" data-to="problem"/>
  
  <!-- Problem (center) -->
  <rect x="380" y="280" width="180" height="80" rx="12" fill="var(--accent)" fill-opacity="0.2" stroke="var(--accent)" stroke-width="3" id="problem">
  <foreignObject x="390" y="310" width="180" height="20" data-shape="problem">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="problem" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:18px;color:var(--text);box-sizing:border-box;">Problème qualité</div>
  </foreignObject>
  
  <!-- Arrow to effect -->
  <line x1="560" y1="320" x2="640" y2="320" stroke="var(--accent)" stroke-width="3" marker-end="url(#arrow)" data-from="problem" data-to="effect"/>
  
  <!-- Effect -->
  <rect x="660" y="280" width="180" height="80" rx="12" fill="var(--primary)" fill-opacity="0.2" stroke="var(--primary)" stroke-width="3" id="effect">
  <foreignObject x="670" y="310" width="180" height="20" data-shape="effect">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="effect" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:18px;color:var(--text);box-sizing:border-box;">Perte de clients</div>
  </foreignObject>
  
  <text x="60" y="580" font-size="11" font-weight="600" fill="var(--text)" opacity="0.5" style="text-transform: uppercase;">Krobar · Analysis</text>
</svg>
