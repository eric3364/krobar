  <text x="60" y="170" class="label" text-anchor="middle" fill="var(--cool)" data-slot="level_1">level_1</text>
  <text x="60" y="245" class="gloss" text-anchor="middle" data-slot="level_1_gloss">level_1_gloss</text>
