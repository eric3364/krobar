  <text x="340" y="170" class="label" text-anchor="middle" fill="var(--text)" data-slot="level_3">level_3</text>
  <text x="340" y="245" class="gloss" text-anchor="middle" data-slot="level_3_gloss">level_3_gloss</text>
  <text x="480" y="170" class="label" text-anchor="middle" fill="var(--text)" data-slot="level_4">level_4</text>
