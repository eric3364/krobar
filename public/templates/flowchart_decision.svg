<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="Plus Jakarta Sans, system-ui, sans-serif">
  <defs>
    <filter id="editorialShadow"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="var(--primary)" flood-opacity="0.05"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="var(--accent)"/></marker>
  </defs>
  <rect width="1040" height="600" fill="var(--bg)"/>
  <g transform="translate(60, 60)" stroke="var(--accent)" stroke-width="1.5" fill="none">
    <rect x="8" y="8" width="16" height="12" rx="2"/>
    <path d="M16 20 L20 24 L16 28 L12 24 Z"/>
  </g>
  <text x="105" y="72" font-size="13" font-weight="600" letter-spacing="1.04" fill="var(--text)" opacity="0.55" style="text-transform: uppercase;">Organigramme</text>
  <foreignObject x="60" y="90" width="920" height="56">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:36px;letter-spacing:-0.01em;color:var(--text);box-sizing:border-box;word-wrap:break-word;">Processus de validation</div>
  </foreignObject>
  <line x1="60" y1="160" x2="148" y2="160" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
  <rect x="420" y="200" width="200" height="60" rx="8" fill="var(--primary)" fill-opacity="0.1" stroke="var(--primary)" stroke-width="2" id="start_step"/>
  <foreignObject x="430" y="215" width="180" height="30" data-shape="start_step">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="start_step" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--text);box-sizing:border-box;">Demande reçue</div>
  </foreignObject>
  <line x1="520" y1="260" x2="520" y2="300" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 520 300 L 610 340 L 520 380 L 430 340 Z" fill="var(--accent)" fill-opacity="0.1" stroke="var(--accent)" stroke-width="2"/>
  <foreignObject x="470" y="325" width="100" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="decision_question" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:600;font-size:14px;color:var(--text);box-sizing:border-box;">Conforme ?</div>
  </foreignObject>
  <text x="60" y="580" font-size="11" font-weight="600" letter-spacing="0.88" fill="var(--text)" opacity="0.5" style="text-transform: uppercase;">Krobar · Process</text>
</svg>
