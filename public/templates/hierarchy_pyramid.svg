<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="Inter, system-ui, sans-serif">
  <rect width="1040" height="600" fill="var(--bg)"/>
  <foreignObject x="20" y="20" width="1000" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:clamp(20px,2.4vw,30px);color:var(--text);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Titre de la pyramide</div>
  </foreignObject>

  <polygon points="520,110 624,250 416,250" fill="var(--primary)"/>
  <foreignObject x="416" y="180" width="208" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="top_label" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(12px,1.3vw,16px);color:var(--bg);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Sommet</div>
  </foreignObject>

  <polygon points="416,260 624,260 728,400 312,400" fill="var(--accent)"/>
  <foreignObject x="312" y="290" width="416" height="110">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="middle_label" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(13px,1.4vw,18px);color:var(--bg);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Milieu</div>
  </foreignObject>

  <polygon points="312,410 728,410 858,560 182,560" fill="var(--primary)" opacity="0.7"/>
  <foreignObject x="200" y="430" width="640" height="120">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="bottom_label" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(14px,1.5vw,20px);color:var(--bg);padding:8px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Base</div>
  </foreignObject>
</svg>
