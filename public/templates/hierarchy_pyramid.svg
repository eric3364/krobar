<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="Plus Jakarta Sans, system-ui, sans-serif">
  <defs>
    <filter id="editorialShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="var(--primary)" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="1040" height="600" fill="var(--bg)"/>

  <g transform="translate(60, 60)" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M14 3 L26 25 L2 25 Z"/>
    <path d="M14 3 L20 14"/>
    <path d="M14 3 L8 14"/>
  </g>

  <text x="105" y="72" font-size="13" font-weight="600" letter-spacing="1.04" fill="var(--text)" opacity="0.55" style="text-transform: uppercase;">Hiérarchie · 3 niveaux</text>

  <foreignObject x="60" y="90" width="920" height="56">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:36px;letter-spacing:-0.01em;color:var(--text);box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Titre de la pyramide</div>
  </foreignObject>

  <line x1="60" y1="160" x2="148" y2="160" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>

  <g filter="url(#editorialShadow)">
    <rect x="60" y="200" width="920" height="360" rx="12" fill="#FFFFFF" stroke="var(--text)" stroke-opacity="0.12" stroke-width="1"/>
  </g>

  <polygon points="520,240 600,330 440,330" fill="var(--accent)"/>
  <foreignObject x="370" y="265" width="180" height="50">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="top_label" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-end;text-align:right;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:18px;color:var(--text);box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Sommet</div>
  </foreignObject>
  <line x1="555" y1="290" x2="595" y2="290" stroke="var(--text)" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="2,3"/>

  <polygon points="600,340 680,430 360,430 440,340" fill="var(--accent)" opacity="0.5"/>
  <foreignObject x="120" y="365" width="220" height="50">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="middle_label" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-end;text-align:right;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:18px;color:var(--text);box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Milieu</div>
  </foreignObject>
  <line x1="345" y1="390" x2="395" y2="390" stroke="var(--text)" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="2,3"/>

  <polygon points="680,440 760,530 280,530 360,440" fill="var(--text)" opacity="0.18"/>
  <foreignObject x="120" y="465" width="140" height="50">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="bottom_label" style="width:100%;height:100%;display:flex;align-items:center;justify-content:flex-end;text-align:right;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:18px;color:var(--text);box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Base</div>
  </foreignObject>
  <line x1="265" y1="490" x2="315" y2="490" stroke="var(--text)" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="2,3"/>

  <text x="60" y="580" font-size="11" font-weight="600" letter-spacing="0.88" fill="var(--text)" opacity="0.5" style="text-transform: uppercase;">Krobar · Hierarchy</text>
</svg>
