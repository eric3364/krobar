<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Inter, system-ui, sans-serif">
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="ice-clip">
      <!-- Iceberg shape: tip at top narrows, large mass at bottom -->
      <polygon points="400,90 540,210 600,330 580,450 470,560 330,560 220,450 200,330 260,210"/>
    </clipPath>
  </defs>

  <rect width="800" height="600" fill="var(--bg)"/>

  <foreignObject x="20" y="10" width="760" height="40">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:clamp(16px,2.6cqw,22px);color:var(--text);padding:6px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Modèle de l'iceberg</div>
  </foreignObject>

  <!-- Iceberg silhouette (filled with banded levels via clipPath) -->
  <g filter="url(#soft-shadow)">
    <!-- Visible part (above water) — accent -->
    <rect x="0" y="0" width="800" height="225" fill="var(--accent)" clip-path="url(#ice-clip)"/>
    <!-- Submerged level 1 (just under water) — primary @ 0.55 -->
    <rect x="0" y="225" width="800" height="115" fill="var(--primary)" fill-opacity="0.55" clip-path="url(#ice-clip)"/>
    <!-- Submerged level 2 (mid) — primary @ 0.75 -->
    <rect x="0" y="340" width="800" height="110" fill="var(--primary)" fill-opacity="0.75" clip-path="url(#ice-clip)"/>
    <!-- Submerged level 3 (deep) — primary opaque -->
    <rect x="0" y="450" width="800" height="120" fill="var(--primary)" clip-path="url(#ice-clip)"/>
    <!-- Outline -->
    <polygon points="400,90 540,210 600,330 580,450 470,560 330,560 220,450 200,330 260,210"
             fill="none" stroke="var(--text)" stroke-opacity="0.15" stroke-width="2"/>
  </g>

  <!-- Wavy waterline at y=225 (across full width) -->
  <path d="M 0 225 Q 50 215 100 225 T 200 225 T 300 225 T 400 225 T 500 225 T 600 225 T 700 225 T 800 225"
        stroke="var(--accent)" stroke-width="3" fill="none" opacity="0.85"/>
  <path d="M 0 235 Q 50 225 100 235 T 200 235 T 300 235 T 400 235 T 500 235 T 600 235 T 700 235 T 800 235"
        stroke="var(--accent)" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- Right-side annotation panels -->

  <!-- Visible label + item (above water) -->
  <line x1="540" y1="160" x2="610" y2="160" stroke="var(--text)" stroke-width="1.5" opacity="0.5"/>
  <foreignObject x="610" y="100" width="180" height="32">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="visible_label" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;text-align:left;font-family:Inter,system-ui,sans-serif;font-weight:800;font-size:clamp(11px,2.4cqw,14px);color:var(--accent);padding:4px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Visible</div>
  </foreignObject>
  <foreignObject x="610" y="135" width="180" height="60">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="visible_item" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;text-align:left;font-family:Inter,system-ui,sans-serif;font-size:clamp(11px,1.8cqw,13px);color:var(--text);padding:4px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Élément visible</div>
  </foreignObject>

  <!-- Level 1 -->
  <line x1="600" y1="285" x2="650" y2="285" stroke="var(--text)" stroke-width="1.5" opacity="0.5"/>
  <foreignObject x="650" y="260" width="140" height="50">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="level_1" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;text-align:left;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(11px,1.8cqw,13px);color:var(--text);padding:4px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Niveau 1</div>
  </foreignObject>

  <!-- Level 2 -->
  <line x1="595" y1="395" x2="650" y2="395" stroke="var(--text)" stroke-width="1.5" opacity="0.5"/>
  <foreignObject x="650" y="370" width="140" height="50">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="level_2" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;text-align:left;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(11px,1.8cqw,13px);color:var(--text);padding:4px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Niveau 2</div>
  </foreignObject>

  <!-- Level 3 -->
  <line x1="560" y1="505" x2="650" y2="505" stroke="var(--text)" stroke-width="1.5" opacity="0.5"/>
  <foreignObject x="650" y="480" width="140" height="50">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="level_3" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;text-align:left;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(11px,1.8cqw,13px);color:var(--text);padding:4px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Niveau 3</div>
  </foreignObject>
</svg>
