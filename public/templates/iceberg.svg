<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="sky-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="var(--accent)" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="water-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--primary)" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="var(--primary)" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="ice-top-grad" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="var(--bg)" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="var(--accent)" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="var(--accent)" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="ice-sub1" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="var(--primary)" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="var(--primary)" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="ice-sub2" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="var(--primary)" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="var(--primary)" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="ice-sub3" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="var(--primary)" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="var(--primary)" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="ice-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur-subtle">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <!-- Clip for above water (tip) -->
    <clipPath id="clip-above">
      <rect x="0" y="0" width="800" height="218"/>
    </clipPath>
    <!-- Clip for submerged zones -->
    <clipPath id="clip-sub1"><rect x="0" y="218" width="800" height="112"/></clipPath>
    <clipPath id="clip-sub2"><rect x="0" y="330" width="800" height="115"/></clipPath>
    <clipPath id="clip-sub3"><rect x="0" y="445" width="800" height="155"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="var(--bg)"/>
  <!-- Sky tint -->
  <rect width="800" height="218" fill="url(#sky-grad)"/>
  <!-- Water tint -->
  <rect y="218" width="800" height="382" fill="url(#water-grad)"/>

  <!-- Title -->
  <foreignObject x="20" y="10" width="760" height="40">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:clamp(16px,2.6cqw,22px);color:var(--text);padding:6px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Modèle de l'iceberg</div>
  </foreignObject>

  <!-- ===== ICEBERG SHAPE ===== -->
  <!-- Organic iceberg silhouette with curved edges -->
  <g filter="url(#ice-glow)">

    <!-- Above water: tip with highlight/frost effect -->
    <g clip-path="url(#clip-above)">
      <path d="M400,82 C410,82 430,110 455,145 Q480,178 510,200 Q530,212 540,218 L260,218 Q270,212 290,200 Q320,178 345,145 C370,110 390,82 400,82 Z"
            fill="url(#ice-top-grad)"/>
      <!-- Frost highlights -->
      <path d="M400,88 C405,88 418,108 432,135 Q440,152 450,170 L390,170 Q395,150 398,130 C399,115 397,88 400,88 Z"
            fill="var(--bg)" opacity="0.45"/>
      <path d="M380,130 Q385,140 370,165 L355,165 Q360,145 380,130 Z"
            fill="var(--bg)" opacity="0.25"/>
    </g>

    <!-- Submerged level 1 -->
    <g clip-path="url(#clip-sub1)">
      <path d="M260,218 L540,218 Q565,240 585,270 Q600,298 605,330 L195,330 Q200,298 215,270 Q235,240 260,218 Z"
            fill="url(#ice-sub1)"/>
      <!-- Subtle ice texture lines -->
      <line x1="280" y1="250" x2="520" y2="250" stroke="var(--primary)" stroke-opacity="0.08" stroke-width="1"/>
      <line x1="250" y1="285" x2="550" y2="285" stroke="var(--primary)" stroke-opacity="0.06" stroke-width="1"/>
    </g>

    <!-- Submerged level 2 -->
    <g clip-path="url(#clip-sub2)">
      <path d="M195,330 L605,330 Q600,365 590,395 Q575,425 565,445 L235,445 Q225,425 210,395 Q200,365 195,330 Z"
            fill="url(#ice-sub2)"/>
      <line x1="230" y1="370" x2="570" y2="370" stroke="var(--primary)" stroke-opacity="0.06" stroke-width="1"/>
      <line x1="240" y1="410" x2="560" y2="410" stroke="var(--primary)" stroke-opacity="0.05" stroke-width="1"/>
    </g>

    <!-- Submerged level 3 (deepest) -->
    <g clip-path="url(#clip-sub3)">
      <path d="M235,445 L565,445 Q555,475 530,505 Q500,540 470,558 Q440,572 400,575 Q360,572 330,558 Q300,540 270,505 Q245,475 235,445 Z"
            fill="url(#ice-sub3)"/>
      <line x1="265" y1="480" x2="535" y2="480" stroke="var(--primary)" stroke-opacity="0.05" stroke-width="1"/>
    </g>

    <!-- Subtle outer edge -->
    <path d="M400,82 C410,82 430,110 455,145 Q480,178 510,200 Q530,212 540,218 Q565,240 585,270 Q600,298 605,330 Q600,365 590,395 Q575,425 565,445 Q555,475 530,505 Q500,540 470,558 Q440,572 400,575 Q360,572 330,558 Q300,540 270,505 Q245,475 235,445 Q225,425 210,395 Q200,365 195,330 Q200,298 215,270 Q235,240 260,218 Q270,212 290,200 Q320,178 345,145 C370,110 390,82 400,82 Z"
          fill="none" stroke="var(--text)" stroke-opacity="0.10" stroke-width="1.5"/>
  </g>

  <!-- ===== WATERLINE ===== -->
  <path d="M0,218 Q30,210 60,218 T120,218 T180,218 T240,218 T300,218 T360,218 T420,218 T480,218 T540,218 T600,218 T660,218 T720,218 T780,218 L800,218"
        stroke="var(--accent)" stroke-width="2.5" fill="none" opacity="0.7"/>
  <path d="M0,226 Q40,219 80,226 T160,226 T240,226 T320,226 T400,226 T480,226 T560,226 T640,226 T720,226 L800,226"
        stroke="var(--accent)" stroke-width="1.5" fill="none" opacity="0.3"/>

  <!-- Small water ripples near iceberg -->
  <path d="M300,222 Q320,218 340,222" stroke="var(--accent)" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M460,222 Q480,218 500,222" stroke="var(--accent)" stroke-width="1" fill="none" opacity="0.3"/>

  <!-- ===== ANNOTATIONS ===== -->

  <!-- Visible label + item (above water) -->
  <line x1="510" y1="155" x2="610" y2="155" stroke="var(--text)" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.35"/>
  <foreignObject x="610" y="100" width="180" height="32">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="visible_label" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;text-align:left;font-family:Inter,system-ui,sans-serif;font-weight:800;font-size:clamp(11px,2.4cqw,14px);color:var(--accent);padding:4px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Visible</div>
  </foreignObject>
  <foreignObject x="610" y="135" width="180" height="60">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="visible_item" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;text-align:left;font-family:Inter,system-ui,sans-serif;font-size:clamp(11px,1.8cqw,13px);color:var(--text);padding:4px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Élément visible</div>
  </foreignObject>

  <!-- Level 1 -->
  <line x1="600" y1="280" x2="650" y2="280" stroke="var(--text)" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.35"/>
  <foreignObject x="650" y="255" width="140" height="50">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="level_1" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;text-align:left;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(11px,1.8cqw,13px);color:var(--text);padding:4px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Niveau 1</div>
  </foreignObject>

  <!-- Level 2 -->
  <line x1="585" y1="390" x2="650" y2="390" stroke="var(--text)" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.35"/>
  <foreignObject x="650" y="365" width="140" height="50">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="level_2" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;text-align:left;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(11px,1.8cqw,13px);color:var(--text);padding:4px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Niveau 2</div>
  </foreignObject>

  <!-- Level 3 -->
  <line x1="545" y1="500" x2="650" y2="500" stroke="var(--text)" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.35"/>
  <foreignObject x="650" y="475" width="140" height="50">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="level_3" style="container-type:inline-size;width:100%;height:100%;display:flex;align-items:center;text-align:left;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:clamp(11px,1.8cqw,13px);color:var(--text);padding:4px;box-sizing:border-box;word-wrap:break-word;overflow-wrap:break-word;">Niveau 3</div>
  </foreignObject>
</svg>