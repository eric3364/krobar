<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="Plus Jakarta Sans, system-ui, sans-serif">

  <!-- Définitions -->
  <defs>
    <!-- Dégradés essentiels (icebergs) : toujours visibles -->
    <linearGradient id="icebergTopGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:var(--bg);stop-opacity:1"/>
      <stop offset="100%" style="stop-color:var(--primary);stop-opacity:0.25"/>
    </linearGradient>
    <linearGradient id="icebergBottomGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:var(--accent);stop-opacity:0.45"/>
      <stop offset="100%" style="stop-color:var(--primary);stop-opacity:0.65"/>
    </linearGradient>
    <!-- Dégradés décoratifs (fonds environnement) -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:var(--bg);stop-opacity:1"/>
      <stop offset="100%" style="stop-color:var(--accent);stop-opacity:0.08"/>
    </linearGradient>
    <linearGradient id="seaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:var(--accent);stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:var(--primary);stop-opacity:0.25"/>
    </linearGradient>
  </defs>

  <!-- Fond blanc plein (essentiel) -->
  <rect width="1040" height="600" fill="var(--bg)"/>

  <!-- DÉCORATIF : fonds ciel et mer (visibles uniquement en mode magazine) -->
  <rect width="1040" height="335" fill="url(#skyGradient)" opacity="var(--decoration-opacity, 0)" id="title">
  <rect y="335" width="1040" height="265" fill="url(#seaGradient)" opacity="var(--decoration-opacity, 0)" id="hidden_content">

  <!-- Header label (essentiel) -->
  <text x="60" y="72" font-size="13" font-weight="600" fill="var(--text)" opacity="0.55"
        style="text-transform: uppercase; letter-spacing: 0.5px;">Modèle Iceberg</text>

  <!-- Titre principal (essentiel) -->
  <foreignObject x="60" y="90" width="920" height="56" data-shape="title">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="title"
         style="width:100%;height:100%;display:flex;align-items:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:36px;color:var(--text);box-sizing:border-box;">
      Analyse visible vs invisible
    </div>
  </foreignObject>

  <!-- ============================================ -->
  <!-- ICEBERG PIC ÉMERGÉ (essentiel : dégradé + contour) -->
  <!-- ============================================ -->
  <path d="M 425 335
           L 460 280
           L 478 248
           L 495 215
           L 512 188
           L 530 175
           L 548 195
           L 562 218
           L 578 245
           L 595 275
           L 615 308
           L 640 335 Z"
        fill="url(#icebergTopGradient)"
        stroke="var(--primary)" stroke-width="2"
        stroke-linejoin="round"/>

  <!-- ESSENTIEL : ombre interne sur le flanc droit pour donner du volume sans décor -->
  <path d="M 530 175 L 548 195 L 562 218 L 578 245 L 595 275 L 615 308 L 640 335 L 530 335 Z"
        fill="var(--primary)" fill-opacity="0.18"/>

  <!-- DÉCORATIF : reflets blancs supplémentaires (modelé fin) -->
  <path d="M 510 220 L 520 200 L 525 215 L 518 235 Z" fill="var(--bg)" opacity="calc(var(--decoration-opacity, 0) * 0.6)"/>
  <path d="M 545 225 L 555 245 L 552 260 L 542 245 Z" fill="var(--bg)" opacity="calc(var(--decoration-opacity, 0) * 0.4)"/>

  <!-- ============================================ -->
  <!-- LIGNE D'EAU PRINCIPALE (essentielle, ondulée) -->
  <!-- ============================================ -->
  <path d="M 60 335
           Q 130 332, 200 335
           Q 270 338, 340 335
           Q 410 332, 425 335
           L 640 335
           Q 710 338, 780 335
           Q 850 332, 920 335
           Q 970 338, 980 335"
        fill="none" stroke="var(--accent)" stroke-width="2.5" opacity="0.7"/>

  <!-- DÉCORATIF : ligne d'eau secondaire (effet profondeur) -->
  <path d="M 60 340 Q 200 343, 340 340 T 640 340 T 920 340 T 980 340"
        fill="none" stroke="var(--accent)" stroke-width="1"
        opacity="calc(var(--decoration-opacity, 0) * 0.35)"/>

  <!-- ============================================ -->
  <!-- ICEBERG MASSE IMMERGÉE (essentiel : dégradé + contour) -->
  <!-- ============================================ -->
  <path d="M 425 335
           L 360 358
           L 305 380
           L 268 408
           L 245 445
           L 235 488
           L 252 527
           L 285 555
           L 340 575
           L 410 583
           L 475 580
           L 530 585
           L 580 575
           L 640 565
           L 700 545
           L 745 510
           L 760 470
           L 740 432
           L 705 400
           L 660 372
           L 640 335 Z"
        fill="url(#icebergBottomGradient)"
        stroke="var(--accent)" stroke-width="2"
        stroke-linejoin="miter"/>

  <!-- ESSENTIEL : 2 stries internes pour suggérer la glace stratifiée même en plain -->
  <path d="M 270 410 L 380 415 L 510 412 L 640 415 L 730 410"
        stroke="var(--accent)" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M 270 530 L 400 535 L 510 532 L 620 535 L 720 530"
        stroke="var(--accent)" stroke-width="1" fill="none" opacity="0.3"/>

  <!-- DÉCORATIF : strie supplémentaire + facettes + reflets (enrichissement magazine) -->
  <g opacity="var(--decoration-opacity, 0)">
    <path d="M 250 470 L 380 475 L 510 472 L 640 475 L 750 470" stroke="var(--accent)" stroke-width="1" fill="none" opacity="0.4"/>
    <path d="M 305 380 L 340 410 L 305 445 L 268 408 Z"
          fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="0.5" opacity="0.4"/>
    <path d="M 660 372 L 705 400 L 685 440 L 640 410 Z"
          fill="var(--primary)" fill-opacity="0.1" stroke="var(--accent)" stroke-width="0.5" opacity="0.4"/>
    <path d="M 410 583 L 475 580 L 470 545 L 410 540 Z"
          fill="var(--accent)" fill-opacity="0.08" stroke="var(--accent)" stroke-width="0.5" opacity="0.3"/>
    <path d="M 360 358 L 305 380 L 268 408 L 245 445 L 260 460 L 290 420 L 330 385 L 380 365 Z"
          fill="var(--bg)" opacity="0.18"/>
  </g>

  <!-- ============================================ -->
  <!-- BLOCS TEXTES — STANDARD V2 (essentiels) -->
  <!-- ============================================ -->

  <text x="820" y="332" font-size="12" font-weight="600" fill="var(--accent)" opacity="0.75"
        style="text-transform: uppercase; letter-spacing: 0.5px;">
    Niveau de l'eau
  </text>

  <!-- Bloc PARTIE VISIBLE -->
  <rect x="650" y="200" width="280" height="48" rx="12"
        fill="var(--bg)" stroke="var(--primary)" stroke-width="1.5" id="visible_title">
  <foreignObject x="650" y="200" width="280" height="48" data-shape="visible_title">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="visible_title"
         style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:18px;color:var(--primary);box-sizing:border-box;padding:8px;line-height:1.3;">
      Partie visible
    </div>
  </foreignObject>

  <foreignObject x="650" y="252" width="280" height="72" data-shape="title">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="visible_content"
         style="width:100%;height:100%;display:flex;align-items:flex-start;justify-content:center;text-align:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:400;font-size:14px;color:var(--text);line-height:1.4;box-sizing:border-box;padding:8px;">
      Symptômes, comportements observables, résultats apparents
    </div>
  </foreignObject>

  <line x1="600" y1="245" x2="650" y2="225" stroke="var(--primary)" stroke-width="1.5" opacity="0.4" stroke-dasharray="3 3"/>

  <!-- Bloc PARTIE CACHÉE -->
  <rect x="80" y="430" width="280" height="48" rx="12"
        fill="var(--bg)" stroke="var(--accent)" stroke-width="1.5" id="hidden_title">
  <foreignObject x="80" y="430" width="280" height="48" data-shape="hidden_title">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="hidden_title"
         style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:700;font-size:18px;color:var(--accent);box-sizing:border-box;padding:8px;line-height:1.3;">
      Partie cachée
    </div>
  </foreignObject>

  <foreignObject x="80" y="482" width="280" height="80" data-shape="hidden_content">
    <div xmlns="http://www.w3.org/1999/xhtml" data-slot="hidden_content"
         style="width:100%;height:100%;display:flex;align-items:flex-start;justify-content:center;text-align:center;font-family:Plus Jakarta Sans,system-ui,sans-serif;font-weight:400;font-size:14px;color:var(--text);line-height:1.4;box-sizing:border-box;padding:8px;">
      Causes profondes, croyances, valeurs, systèmes sous-jacents
    </div>
  </foreignObject>

  <line x1="290" y1="465" x2="360" y2="455" stroke="var(--accent)" stroke-width="1.5" opacity="0.4" stroke-dasharray="3 3"/>

  <!-- Footer (essentiel) -->
  <text x="60" y="585" font-size="11" font-weight="600" fill="var(--text)" opacity="0.5"
        style="text-transform: uppercase; letter-spacing: 0.5px;">
    Krobar · Analyse
  </text>

</svg>
