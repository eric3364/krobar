<svg viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg">
  <style>
    .label-strong { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: 600; }
    .label { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 13px; font-weight: 500; }
    .gloss { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 11px; font-weight: 400; font-style: italic; fill: var(--muted); }
    .gloss-strong { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 11px; font-weight: 500; }
    .caption { font-family: Poppins, 'Helvetica Neue', Arial, sans-serif; font-size: 10px; font-weight: 400; font-style: italic; fill: var(--muted); }
    .axis { stroke: var(--border); stroke-width: 0.6; fill: none; }
  </style>

  <line x1="60" y1="320" x2="640" y2="320" stroke="var(--border)" stroke-width="0.8"/>
  <line x1="60" y1="60" x2="60" y2="320" stroke="var(--border)" stroke-width="0.8"/>
  <text x="65" y="45" class="gloss">{{y_axis_label}}</text>
  <text x="55" y="65" class="gloss" text-anchor="end">{{y_axis_top}}</text>
  <text x="55" y="320" class="gloss" text-anchor="end">{{y_axis_bottom}}</text>
  <text x="640" y="345" class="gloss" text-anchor="end">{{x_axis_label}}</text>
  <path d="M 100 100 Q 250 105 380 130 Q 500 160 620 220" fill="none" stroke="var(--primary)" stroke-width="2.2"/>
  <text x="120" y="85" class="label-strong" fill="var(--primary)">{{trajectory_descending_title}}</text>
  <text x="120" y="103" class="gloss" fill="var(--primary)">{{trajectory_descending_gloss}}</text>
  <path d="M 100 290 Q 220 280 340 230 Q 460 170 620 80" fill="none" stroke="var(--warm)" stroke-width="2.2"/>
  <text x="490" y="100" class="label-strong" fill="var(--warm)">{{trajectory_ascending_title}}</text>
  <text x="490" y="60" class="gloss" fill="var(--warm)">{{trajectory_ascending_gloss_1}}</text>
  <text x="490" y="78" class="gloss" fill="var(--warm)">  {{trajectory_ascending_gloss_2}}</text>
  <circle cx="430" cy="200" r="9" fill="var(--bg)" stroke="var(--tertiary)" stroke-width="2"/>
  <line x1="430" y1="200" x2="430" y2="240" stroke="var(--tertiary)" stroke-width="0.8" stroke-dasharray="2 2"/>
  <text x="430" y="260" class="label-strong" text-anchor="middle" fill="var(--tertiary)">{{crossing_label_line1}}</text>
  <text x="430" y="278" class="label-strong" text-anchor="middle" fill="var(--tertiary)">{{crossing_label_line2}}</text>
  <text x="220" y="345" class="gloss" text-anchor="middle">{{phase_before_label}}</text>
  <text x="540" y="345" class="gloss" text-anchor="middle">{{phase_after_label}}</text>
  <line x1="80" y1="335" x2="380" y2="335" stroke="var(--border)" stroke-width="0.6"/>
  <line x1="490" y1="335" x2="620" y2="335" stroke="var(--border)" stroke-width="0.6"/>
</svg>